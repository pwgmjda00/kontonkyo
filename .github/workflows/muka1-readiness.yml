name: Inspect MUKA-1 readiness (read-only)
on:
  push:
    branches: ['codex/muka1-integration-v2']
    paths: ['.github/workflows/muka1-readiness.yml', 'muka1-backend/tools/readiness.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MUKA1_BACKUP_KEY: ${{ secrets.MUKA1_BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect configuration and existing resources without mutation
        run: node muka1-backend/tools/readiness.mjs
