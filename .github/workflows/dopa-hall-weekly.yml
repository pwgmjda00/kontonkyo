name: Daily Dopa Community Hall

on:
  schedule:
    - cron: '12 0 * * *' # Every day 09:12 JST (GitHub may run later)
  workflow_dispatch:

concurrency:
  group: dopa-hall-daily
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dopa-button/package-lock.json
      - name: Install site dependencies
        run: npm ci --prefix dopa-button
      - name: Read opt-in, moderator-approved entries and publish daily showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 -m unittest discover -s dopa-button/tools -p 'test_publish_hall.py'
            python3 dopa-button/tools/publish_hall.py
            # Commits made with GITHUB_TOKEN do not trigger another push workflow.
            # Build and publish the actual Pages assets right here, in the same commit.
            npm test --prefix dopa-button
            npm run build --prefix dopa-button
            mkdir -p dopa-button/play
            rsync -a --delete dopa-button/dist/ dopa-button/play/
            git add dopa-button/data/hall_of_fame.json
            git add -A dopa-button/play
            if git diff --cached --quiet; then
              echo 'No changes to daily hall'
              exit 0
            fi
            git commit -m 'community: publish daily hall and playable site [skip ci]'
            if git push origin HEAD:main; then
              echo 'Updated daily community hall'
              exit 0
            fi
            sleep 3
          done
          exit 1
