name: FIFTY-TWO smoke tests
on:
  push:
    paths:
      - 'fifty-two-preview/**'
      - '.github/workflows/fifty-two-smoke.yml'
  pull_request:
    paths:
      - 'fifty-two-preview/**'
      - '.github/workflows/fifty-two-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static smoke tests for all 77 games
        run: node fifty-two-preview/tests/collection-smoke.cjs
      - name: JOKER actions and score isolation unit tests
        run: node fifty-two-preview/tests/joker-actions.cjs

      - name: Install Playwright Chromium for mobile interaction tests
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: JOKER layout mobile interaction tests
        run: node fifty-two-preview/tests/joker-layout.cjs
