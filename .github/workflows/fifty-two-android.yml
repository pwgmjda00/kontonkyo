name: Fifty-Two Android debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'fifty-two/**'
      - '.github/workflows/fifty-two-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Prepare Capacitor project
        run: |
          mkdir -p fifty-two/android-app/www
          cp fifty-two/index.html fifty-two/android-app/www/index.html
          cd fifty-two/android-app
          printf '{"name":"fifty-two-android","version":"0.1.0","private":true,"dependencies":{"@capacitor/core":"^7.0.0","@capacitor/android":"^7.0.0"},"devDependencies":{"@capacitor/cli":"^7.0.0"}}\n' > package.json
          printf '{"appId":"dev.fiftytwo.cards","appName":"52 FIFTY-TWO DEV","webDir":"www"}\n' > capacitor.config.json
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Build Android APK
        working-directory: fifty-two/android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fifty-two-debug-apk
          path: fifty-two/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
