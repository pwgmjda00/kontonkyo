name: Build Dopa Button

on:
  push:
    branches: [main, dopa-button-release]
    paths:
      - 'dopa-button/**'
      - '.github/workflows/dopa-pages.yml'
      - '.github/workflows/pages.yml'
      - 'src/**'
      - 'public/**'
      - 'data/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'
  workflow_dispatch:

concurrency:
  group: dopa-button-publish-main-release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Locate the isolated game directory
        id: app
        shell: bash
        run: |
          if [ -f dopa-button/package.json ]; then
            echo 'path=dopa-button' >> "$GITHUB_OUTPUT"
          else
            echo 'path=.' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.path }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix '${{ steps.app.outputs.path }}'
      - name: Validate the supplied probability data
        run: python3 '${{ steps.app.outputs.path }}/tools/validate_data.py'
      - name: Test instant and daily public Hall rules
        run: python3 -m unittest discover -s dopa-button/tools -p 'test_publish_hall.py'
      - name: Unit tests
        run: npm test --prefix '${{ steps.app.outputs.path }}'
      - name: Build
        run: npm run build --prefix '${{ steps.app.outputs.path }}'
      - name: Prepare real mobile browser for release smoke
        shell: bash
        run: |
          npm install --prefix dopa-button --no-save --package-lock=false playwright@1.56.1
          cd dopa-button
          npx playwright install --with-deps chromium
      - name: iPhone release smoke (PUSH, badges, PNG, instant Hall)
        timeout-minutes: 3
        run: node dopa-button/tests/release-smoke.cjs
      - name: Upload mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dopa-release-qa-${{ github.run_id }}
          path: dopa-button/release-screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish tested build into GitHub Pages folder
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f dopa-button/dist/index.html
          request_pages_build() {
            curl --fail-with-body --show-error --silent --retry 3 --max-time 45 \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
            echo "Requested Pages rebuild from latest main commit"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve this already-tested build outside the checked-out tree.
          mkdir -p "$RUNNER_TEMP/dopa-tested-dist"
          cp -a dopa-button/dist/. "$RUNNER_TEMP/dopa-tested-dist/"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # If newer source files exist, a newer workflow will publish them.
            # Only an existing Pages asset-only commit is safe to supersede.
            if git diff --name-only "$GITHUB_SHA" origin/main -- \
                dopa-button/src dopa-button/data dopa-button/tools \
                dopa-button/package.json dopa-button/package-lock.json \
                dopa-button/vite.config.ts .github/workflows/dopa-pages.yml \
                | grep -q .; then
              echo "A newer source revision exists. Skipping stale built files."
              exit 0
            fi
            git reset --hard origin/main
            mkdir -p dopa-button/play
            rsync -a --delete "$RUNNER_TEMP/dopa-tested-dist/" dopa-button/play/
            git add -A dopa-button/play
            if git diff --cached --quiet; then
              echo "Published files already match tested build"
              request_pages_build
              exit 0
            fi
            git commit -m "deploy: update Dopa Button playable site [skip ci]"
            if git push origin HEAD:main; then
              echo "New tested build published into dopa-button/play"
              request_pages_build
              exit 0
            fi
            sleep 2
          done
          echo "Unable to update publication branch" >&2
          exit 1
      # The existing site root and all unrelated projects are preserved.
