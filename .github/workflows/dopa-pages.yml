name: Build Dopa Button

on:
  push:
    branches: [main, dopa-button-release]
    paths:
      - 'dopa-button/**'
      - '.github/workflows/dopa-pages.yml'
      - '.github/workflows/pages.yml'
      - 'src/**'
      - 'public/**'
      - 'data/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate the isolated game directory
        id: app
        shell: bash
        run: |
          if [ -f dopa-button/package.json ]; then
            echo 'path=dopa-button' >> "$GITHUB_OUTPUT"
          else
            echo 'path=.' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.path }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix '${{ steps.app.outputs.path }}'
      - name: Validate the supplied probability data
        run: python3 '${{ steps.app.outputs.path }}/tools/validate_data.py'
      - name: Unit tests
        run: npm test --prefix '${{ steps.app.outputs.path }}'
      - name: Build
        run: npm run build --prefix '${{ steps.app.outputs.path }}'
      - name: Publish tested build into GitHub Pages folder
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -f dopa-button/dist/index.html
          mkdir -p dopa-button/play
          rsync -a --delete dopa-button/dist/ dopa-button/play/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dopa-button/play
          if git diff --cached --quiet; then
            echo "Published files already match build"
            exit 0
          fi
          git commit -m "deploy: update Dopa Button playable site [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "New build published into dopa-button/play"
              exit 0
            fi
            sleep 3
          done
          echo "Unable to update publication branch" >&2
          exit 1
      # The existing site root and all unrelated projects are preserved.
