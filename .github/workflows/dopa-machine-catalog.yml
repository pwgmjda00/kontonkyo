name: Sync Dopa machine catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: write
concurrency:
  group: dopa-machine-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch source tables and validate
        run: |
          cd dopa-button
          python tools/sync_machine_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/verified_machine_events.json').read_text())
          ids=[x['id'] for x in a]
          assert len(ids)==len(set(ids)), 'Duplicate event ID'
          for x in a:
              n,d=int(x['numerator']),int(x['denominator'])
              assert 0<n<=d and x['sourceUrl']
          print('Catalog entries:',len(a))
          PY
      - name: Commit new sourced machine records
        run: |
          git config user.name "dopa-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dopa-button/data/verified_machine_events.json
          if ! git diff --cached --quiet; then
            git commit -m "data: sync sourced pachinko and slot machine odds"
            git push
          fi
