name: Deploy MUKA-1 API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muka1-backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.MUKA1_D1_ID }}
      ADMIN_TOKEN: ${{ secrets.MUKA1_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ADMIN_TOKEN"
          [[ "$D1_ID" =~ ^[a-fA-F0-9-]{36}$ ]]
          sed -i "s/REPLACE_WITH_D1_ID/$D1_ID/" wrangler.toml
          npm install --no-save wrangler@4
          npx wrangler d1 execute muka1-db --remote --file=schema.sql
          npx wrangler d1 execute muka1-db --remote --file=submissions.sql
          npx wrangler deploy
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
