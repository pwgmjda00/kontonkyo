name: Build and deploy MUKA-1 OGP
on:
  push:
    branches: [main]
    paths:
      - 'muka1-ogp/**'
      - '.github/workflows/muka1-ogp.yml'
      - 'muka1-preview/phrases.js'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after build checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muka1-ogp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node prepare.mjs
      - run: |
          python -m pip install fonttools
          fonttools varLib.instancer font.ttf wght=400 --output static.ttf
          pyftsubset static.ttf --text-file=glyphs.txt --output-file=font.ttf
          ls -lh font.ttf
      - run: npx wrangler deploy --dry-run --outdir dist
      - run: |
          npx wrangler dev --local --port 8787 > /tmp/ogp.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://localhost:8787/duel?pair=1,188&pick=1' -o /tmp/card.html; then break; fi
            sleep 2
          done
          grep -q 'og:image' /tmp/card.html
          curl -fsS 'http://localhost:8787/image.png?pair=1,188' -o /tmp/card.png
          python -c "import struct; b=open('/tmp/card.png','rb').read(); assert b[:8]==bytes.fromhex('89504e470d0a1a0a'); assert struct.unpack('>II',b[16:24])==(1200,630)"
      - uses: actions/upload-artifact@v4
        with:
          name: ogp-sample
          path: /tmp/card.png
      - if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy
