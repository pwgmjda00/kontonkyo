name: Human Update OGP
on:
  push:
    paths:
      - '.github/workflows/human-update-ogp.yml'
      - 'human-update/ogp.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk
      - run: rsvg-convert -w 1200 -h 630 human-update/ogp.svg -o human-update/ogp.png
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('human-update/index.html')
          s=p.read_text()
          u='https://pwgmjda00.github.io/kontonkyo/human-update/ogp.png'
          s=s.replace('name="twitter:card" content="summary"','name="twitter:card" content="summary_large_image"')
          if 'property="og:image"' not in s:
              s=s.replace('</head>',f'<meta property="og:image" content="{u}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:image" content="{u}"></head>')
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add human-update/ogp.png human-update/index.html
          git diff --cached --quiet || (git commit -m "Publish Human Update PNG OGP" && git push)
