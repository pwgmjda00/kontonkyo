<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>インターネット、向いてない。</title><style>*{box-sizing:border-box}body{background:#111;color:#eee;font:16px/1.65 system-ui;margin:auto;max-width:560px;padding:20px}h1{font-size:24px;color:#f5df52}small{color:#aaa}button{display:block;width:100%;text-align:left;background:#222;color:#eee;border:1px solid #555;border-radius:9px;padding:15px;margin:9px 0;font:inherit;cursor:pointer}button:hover{border-color:#f5df52}#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#stats div,article{background:#1d1d1d;padding:12px;border-radius:8px}b{color:#f5df52}hr{border:0;border-top:1px solid #444}#log{white-space:pre-line;color:#bbb;font-size:14px}</style><h1>インターネット、向いてない。</h1><small>架空SNS人生シミュレーター / α01.1</small><p id="day"></p><div id="stats"></div><p id="event"></p><div id="choices"><p>読み込み中。表示が変わらない場合は、JavaScriptが実行できるブラウザで開いてください。</p></div><hr><div id="log"></div><script>
const posts=[['努力すれば報われる。','努力でどうにもならないこともある。','努力した人が報われる社会にしたい。'],['他人に期待するな。','期待しないことを大人と呼びたくない。','犬の写真でも見ようぜ。'],['正論を言って何が悪い。','正しさで人を殴るのは違うだろ。','正論にも使い方がある。'],['自分らしく生きろ。','自分らしく生きたら修正パッチを要求された。','他人の生き方に興味がない。'],['苦労した人間は偉い。','苦労しなくて済む社会の方がいい。','苦労話でマウント取るなよ。'],['嫌なら離れればいい。','逃げられるのに一緒にいるのが愛じゃないか。','今日はログアウトする。'],['承認欲求を捨てよう。','その投稿のいいね数、気にならない？','いいねが欲しい。以上。']];
let s;function reset(){s={day:1,f:100,h:70,t:60,heat:0,history:[],log:[],pending:null};save();render()}function save(){try{localStorage.setItem('internet-alpha01',JSON.stringify(s))}catch(e){}}try{s=JSON.parse(localStorage.getItem('internet-alpha01'))}catch(e){}const $=id=>document.getElementById(id);function clamp(x){return Math.max(0,Math.min(100,x))}function render(){ $('day').textContent=`DAY ${Math.min(s.day,14)} / 14`; $('stats').innerHTML=`<div><small>フォロワー</small><br><b>${s.f.toLocaleString()}</b></div><div><small>余裕</small><br><b>${s.h}</b></div><div><small>信頼</small><br><b>${s.t}</b></div>`;$('log').textContent=s.log.slice(-5).reverse().join('\n\n');$('choices').textContent='';if(s.day>14||s.h===0){let end=s.h===0?'通知を切った日':s.f>=2000&&s.t<45?'数字の奴隷':s.t>=80?'小さな居場所':s.f>=2000?'タイムラインの住人':'無名の自由';$('event').textContent='END：'+end;btn('結果を共有',()=>{let text=`『インターネット、向いてない。』\nEND：${end}\nフォロワー ${s.f} / 余裕 ${s.h} / 信頼 ${s.t}`;if(navigator.share)navigator.share({text}).catch(()=>{});else prompt('結果をコピー',text)});btn('もう一度',reset);return}if(s.pending){$('event').textContent='過去の投稿が掘り返された。\n「'+s.pending.text+'」って前に言ってましたよね？';['考えが変わったと認める','文脈が違うと反論する','通知を閉じる'].forEach((x,i)=>btn(x,()=>resolve(i)));return}let topic=(s.day-1)%7;$('event').textContent=s.day>7?'以前にも話題になったテーマが再浮上。今日の投稿は？':'今日の投稿は？';posts[topic].forEach((p,i)=>btn(p,()=>act(i,topic,p)));btn('今日は投稿しない',()=>act(3,topic,'休息'))}function btn(t,fn){let b=document.createElement('button');b.textContent=t;b.onclick=fn;$('choices').append(b)}function act(i,k,p){let old=s.history.find(x=>x.k===k&&x.i<2);if(i<2&&old&&old.i!==i){s.pending=old;s.history.push({k,i,text:p});s.f+=Math.floor(s.f*.2)+30;s.h=clamp(s.h-8);s.log.push('投稿：'+p+'\n引用が急増。過去の発言が発見された。');save();render();return}let gain=i===0?Math.floor(s.f*.42)+40:i===1?Math.floor(s.f*.28)+35:i===2?Math.floor(s.f*.12)+12:-Math.floor(s.f*.025);s.f=Math.max(0,s.f+gain);s.h=clamp(s.h+[-12,-7,1,20][i]);s.t=clamp(s.t+[-5,3,5,0][i]);s.heat=clamp(s.heat+[15,8,-8,-20][i]);if(s.heat>=65&&i<2){s.h=clamp(s.h-9);s.log.push('匿名：またこの人が燃えてる。')}s.history.push({k,i,text:p});s.log.push('投稿：'+p+'\n'+(gain>=0?'+':'')+gain+'人 / '+['匿名：言い切るの好き。','匿名：これ、ずっと言いたかった。','匿名：こういうのでいい。','通知のない夜。'][i]);s.day++;save();render()}function resolve(i){s.t=clamp(s.t+[12,-12,0][i]);s.h=clamp(s.h+[-4,-15,12][i]);s.f=Math.max(0,s.f+[-Math.floor(s.f*.08),Math.floor(s.f*.25),-Math.floor(s.f*.03)][i]);s.heat=clamp(s.heat+[-15,20,-10][i]);s.log.push(['考えが変わった。そう言った。','反論が反論を呼んだ。','画面を閉じた。'][i]);s.pending=null;s.day++;save();render()}if(!s || !Number.isFinite(s.day) || !Array.isArray(s.history) || !Array.isArray(s.log) || ![s.f,s.h,s.t,s.heat].every(Number.isFinite))reset();else render();</script></html>
