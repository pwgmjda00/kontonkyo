name = "muka1-api"
main = "worker.js"
compatibility_date = "2026-11-25"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "muka1-db"
database_id = "REPLACE_WITH_D1_ID"

[triggers]
# 00:05 JST: snapshot closed periods; lazy reconciliation also catches missed runs.
crons = ["5 15 * * *"]
