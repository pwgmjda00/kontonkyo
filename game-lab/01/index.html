<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欲張り</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#222;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{width:min(90%,360px);text-align:center}h1{font-size:24px}#n{font-size:76px;font-weight:800;font-variant-numeric:tabular-nums}button{width:100%;padding:20px;background:#222;color:white;border:0;font:700 20px system-ui;border-radius:5px;touch-action:manipulation}#bar{height:5px;background:#ddd;margin:20px 0}#fill{height:100%;background:#222}#msg{height:48px}small{color:#666}</style><main><small>30秒ゲーム研究所 01</small><h1>欲張り</h1><p>得点 <b id="score">0</b>　残り <b id="time">30</b>秒</p><div id="n">0</div><div id="bar"><div id="fill"></div></div><p id="msg">増える数字を、破裂する前に回収。</p><button id="btn">開始</button><p><small>最高記録 <span id="best">0</span></small></p></main><script>const $=id=>document.getElementById(id);let state=0,score=0,start=0,round=0,limit=0,n=0,hold=0,best=0;try{best=+localStorage.greedyBest||0}catch{}$('best').textContent=best;function reset(t){round=t;limit=650+Math.random()*3900;n=0}function frame(t){if(state===1){let left=Math.max(0,30-(t-start)/1000);$('time').textContent=Math.ceil(left);$('fill').style.width=left/30*100+'%';if(left<=0){state=2;best=Math.max(best,score);try{localStorage.greedyBest=best}catch{}$('best').textContent=best;$('msg').textContent='終了！ '+score+'点';$('btn').textContent='もう一度';$('n').textContent='0'}else if(t>=hold){if(hold){hold=0;reset(t)}let age=t-round;n=Math.floor(10*Math.pow(age/1000,2));if(age>=limit){$('msg').textContent='破裂！ '+n+'点を失った';$('n').textContent='×';hold=t+450}else $('n').textContent=n}}requestAnimationFrame(frame)}$('btn').onclick=()=>{let t=performance.now();if(state!==1){state=1;score=0;start=t;hold=0;reset(t);$('score').textContent=0;$('msg').textContent='どこまで欲張る？';$('btn').textContent='回収する'}else if(!hold){score+=n;$('score').textContent=score;$('msg').textContent='+'+n+'点';reset(t)}};requestAnimationFrame(frame)</script></html>
