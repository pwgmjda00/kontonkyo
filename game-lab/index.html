<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>30秒ゲーム研究所</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#222;font:16px system-ui}main{max-width:520px;margin:auto;padding:18px}button{font:inherit;color:inherit;background:white;border:1px solid #aaa;border-radius:5px;padding:13px;touch-action:manipulation}button:active{background:#ddd}#list{display:grid;grid-template-columns:1fr 1fr;gap:8px}#list button{text-align:left}small{color:#666}#arena{min-height:210px;display:grid;place-content:center;gap:10px;text-align:center;position:relative}#arena button{min-width:65px}#big{font-size:48px;font-weight:bold}#actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}#grid button{min-width:0;padding:12px}#rating{display:flex;gap:5px;flex-wrap:wrap}h1{font-size:25px} [hidden]{display:none!important}</style><main><section id=home><h1>30秒ゲーム研究所</h1><p>20の遊び。面白いものだけ生き残る。</p><div id=list></div></section><section id=play hidden><button id=back>一覧へ</button><h2 id=title></h2><p id=desc></p><p>残り <b id=left>30</b> 秒　得点 <b id=score>0</b></p><div id=arena></div><p id=msg></p><div id=rating hidden></div><button id=next hidden>次の実験 →</button></section></main><script>const games=[["欲張り","破裂前に回収","risk"],["反射","緑になった瞬間に押す","react"],["寸止め","針を中央で止める","aim"],["記憶","光った順に押す","memory"],["違和感","異なる数字を探す","odd"],["連打","10秒で何回押せる？","tap"],["静止","指定秒数を体感で測る","time"],["暗算","二択で計算に答える","math"],["逆命令","文字と逆の方向を押す","reverse"],["色彩","文字でなく文字色を選ぶ","color"],["素数","素数だけ選ぶ","prime"],["昇順","数字を小さい順に消す","sort"],["狙撃","動く標的を押す","shoot"],["回避","左右移動で落下物を避ける","avoid"],["天秤","左右の重さを揃える","balance"],["倍々","倍増か確定かを選ぶ","double"],["採掘","限られた手数で宝を探す","mine"],["交換","手札を交換して合計を上げる","trade"],["連鎖","同色の隣接マスを消す","chain"],["予測","次の数字が上下どちらか当てる","predict"]],$=x=>document.getElementById(x),rand=n=>Math.floor(Math.random()*n);let ratings={};try{ratings=JSON.parse(localStorage.labRatings||'{}')}catch{}let i=0,mode='',score=0,end=0,live=false,token=0,update=null;function menu(){$('home').hidden=false;$('play').hidden=true;live=false;token++;$('list').replaceChildren();games.forEach((g,j)=>{let b=document.createElement('button');b.textContent=String(j+1).padStart(2,'0')+' '+g[0]+(ratings[j]!=null?' ★'+ratings[j]:'');b.onclick=()=>start(j);$('list').append(b)})}function add(n){score+=n;$('score').textContent=score}function show(t,opts=[],grid=false){$('arena').replaceChildren();let b=document.createElement('div');b.id='big';b.textContent=t;$('arena').append(b);let a=document.createElement('div');a.id=grid?'grid':'actions';for(let [label,fn,color] of opts){let x=document.createElement('button');x.textContent=label;if(color)x.style.background=color;x.onclick=()=>{if(live)fn(x)};a.append(x)}$('arena').append(a);return b}function later(fn,ms){let k=token;setTimeout(()=>{if(live&&k===token)fn()},ms)}function finish(){live=false;update=null;$('arena').textContent='終了：'+score+'点';$('rating').hidden=false;$('next').hidden=false;$('rating').replaceChildren();for(let n=0;n<4;n++){let b=document.createElement('button');b.textContent=['0 退屈','1 普通','2 また遊ぶ','3 ハマる'][n];b.onclick=()=>{ratings[i]=n;try{localStorage.labRatings=JSON.stringify(ratings)}catch{}$('msg').textContent='評価 '+n+' を保存'};$('rating').append(b)}let b=document.createElement('button');b.textContent='再挑戦';b.onclick=()=>start(i);$('rating').append(b)}function start(j){i=j;mode=games[j][2];token++;live=true;score=0;update=null;end=performance.now()+30000;$('home').hidden=true;$('play').hidden=false;$('rating').hidden=true;$('next').hidden=true;$('title').textContent=games[j][0];$('desc').textContent=games[j][1];$('score').textContent=0;$('msg').textContent='';run()}function run(){let a,b,c,d,arr,seq=[],p=0,t=performance.now(),target=0;const say=x=>$('msg').textContent=x;switch(mode){case'risk':{let born=t,limit=700+rand(3500),n=0;let el=show('0',[['回収',()=>{add(n);born=performance.now();limit=700+rand(3500)}]]);update=now=>{let age=now-born;n=Math.floor(10*(age/1000)**2);if(age>limit){say('破裂！');born=now;limit=700+rand(3500);n=0}el.textContent=n};break}case'react':{let ready=false;function round(){ready=false;show('待て',[['押す',()=>{if(!ready){add(-1);say('早い！')}else{add(Math.max(1,100-Math.floor((performance.now()-t)/10)));round()}}]]);later(()=>{ready=true;t=performance.now();$('big').textContent='今！';$('big').style.color='green'},700+rand(1800))}round();break}case'aim':{let el=show('0',[['止める',()=>{add(Math.max(0,50-Math.abs(50-p)));say('誤差 '+Math.abs(50-p))}]]);update=now=>{p=Math.round((Math.sin(now/350)+1)*50);el.textContent=p+' / 50'};break}case'memory':{function round(){seq.push(rand(4));p=0;show(seq.map(x=>x+1).join(' '));later(()=>show('？',Array.from({length:4},(_,x)=>[x+1,()=>{if(x===seq[p]){p++;if(p===seq.length){add(p);round()}}else{seq=[];say('違う！');round()}}])),600+seq.length*250)}round();break}case'odd':{function round(){target=rand(16);show('違う数字',Array.from({length:16},(_,x)=>[x===target?'8':'6',()=>{add(x===target?1:-1);round()}]),true)}round();break}case'tap':end=t+10000;show('連打',[['押す',()=>add(1)]]);break;case'time':{function round(){target=2+rand(4);show(target+'秒',[['計測開始',()=>{t=performance.now();show('…',[['停止',()=>{add(Math.max(0,100-Math.round(Math.abs((performance.now()-t)/1000-target)*50)));round()}]])}]] )}round();break}case'math':case'prime':case'reverse':case'color':{function round(){a=1+rand(19);b=1+rand(19);let opts,question;if(mode==='math'){question=a+' + '+b;let k=rand(2);opts=[a+b+(k?1:0),a+b+(k?0:-1)].map(x=>[x,()=>{add(x===a+b?1:-1);round()}])}else if(mode==='prime'){question=a;let yes=a>1&&!Array.from({length:a-2},(_,j)=>j+2).some(x=>a%x===0);opts=[['素数',()=>{add(yes?1:-1);round()}],['違う',()=>{add(!yes?1:-1);round()}]]}else if(mode==='reverse'){question=a%2?'←':'→';opts=['←','→'].map(x=>[x,()=>{add(x!==question?1:-1);round()}])}else{let colors=['赤','青','緑'],css=['#c44','#46c','#39834a'];target=rand(3);question=colors[rand(3)];opts=colors.map((x,j)=>[x,()=>{add(j===target?1:-1);round()}]);show(question,opts).style.color=css[target];return}show(question,opts)}round();break}case'sort':{function round(){arr=Array.from({length:9},(_,j)=>j+1).sort(()=>Math.random()-.5);p=1;show('1から順に',arr.map(x=>[x,el=>{if(x===p){el.disabled=true;el.style.opacity=.2;p++;add(1);if(p===10)round()}else add(-1)}]),true)}round();break}case'shoot':{function round(){target=rand(16);show('標的',Array.from({length:16},(_,x)=>[x===target?'●':'·',()=>{add(x===target?1:-1);round()}]),true)}round();let last=t;update=now=>{if(now-last>650){last=now;round()}};break}case'avoid':{p=1;let rocks=[];let last=t;function draw(){show(rocks.map(x=>Array.from({length:3},(_,j)=>j===x?'■':'·').join(' ')).join('\n')+'\n'+Array.from({length:3},(_,j)=>j===p?'▲':'·').join(' '),[['←',()=>{p=Math.max(0,p-1);draw()}],['→',()=>{p=Math.min(2,p+1);draw()}]]).style.whiteSpace='pre'}draw();update=now=>{if(now-last>550){last=now;if(rocks.length===3)add(rocks.shift()===p?-2:1);rocks.push(rand(3));draw()}};break}case'balance':{a=rand(15);b=rand(15);function draw(){show(a+' : '+b,[['左 +1',()=>{a++;check()}],['右 +1',()=>{b++;check()}]] )}function check(){if(a===b){add(1);a=rand(15);b=rand(15)}draw()}draw();break}case'double':{p=1;function draw(){show(p,[['倍増',()=>{if(rand(4)===0){p=1;say('消失')}else p*=2;draw()}],['確定',()=>{add(p);p=1;draw()}]])}draw();break}case'mine':{function round(){target=rand(16);p=5;show('残り5手',Array.from({length:16},(_,x)=>['？',el=>{el.disabled=true;el.textContent=x===target?'宝':'×';p--;if(x===target){add(5);round()}else if(!p){add(-1);round()}else $('big').textContent='残り'+p+'手'}]),true)}round();break}case'trade':{function round(){arr=[rand(10)+1,rand(10)+1,rand(10)+1];p=3;draw()}function draw(){show('合計 '+arr.reduce((x,y)=>x+y,0),[...arr.map((x,j)=>[x,()=>{if(p){p--;arr[j]=rand(10)+1;draw()}}]),['確定',()=>{add(arr.reduce((x,y)=>x+y,0));round()}]]);say('交換残り '+p)}round();break}case'chain':{arr=Array.from({length:16},()=>rand(3));function draw(){show('同色を消す',arr.map((x,j)=>[['●','▲','■'][x],()=>{let set=new Set([j]);for(let k of set)for(let n of [k-4,k+4,...(k%4?[k-1]:[]),...(k%4<3?[k+1]:[])])if(n>=0&&n<16&&arr[n]===x)set.add(n);add(set.size>1?set.size**2:-1);for(let k of set)arr[k]=rand(3);draw()},['#f3c4c4','#c4ddf3','#c9e8bd'][x]]),true)}draw();break}case'predict':{a=1+rand(13);function draw(){show(a,['上','下'].map((x,j)=>[x,()=>{b=1+rand(13);add(b===a?0:(j===0?b>a:b<a)?1:-1);a=b;draw()}]))}draw();break}}}function frame(t){if(live){$('left').textContent=Math.max(0,Math.ceil((end-t)/1000));if(t>=end)finish();else if(update)update(t)}requestAnimationFrame(frame)}$('back').onclick=menu;$('next').onclick=()=>start((i+1)%games.length);menu();requestAnimationFrame(frame)</script></html>
