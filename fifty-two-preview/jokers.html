<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JOKER 77 | FIFTY-TWO</title><style>:root{font-family:system-ui,sans-serif;background:#101018;color:#f7f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:950px;margin:auto;padding:16px}a{color:#e6c5ff}h1{font:normal 42px Georgia,serif;margin:16px 0 6px}.muted{color:#b8b1c3;font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:11px;margin:15px 0}.joker{border:2px solid var(--accent);background:linear-gradient(145deg,#2a2635,#15131c);border-radius:13px;padding:12px;min-height:222px;color:#fff;text-align:center;position:relative}.joker .id{font:11px monospace;color:#cfc4da}.joker .sigil{font-size:56px;display:block;margin:10px 0;text-shadow:0 0 22px var(--accent)}.joker strong{display:block;font-size:14px}.joker small{display:block;color:#d1c5d9;margin:7px 0;line-height:1.4}.joker button{background:var(--accent);color:#181420;border:0;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer}.joker button:disabled{opacity:.5}.selected{box-shadow:0 0 0 3px #fff5a7}.panel{background:#201d2a;border:1px solid #5d526d;border-radius:14px;padding:15px;margin:14px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.label{font-size:13px;color:#d4c4de}select{background:#2d2839;color:#fff;border:1px solid #82718f;border-radius:9px;padding:10px;font:inherit}h2{font-size:21px;margin:20px 0 6px}button.action{background:#e9cf9a;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}#status{color:#ffe0a0;font-size:14px;min-height:22px}@media(max-width:380px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.joker{padding:8px}}</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>JOKER 77</h1><p class="muted">11系統 × 7枚、全77枚の異能ジョーカー。毎日7枚が現れ、好きな1枚を装備できる。配布は端末のローカル日付基準。サーバーなしで動作。</p><section class="panel"><div class="row"><div><strong>本日の7枚</strong><div class="label" id="date"></div></div><div><strong>装備中：</strong><span id="equipped">なし</span></div></div><p id="status" aria-live="polite"></p><div id="daily" class="grid"></div><p class="muted">※ 現段階は日替わり配布・装備選択・図鑑の基盤。各ゲーム内の特殊効果はまだ未接続です。装備しても既存ゲームのルールは変わりません。</p></section><section class="panel"><div class="row"><h2>全77枚の図鑑</h2><label class="label">系統 <select id="filter"><option value="all">すべて</option></select></label></div><p class="muted">現在の絵柄は系統別の仮シンボルです。固有イラストと効果の詳細は今後実装します。</p><div id="catalog" class="grid"></div></section></main><script src="./engine/jokers.js"></script><script>(()=>{'use strict';const j=window.FiftyTwoJokers,$=id=>document.getElementById(id);if(!j){$('status').textContent='ジョーカーの読み込みに失敗しました。';return}const date=j.localDate(),today=j.daily(date);$('date').textContent=date+'（端末の日付）';let equipped=null;try{equipped=localStorage.getItem('fifty-two-joker-equip-'+date)}catch(e){}if(!j.validateEquip(equipped,date))equipped=null;function save(id){equipped=id;try{localStorage.setItem('fifty-two-joker-equip-'+date,id)}catch(e){$('status').textContent='この端末では装備を保存できません。'}renderDaily()}function card(c,canEquip){const el=document.createElement('article');el.className='joker'+(equipped===c.id?' selected':'');el.style.setProperty('--accent',c.accent);const id=document.createElement('div');id.className='id';id.textContent=c.id+' / '+c.familyName;const sigil=document.createElement('span');sigil.className='sigil';sigil.textContent=c.icon;const name=document.createElement('strong');name.textContent=c.name;const desc=document.createElement('small');desc.textContent=c.description+'（'+c.effect.type+'）';el.append(id,sigil,name,desc);if(canEquip){const b=document.createElement('button');b.textContent=equipped===c.id?'装備中 ✓':'装備する';b.disabled=equipped===c.id;b.onclick=()=>save(c.id);el.append(b)}return el}function renderDaily(){$('equipped').textContent=j.get(equipped)?.name||'なし';$('daily').replaceChildren(...today.map(c=>card(c,true)))}const filter=$('filter');for(const f of j.families){const o=document.createElement('option');o.value=f.key;o.textContent=f.icon+' '+f.name;filter.append(o)}function renderCatalog(){const list=filter.value==='all'?j.catalog:j.catalog.filter(c=>c.family===filter.value);$('catalog').replaceChildren(...list.map(c=>card(c,false)))}filter.onchange=renderCatalog;renderDaily();renderCatalog()})();</script></body></html>
