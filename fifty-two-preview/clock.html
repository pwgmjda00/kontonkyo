<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>時計ソリティア | FIFTY-TWO</title><style>:root{font-family:system-ui,sans-serif;background:#141e2c;color:#f5f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:14px}a{color:#e5d09c}h1{font-size:30px;margin:12px 0 5px}.muted{font-size:13px;color:#bfc9d9;line-height:1.7}.panel{border:1px solid #536a82;border-radius:16px;background:#223044;padding:12px;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.stats strong{display:block;font-size:23px;color:#f3d68c}.clock{position:relative;width:min(100%,500px);aspect-ratio:1;margin:12px auto}.pile{position:absolute;transform:translate(-50%,-50%);width:16%;height:18%;border:2px solid #8295b0;border-radius:9px;background:#30435b;color:#e4eafa;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}.pile.active{outline:3px solid #f6d98c}.pile .count{font-size:11px;color:#c9d6e6}.pile .face{font-weight:900;font-size:clamp(15px,4vw,26px);color:#fff6e2}.pile .red{color:#ff899b}.pile.empty{opacity:.38}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.action{font:800 16px system-ui;border:0;border-radius:10px;background:#e8ce92;color:#1b2836;padding:12px 18px;min-height:48px;cursor:pointer}.action:disabled{opacity:.4}.message{min-height:55px;color:#f6db9a;font-weight:700;line-height:1.65}.help{font-size:13px;line-height:1.8}</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>時計ソリティア <small class="muted">第33作 · SOLITAIRE</small></h1><p class="muted">52枚を時計の13か所に配置。めくった数字の場所へ進み、4枚目のKより先に全カードを公開できるか。</p><section class="panel"><div class="stats"><div>公開済み<strong id="revealed">0 / 52</strong></div><div>K公開<strong id="kings">0 / 4</strong></div><div>通算勝利<strong id="wins">0</strong></div></div><div id="clock" class="clock" aria-label="時計型のカード配置"></div><p id="message" class="message" aria-live="polite"></p><div class="actions"><button id="step" class="action">カードをめくる</button><button id="auto" class="action">最後まで進める</button><button id="restart" class="action">新しい配り方</button></div></section><details class="panel help"><summary>📖 ルール</summary><p>52枚を13か所に4枚ずつ裏向きで配ります。最初は中央（Kの場所）から1枚めくります。出た数字の場所に移動し、そこから次の1枚をめくります。Aは1時、Jは11時、Qは12時、Kは中央です。4枚目のKが出た時点で終了。52枚すべて公開できていれば勝利です。完全に運で決まるゲームです。</p></details></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),suits=['♠','♥','♦','♣'];let g,wins=0;try{const n=Number(localStorage.getItem('fifty-two-clock-wins'));if(Number.isSafeInteger(n)&&n>=0)wins=n}catch(e){}const label=c=>(c.r===1?'A':c.r===11?'J':c.r===12?'Q':c.r===13?'K':c.r)+suits[c.si];function start(){const d=[];for(let si=0;si<4;si++)for(let r=1;r<=13;r++)d.push({r,si});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}g={piles:Array.from({length:13},(_,i)=>d.slice(i*4,i*4+4)),faces:Array(13).fill(null),at:12,revealed:0,kings:0,done:false,message:'中央のKの場所からカードをめくろう。'};render()}function step(){if(g.done)return;const pile=g.piles[g.at];if(!pile.length){g.done=true;g.message='移動先にカードがないため終了。';render();return}const c=pile.pop();g.faces[g.at]=c;g.revealed++;if(c.r===13)g.kings++;g.at=c.r-1;if(g.kings===4){g.done=true;if(g.revealed===52){wins++;try{localStorage.setItem('fifty-two-clock-wins',String(wins))}catch(e){}g.message='🏆 全52枚公開！ 時計ソリティア成功。'}else g.message='4枚目のKが出た。残り '+(52-g.revealed)+'枚で終了。'}else g.message=label(c)+' が出た。次は '+(c.r===13?'中央':c.r+'時')+' の場所。';render()}function render(){$('revealed').textContent=g.revealed+' / 52';$('kings').textContent=g.kings+' / 4';$('wins').textContent=wins;$('message').textContent=g.message;$('step').disabled=g.done;$('auto').disabled=g.done;const root=$('clock');root.replaceChildren();for(let i=0;i<13;i++){const el=document.createElement('div'),c=g.faces[i],n=g.piles[i].length;el.className='pile'+(!n?' empty':'')+(!g.done&&g.at===i?' active':'');let x=50,y=50;if(i!==12){const angle=(i+1)*Math.PI/6-Math.PI/2;x=50+39*Math.cos(angle);y=50+39*Math.sin(angle)}el.style.left=x+'%';el.style.top=y+'%';const t=document.createElement('span');t.className='count';t.textContent=i===12?'中央 K':(i+1)+'時';const f=document.createElement('span');f.className='face'+(c&&(c.si===1||c.si===2)?' red':'');f.textContent=c?label(c):'◆';const q=document.createElement('span');q.className='count';q.textContent='残り '+n;el.append(t,f,q);root.append(el)}}$('step').onclick=step;$('auto').onclick=()=>{for(let i=0;i<52&&!g.done;i++)step()};$('restart').onclick=()=>{if(!g.done&&!confirm('現在の配り方を破棄しますか？'))return;start()};start()})();</script><script src="./collection.js" defer></script></body></html>
