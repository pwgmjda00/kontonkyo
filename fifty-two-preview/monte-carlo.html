<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>モンテカルロ | FIFTY-TWO</title><style>.card.joker-hint{box-shadow:0 0 0 4px #9ee4ff!important;position:relative;z-index:2}:root{font-family:system-ui,sans-serif;background:#141b28;color:#f5f1e9}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:14px}a{color:#ecd29b}h1{font-size:30px;margin:12px 0 5px}.muted{font-size:13px;color:#becad8;line-height:1.7}.panel{background:#223144;border:1px solid #546b82;border-radius:15px;padding:13px;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats strong{display:block;color:#f1d58e;font-size:24px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:510px;margin:16px auto}.card{aspect-ratio:.75;min-width:0;border:2px solid #ded8cb;border-radius:9px;background:#fff9ed;color:#233142;font:900 clamp(18px,5vw,29px) system-ui;cursor:pointer;touch-action:manipulation}.card.red{color:#c02d4e}.card.empty{background:#1b2939;border:1px dashed #62768a;color:transparent;cursor:default}.card.selected{outline:4px solid #f2d17e;outline-offset:1px}.card.hinted{box-shadow:0 0 0 4px #79cfb0}.card:focus-visible{outline:3px solid #f2d17e}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.action{min-height:46px;border:0;border-radius:10px;background:#edd18e;color:#1e2939;padding:11px 14px;font:800 15px system-ui;cursor:pointer}.action:disabled{opacity:.45}.message{min-height:50px;color:#f9dda1;line-height:1.6;font-weight:700}.help{font-size:13px;line-height:1.8}@media(max-width:420px){.board{gap:5px}.card{border-radius:6px}}</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>モンテカルロ <small class="muted">第37作 · MONTE CARLO</small></h1><p class="muted">隣接する同じ数字を2枚ずつ消す。空きを詰めると新しいペアが生まれる。</p><section class="panel"><div class="stats"><div>除去<strong id="removed">0 / 52</strong></div><div>山札<strong id="stock">27</strong></div><div>勝利<strong id="wins">0</strong></div><div>🃏勝利<strong id="jokerWins">0</strong></div></div><div id="board" class="board" aria-label="5×5のカード盤面"></div><p class="message" id="message" aria-live="polite"></p><div class="actions"><button id="compact" class="action">詰めて補充</button><button id="hint" class="action">ヒント</button><button id="undo" class="action">1手戻す</button><button id="restart" class="action">新しい対局</button></div></section><details class="panel help"><summary>📖 遊び方</summary><p>5×5の盤面に25枚のカードを並べます。縦・横・斜めのいずれかで隣り合う<strong>同じ数字</strong>のカード2枚を選ぶと消せます。マークは問いません。</p><p>「詰めて補充」で残ったカードを左上から順番に詰め、山札から空いたマスへ新しいカードを補充します。山札がなくなっても詰め直せます。全52枚を消せば勝利です。動けなくなった場合は1手戻すか、新しい配り方で再挑戦できます。</p></details></main><script src="./engine/jokers.js"></script><script src="./engine/joker-score-mode.js"></script><script src="./engine/joker-actions.js"></script><script src="./engine/joker-layout-mode.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),suits=['♠','♥','♦','♣'];let g,wins=0,jokerWins=0;try{const n=Number(localStorage.getItem('fifty-two-monte-carlo-wins'));if(Number.isSafeInteger(n)&&n>=0)wins=n}catch(e){}try{const n=Number(localStorage.getItem('fifty-two-monte-carlo-joker-wins'));if(Number.isSafeInteger(n)&&n>=0)jokerWins=n}catch(e){}const label=c=>(c.r===1?'A':c.r===11?'J':c.r===12?'Q':c.r===13?'K':c.r)+suits[c.si];function start(){joker.begin();const d=[];for(let si=0;si<4;si++)for(let r=1;r<=13;r++)d.push({si,r});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}g={board:d.slice(0,25),stock:d.slice(25),selected:null,hinted:[],removed:0,history:[],done:false,message:'同じ数字で隣接する2枚を探そう。'};render()}function adjacent(i,j){const x=i%5,y=Math.floor(i/5),u=j%5,v=Math.floor(j/5);return i!==j&&Math.abs(x-u)<=1&&Math.abs(y-v)<=1}function pair(i,j){return !!g.board[i]&&!!g.board[j]&&g.board[i].r===g.board[j].r&&adjacent(i,j)}function possible(){const arr=[];for(let i=0;i<25;i++)for(let j=i+1;j<25;j++)if(pair(i,j))arr.push([i,j]);return arr}function recommend(){const pairs=possible(),results=pairs.map(ids=>{const board=g.board.filter((c,i)=>c&&!ids.includes(i)),stock=g.stock.slice();while(board.length<25&&stock.length)board.push(stock.shift());while(board.length<25)board.push(null);let following=0;for(let i=0;i<25;i++)for(let j=i+1;j<25;j++)if(board[i]&&board[j]&&board[i].r===board[j].r&&adjacent(i,j))following++;return {ids,following}});results.sort((a,b)=>b.following-a.following);return results[0]||null}function snapshot(){return {board:g.board.slice(),stock:g.stock.slice(),selected:g.selected,hinted:g.hinted.slice(),removed:g.removed,done:g.done,message:g.message}}function save(){g.history.push(snapshot());if(g.history.length>200)g.history.shift()}function finish(){if(g.removed===52){g.done=true;if(joker.mode==='joker'){jokerWins++;try{localStorage.setItem('fifty-two-monte-carlo-joker-wins',String(jokerWins))}catch(e){}}else{wins++;try{localStorage.setItem('fifty-two-monte-carlo-wins',String(wins))}catch(e){}}g.message='🏆 52枚すべて除去！ モンテカルロ完全勝利。'}else if(!possible().length&&g.stock.length===0&&g.board.every(Boolean)){g.message='ペアがない。1手戻すか配り直そう。'}}function tap(i){if(g.done||!g.board[i])return;if(g.selected!==null&&pair(g.selected,i)){save();g.board[g.selected]=null;g.board[i]=null;g.removed+=2;g.selected=null;g.hinted=[];g.message='ペア除去！ 空いたマスを詰めて補充できる。';finish();render();return}g.selected=g.selected===i?null:i;g.hinted=[];g.message=g.selected===null?'選択解除。':'同じ数字の隣接カードを選ぼう。';render()}function compact(){if(g.done)return;const before=g.board.filter(Boolean),count=before.length;if(count===25&&!g.stock.length){g.message='空きマスも山札もない。';render();return}if(count===25){g.message='空きマスがない。まずペアを消そう。';render();return}save();const next=before.slice();while(next.length<25&&g.stock.length)next.push(g.stock.shift());while(next.length<25)next.push(null);g.board=next;g.selected=null;g.hinted=[];g.message='左上から詰めて'+(next.filter(Boolean).length-count)+'枚補充した。';finish();render()}function hint(){const p=possible();g.selected=null;g.hinted=p.length?p[0]:[];g.message=p.length?'緑の2枚がペア。':'ペアがない。詰めて補充するか1手戻そう。';render()}function undo(){if(!g.history.length)return;if(g.done){if(joker.mode==='joker'){jokerWins=Math.max(0,jokerWins-1);try{localStorage.setItem('fifty-two-monte-carlo-joker-wins',String(jokerWins))}catch(e){}}else{wins=Math.max(0,wins-1);try{localStorage.setItem('fifty-two-monte-carlo-wins',String(wins))}catch(e){}}}const history=g.history,h=history.pop();Object.assign(g,h,{history});g.message='1手戻した。';render()}function render(){const pick=joker.effectType()==='hintChance'?recommend():null;const jokerHints=pick&&g.selected===null?pick.ids:[];$('removed').textContent=g.removed+' / 52';$('stock').textContent=g.stock.length;$('wins').textContent=wins;$('jokerWins').textContent=jokerWins;$('message').textContent=g.message;$('undo').disabled=!g.history.length;$('compact').disabled=g.done||g.board.every(Boolean);$('hint').disabled=g.done;const root=$('board');root.replaceChildren();g.board.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='card'+(!c?' empty':c.si===1||c.si===2?' red':'')+(g.selected===i?' selected':'')+(g.hinted.includes(i)?' hinted':'')+(jokerHints.includes(i)?' joker-hint':'');b.textContent=c?label(c):'·';b.disabled=!c||g.done;b.setAttribute('aria-label',c?'位置'+(i+1)+' '+label(c):'空きマス');b.onclick=()=>tap(i);root.append(b)});joker.refresh({base:g.removed,finished:g.done,win:g.removed===52,moves:g.history.length,deck:g.stock,recommendation:pick?'位置'+pick.ids.map(i=>i+1).join('・')+'（詰めた後'+pick.following+'組）':g.board.some(c=>!c)?'詰めて補充':''});}$('compact').onclick=compact;$('hint').onclick=hint;$('undo').onclick=undo;$('restart').onclick=()=>{if(!g.done&&!confirm('現在の対局を破棄して配り直しますか？'))return;start()};const joker=FiftyTwoJokerLayoutMode.create('monte-carlo',{reset:start,hasProgress:()=>!!g&&g.history.length>0,label,hiddenDeck:true,deckLabel:'補充札',peekFormat:cards=>'次の補充札（先頭から最大3枚）：'+(cards.length?cards.slice(0,3).map(label).join(' '):'山札は空')});start()})();</script><script src="./collection.js" defer></script></body></html>
