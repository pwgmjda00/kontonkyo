<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>アコーディオン | FIFTY-TWO</title><style>:root{font-family:system-ui,sans-serif;background:#141c29;color:#f5f1e8}*{box-sizing:border-box}body{margin:0}main{max-width:790px;margin:auto;padding:14px}a{color:#ead395}h1{font-size:30px;margin:12px 0 5px}.muted{color:#bfcbd9;font-size:13px;line-height:1.7}.panel{background:#233246;border:1px solid #526b84;border-radius:15px;padding:12px;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats strong{display:block;color:#f4d58c;font-size:24px}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin:15px 0}.pile{border:2px solid #d5d4ca;border-radius:8px;background:#fff8ed;color:#233040;aspect-ratio:.72;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:900 clamp(14px,3.5vw,24px) system-ui;cursor:pointer;touch-action:manipulation;position:relative}.pile.red{color:#c42c51}.pile.selected{outline:3px solid #e8c86d;outline-offset:2px}.pile.hinted{box-shadow:0 0 0 3px #80d9bb}.pile .count{font-size:10px;color:#647282;font-weight:700}.pile:focus-visible{outline:3px solid #e8c86d}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.action{min-height:45px;padding:11px 14px;border:0;border-radius:10px;background:#ecd18f;color:#1d2a38;font:800 15px system-ui;cursor:pointer}.action:disabled{opacity:.45}.message{min-height:46px;color:#f6dc9c;font-weight:700;line-height:1.6}.help{font-size:13px;line-height:1.8}@media(max-width:520px){.board{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.pile{font-size:19px}}@media(max-width:360px){.board{grid-template-columns:repeat(5,minmax(0,1fr))}}</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>アコーディオン <small class="muted">第36作 · ACCORDION</small></h1><p class="muted">同じ数字かマークなら、左隣か左3つ前の山へ重ねられる。52山を1山に圧縮しよう。</p><section class="panel"><div class="stats"><div>残りの山<strong id="remaining">52 / 52</strong></div><div>移動回数<strong id="moves">0</strong></div><div>勝利<strong id="wins">0</strong></div></div><div id="board" class="board" aria-label="アコーディオンの山札"></div><p class="message" id="message" aria-live="polite"></p><div class="actions"><button id="hint" class="action">ヒント</button><button id="undo" class="action">1手戻す</button><button id="restart" class="action">新しい配り方</button></div></section><details class="panel help"><summary>📖 遊び方</summary><p>52枚を表向きに並べます。各山の一番上のカードが、<strong>左隣</strong>または<strong>左3山前</strong>の一番上と同じ数字か同じマークなら、右の山全体を左へ重ねられます。動かす山をタップしてから、移動先をタップしてください。ヒントは移動可能な組を示します。1山だけ残せば勝利です。動かせなくなったら終了ですが、1手戻してやり直せます。</p></details></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),suits=['♠','♥','♦','♣'];let g,wins=0;try{const n=Number(localStorage.getItem('fifty-two-accordion-wins'));if(Number.isSafeInteger(n)&&n>=0)wins=n}catch(e){}const label=c=>(c.r===1?'A':c.r===11?'J':c.r===12?'Q':c.r===13?'K':c.r)+suits[c.si];function start(){const d=[];for(let si=0;si<4;si++)for(let r=1;r<=13;r++)d.push({si,r});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}g={piles:d.map(c=>[c]),selected:null,hinted:[],history:[],moves:0,done:false,message:'移動する山を選び、左隣か左3山前へ重ねよう。'};render()}function matches(a,b){const x=a[a.length-1],y=b[b.length-1];return x.r===y.r||x.si===y.si}function canMove(from,to){return from>to&&(from-to===1||from-to===3)&&matches(g.piles[from],g.piles[to])}function movesAvailable(){const out=[];for(let i=1;i<g.piles.length;i++)for(const n of [1,3])if(i>=n&&canMove(i,i-n))out.push([i,i-n]);return out}function snapshot(){return {piles:g.piles.map(p=>p.slice()),selected:g.selected,hinted:g.hinted.slice(),moves:g.moves,done:g.done,message:g.message}}function move(from,to){g.history.push(snapshot());if(g.history.length>250)g.history.shift();g.piles[to].push(...g.piles[from]);g.piles.splice(from,1);g.moves++;g.selected=null;g.hinted=[];if(g.piles.length===1){g.done=true;wins++;try{localStorage.setItem('fifty-two-accordion-wins',String(wins))}catch(e){}g.message='🏆 52枚を1山に圧縮！ 完全勝利。'}else if(!movesAvailable().length){g.message='移動できる組がない。1手戻して別の道を探そう。'}else g.message='重ねた！ 残り'+g.piles.length+'山。';render()}function tap(i){if(g.done)return;if(g.selected!==null&&canMove(g.selected,i)){move(g.selected,i);return}if(g.selected===i){g.selected=null;g.message='選択を解除した。'}else{g.selected=i;g.message='山'+(i+1)+'を選択。左隣か左3山前を選んで重ねる。'}g.hinted=[];render()}function hint(){const a=movesAvailable();g.selected=null;if(a.length){g.hinted=a[0];g.message='緑の2山が移動可能。右側の山を左側へ重ねよう。'}else{g.hinted=[];g.message='移動可能な組がない。1手戻すか配り直そう。'}render()}function undo(){if(!g.history.length)return;const h=g.history.pop(),history=g.history;Object.assign(g,h,{history});g.message='1手戻した。';render()}function render(){$('remaining').textContent=g.piles.length+' / 52';$('moves').textContent=g.moves;$('wins').textContent=wins;$('message').textContent=g.message;$('undo').disabled=!g.history.length;$('hint').disabled=g.done;const root=$('board');root.replaceChildren();g.piles.forEach((pile,i)=>{const c=pile[pile.length-1],b=document.createElement('button');b.type='button';b.className='pile'+(c.si===1||c.si===2?' red':'')+(g.selected===i?' selected':'')+(g.hinted.includes(i)?' hinted':'');b.disabled=g.done;b.setAttribute('aria-label','山'+(i+1)+' '+label(c)+' 合計'+pile.length+'枚');const face=document.createElement('span');face.textContent=label(c);const count=document.createElement('span');count.className='count';count.textContent=pile.length+'枚';b.append(face,count);b.onclick=()=>tap(i);root.append(b)})}$('hint').onclick=hint;$('undo').onclick=undo;$('restart').onclick=()=>{if(!g.done&&!confirm('現在の対局を破棄して配り直しますか？'))return;start()};start()})();</script></body></html>
