<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>イレブンズ | FIFTY-TWO</title><style>:root{font-family:system-ui,sans-serif;background:#151d2b;color:#f4f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:14px}a{color:#e8d49c}h1{font-size:29px;margin:12px 0 5px}.muted{color:#bccbd9;font-size:13px;line-height:1.7}.panel{background:#233247;border:1px solid #566b81;border-radius:16px;padding:14px;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats strong{display:block;font-size:23px;color:#f4d78e}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;max-width:410px;margin:16px auto}.card{aspect-ratio:.78;min-width:0;border:2px solid #e4daca;border-radius:11px;background:#fff9ee;color:#1e2e3d;font:900 clamp(25px,7vw,39px) system-ui;cursor:pointer;touch-action:manipulation}.card.red{color:#bf2b4e}.card.selected{outline:4px solid #eacb76;outline-offset:1px}.card.hinted{box-shadow:0 0 0 4px #81d9b7}.card.empty{background:#1b293a;border:1px dashed #61768c;color:#61768c;cursor:default}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.action{min-height:46px;border:0;border-radius:10px;background:#ecd18d;color:#1e2939;font:800 15px system-ui;padding:11px 15px;cursor:pointer}.action:disabled{opacity:.45}.message{min-height:55px;color:#f8dea0;line-height:1.6;font-weight:700}.help{font-size:13px;line-height:1.8}@media(max-width:400px){.board{gap:7px}.card{border-radius:7px}}</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>イレブンズ <small class="muted">第38作 · ELEVENS</small></h1><p class="muted">合計11の2枚、またはJ・Q・Kの3枚を取り除こう。9マスの数字パズル。</p><section class="panel"><div class="stats"><div>除去<strong id="removed">0 / 52</strong></div><div>山札<strong id="stock">43</strong></div><div>通算勝利<strong id="wins">0</strong></div></div><div id="board" class="board" aria-label="3×3のカード盤面"></div><p id="message" class="message" aria-live="polite"></p><div class="actions"><button id="hint" class="action">ヒント</button><button id="undo" class="action">1手戻す</button><button id="restart" class="action">新しい対局</button></div></section><details class="panel help"><summary>📖 遊び方</summary><p>最初に9枚を並べます。Aは1として、<strong>2枚の合計が11</strong>になる組を選ぶと除去できます（A+10、2+9、3+8、4+7、5+6）。また、<strong>J・Q・Kを1枚ずつ</strong>選んでも除去できます。消した場所には山札から自動補充します。52枚すべて取り除けば勝利。選択を外すときは同じカードをもう一度押してください。</p></details></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),suits=['♠','♥','♦','♣'];let g,wins=0;try{const n=Number(localStorage.getItem('fifty-two-elevens-wins'));if(Number.isSafeInteger(n)&&n>=0)wins=n}catch(e){}const label=c=>(c.r===1?'A':c.r===11?'J':c.r===12?'Q':c.r===13?'K':c.r)+suits[c.si];function start(){const d=[];for(let si=0;si<4;si++)for(let r=1;r<=13;r++)d.push({r,si});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}g={board:d.slice(0,9),stock:d.slice(9),selected:[],hinted:[],history:[],removed:0,done:false,message:'合計11の2枚か、J・Q・Kを選ぼう。'};render()}function valid(ids){const ranks=ids.map(i=>g.board[i]?.r);return ids.length===2&&ranks.every(r=>r>=1&&r<=10)&&ranks[0]+ranks[1]===11||ids.length===3&&[11,12,13].every(r=>ranks.includes(r))}function options(){const a=[];for(let i=0;i<9;i++)for(let j=i+1;j<9;j++)if(valid([i,j]))a.push([i,j]);const j=g.board.findIndex(c=>c?.r===11),q=g.board.findIndex(c=>c?.r===12),k=g.board.findIndex(c=>c?.r===13);if(j>=0&&q>=0&&k>=0)a.push([j,q,k]);return a}function snapshot(){return {board:g.board.slice(),stock:g.stock.slice(),selected:g.selected.slice(),hinted:g.hinted.slice(),removed:g.removed,done:g.done,message:g.message}}function finish(){if(g.removed===52){g.done=true;wins++;try{localStorage.setItem('fifty-two-elevens-wins',String(wins))}catch(e){}g.message='🏆 全52枚を除去！ イレブンズ完全勝利。'}else if(!options().length){g.message='除去できる組がない。1手戻すか配り直そう。'}}function remove(ids){g.history.push(snapshot());if(g.history.length>200)g.history.shift();for(const i of ids){g.board[i]=g.stock.length?g.stock.shift():null;g.removed++}g.selected=[];g.hinted=[];g.message=ids.length+'枚除去！';finish();render()}function tap(i){if(g.done||!g.board[i])return;if(g.selected.includes(i)){g.selected=g.selected.filter(x=>x!==i);g.message='選択を解除した。';render();return}const next=[...g.selected,i];if(valid(next)){remove(next);return}if(next.length>=3){g.selected=[i];g.message='組が成立しないため選び直した。';}else if(next.length===2){const r=next.map(x=>g.board[x].r);if(r.some(x=>x<=10)){g.selected=[i];g.message='合計11にならない。選び直そう。'}else{g.selected=next;g.message='J・Q・Kを揃えよう。'}}else{g.selected=next;g.message='次のカードを選ぼう。'}g.hinted=[];render()}function hint(){const a=options();g.selected=[];g.hinted=a.length?a[0]:[];g.message=a.length?'緑色のカードが除去可能な組。':'除去できる組がない。1手戻すか配り直そう。';render()}function undo(){if(!g.history.length)return;if(g.done){wins=Math.max(0,wins-1);try{localStorage.setItem('fifty-two-elevens-wins',String(wins))}catch(e){}}const history=g.history,h=history.pop();Object.assign(g,h,{history});g.message='1手戻した。';render()}function render(){$('removed').textContent=g.removed+' / 52';$('stock').textContent=g.stock.length;$('wins').textContent=wins;$('message').textContent=g.message;$('hint').disabled=g.done;$('undo').disabled=!g.history.length;const root=$('board');root.replaceChildren();g.board.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='card'+(!c?' empty':c.si===1||c.si===2?' red':'')+(g.selected.includes(i)?' selected':'')+(g.hinted.includes(i)?' hinted':'');b.textContent=c?label(c):'·';b.disabled=!c||g.done;b.setAttribute('aria-label',c?'位置'+(i+1)+' '+label(c):'空きマス');b.onclick=()=>tap(i);root.append(b)})}$('hint').onclick=hint;$('undo').onclick=undo;$('restart').onclick=()=>{if(!g.done&&!confirm('現在の対局を破棄して配り直しますか？'))return;start()};start()})();</script></body></html>
