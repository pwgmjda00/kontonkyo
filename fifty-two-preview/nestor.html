<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ネスター | FIFTY-TWO</title><style>.card.joker-hint{box-shadow:0 0 0 4px #9ee4ff!important;position:relative;z-index:2}:root{font-family:system-ui,sans-serif;background:#141d2a;color:#f5f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:790px;margin:auto;padding:14px}a{color:#f0d69e}h1{font-size:30px;margin:12px 0 5px}.muted{font-size:13px;color:#bfccda;line-height:1.7}.panel{background:#233347;border:1px solid #556e85;border-radius:16px;padding:13px;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats strong{display:block;color:#f2d58e;font-size:23px}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin:15px 0}.pile{border:1px solid #617c94;border-radius:10px;min-width:0;min-height:124px;padding:5px;text-align:center;background:#1b2b3d}.pile .heading{font-size:11px;color:#c6d2de}.card{display:grid;place-items:center;width:100%;aspect-ratio:.72;max-height:105px;margin:5px auto;border:2px solid #e4d8c9;border-radius:8px;background:#fff9ee;color:#243242;font:900 clamp(15px,3vw,25px) system-ui;cursor:pointer;touch-action:manipulation}.card.red{color:#c52f51}.card.empty{background:#233447;border:1px dashed #71859a;color:#708399;cursor:default}.card.selected{outline:3px solid #f2d27b;outline-offset:1px}.card.hinted{box-shadow:0 0 0 3px #79d6af}.count{font-size:11px;color:#c0d0de}.reserve{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:420px;margin:8px auto 16px}.reserve .pile{min-height:116px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.action{border:0;border-radius:10px;background:#edd28f;color:#1c2a39;min-height:46px;padding:11px 15px;font:800 15px system-ui;cursor:pointer}.action:disabled{opacity:.45}.message{min-height:48px;color:#f9df9e;line-height:1.6;font-weight:700}.help{font-size:13px;line-height:1.8}@media(max-width:540px){.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.pile{min-height:110px}.card{font-size:23px}.reserve .pile{min-height:110px}}</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>ネスター <small class="muted">第40作 · NESTOR</small></h1><p class="muted">8列の一番上と予備札から、同じ数字のペアを取り除こう。52枚すべて消せば勝利。</p><section class="panel"><div class="stats"><div>除去<strong id="removed">0 / 52</strong></div><div>残り<strong id="remaining">52</strong></div><div>勝利<strong id="wins">0</strong></div><div>🃏勝利<strong id="jokerWins">0</strong></div></div><div id="board" class="board" aria-label="8列のカード"></div><p class="muted" style="text-align:center;margin:8px 0 0">予備札（4枚）</p><div id="reserve" class="reserve" aria-label="予備札"></div><p id="message" class="message" aria-live="polite"></p><div class="actions"><button id="hint" class="action">ヒント</button><button id="undo" class="action">1手戻す</button><button id="restart" class="action">新しい対局</button></div></section><details class="panel help"><summary>📖 遊び方</summary><p>52枚のうち48枚を8列×6枚に、残り4枚を予備札に配ります。同じ列には同じ数字が重複しないよう配られます。各列の一番上と予備札はいつでも選択可能。同じ数字のカードを2枚選ぶと取り除けます。マークは無関係。全52枚を取り除けば勝利です。予備札は重なっておらず、4枚とも最初から使えます。</p></details></main><script src="./engine/jokers.js"></script><script src="./engine/joker-score-mode.js"></script><script src="./engine/joker-actions.js"></script><script src="./engine/joker-layout-mode.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),suits=['♠','♥','♦','♣'];let g,wins=0,jokerWins=0;try{const n=Number(localStorage.getItem('fifty-two-nestor-wins'));if(Number.isSafeInteger(n)&&n>=0)wins=n}catch(e){}try{const n=Number(localStorage.getItem('fifty-two-nestor-joker-wins'));if(Number.isSafeInteger(n)&&n>=0)jokerWins=n}catch(e){}const label=c=>(c.r===1?'A':c.r===11?'J':c.r===12?'Q':c.r===13?'K':c.r)+suits[c.si];function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function deal(){for(let attempt=0;attempt<500;attempt++){const cols=Array.from({length:8},()=>[]),reserve=[];let ok=true;for(const r of shuffle(Array.from({length:13},(_,i)=>i+1))){const cards=shuffle(Array.from({length:4},(_,si)=>({r,si})));const slots=shuffle(Array.from({length:9},(_,i)=>i)).filter(i=>i===8?reserve.length<4:cols[i].length<6).slice(0,4);if(slots.length<4){ok=false;break}slots.forEach((i,j)=>{if(i===8)reserve.push(cards[j]);else cols[i].push(cards[j])})}if(ok&&cols.every(c=>c.length===6)&&reserve.length===4){cols.forEach(shuffle);return {cols,reserve}}}throw Error('配札に失敗しました')}function start(){joker.begin();const d=deal();g={cols:d.cols,reserve:d.reserve,selected:null,hinted:[],history:[],removed:0,done:false,message:'同じ数字の2枚を選ぼう。'};render()}function get(id){if(id<8){const c=g.cols[id];return c[c.length-1]}return g.reserve[id-8]}function options(){const a=[];for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)if(get(i)&&get(j)&&get(i).r===get(j).r)a.push([i,j]);return a}function recommend(){const pairs=options(),results=pairs.map(ids=>{const after=Array.from({length:12},(_,i)=>ids.includes(i)?i<8?g.cols[i].at(-2):null:get(i));let following=0;for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)if(after[i]&&after[j]&&after[i].r===after[j].r)following++;return {ids,following}});results.sort((a,b)=>b.following-a.following);return results[0]||null}function snapshot(){return {cols:g.cols.map(c=>c.slice()),reserve:g.reserve.slice(),selected:g.selected,hinted:g.hinted.slice(),removed:g.removed,done:g.done,message:g.message}}function tap(id){if(g.done||!get(id))return;if(g.selected!==null&&g.selected!==id&&get(g.selected).r===get(id).r){g.history.push(snapshot());if(g.history.length>200)g.history.shift();const a=get(g.selected),b=get(id);for(const i of [g.selected,id])if(i<8)g.cols[i].pop();else g.reserve[i-8]=null;g.removed+=2;g.selected=null;g.hinted=[];g.message=label(a)+' と '+label(b)+' を除去。';if(g.removed===52){g.done=true;if(joker.mode==='joker'){jokerWins++;try{localStorage.setItem('fifty-two-nestor-joker-wins',String(jokerWins))}catch(e){}}else{wins++;try{localStorage.setItem('fifty-two-nestor-wins',String(wins))}catch(e){}}g.message='🏆 52枚すべて除去！ ネスター完全勝利。'}else if(!options().length)g.message='ペアがない。1手戻して別の順序を試そう。';render();return}g.selected=g.selected===id?null:id;g.hinted=[];g.message=g.selected===null?'選択解除。':'同じ数字のカードを選ぼう。';render()}function hint(){const p=options();g.selected=null;g.hinted=p.length?p[0]:[];g.message=p.length?'緑色の2枚がペア。':'ペアがない。1手戻すか配り直そう。';render()}function undo(){if(!g.history.length)return;if(g.done){if(joker.mode==='joker'){jokerWins=Math.max(0,jokerWins-1);try{localStorage.setItem('fifty-two-nestor-joker-wins',String(jokerWins))}catch(e){}}else{wins=Math.max(0,wins-1);try{localStorage.setItem('fifty-two-nestor-wins',String(wins))}catch(e){}}}const history=g.history,h=history.pop();Object.assign(g,h,{history});g.message='1手戻した。';render()}function card(id,heading,count,jokerHints){const c=get(id),el=document.createElement('div');el.className='pile';const title=document.createElement('div');title.className='heading';title.textContent=heading;const b=document.createElement('button');b.type='button';b.className='card'+(!c?' empty':c.si===1||c.si===2?' red':'')+(g.selected===id?' selected':'')+(g.hinted.includes(id)?' hinted':'')+(jokerHints.includes(id)?' joker-hint':'');b.textContent=c?label(c):'·';b.disabled=!c||g.done;b.setAttribute('aria-label',heading+(c?' '+label(c):' 空き'));b.onclick=()=>tap(id);const sub=document.createElement('div');sub.className='count';sub.textContent=count;el.append(title,b,sub);return el}function render(){const pick=joker.effectType()==='hintChance'?recommend():null;const jokerHints=pick&&g.selected===null?pick.ids:[];$('removed').textContent=g.removed+' / 52';$('remaining').textContent=52-g.removed;$('wins').textContent=wins;$('jokerWins').textContent=jokerWins;$('message').textContent=g.message;$('hint').disabled=g.done;$('undo').disabled=!g.history.length;const root=$('board');root.replaceChildren();g.cols.forEach((p,i)=>root.append(card(i,'列 '+(i+1),p.length+'枚',jokerHints)));const reserve=$('reserve');reserve.replaceChildren();g.reserve.forEach((c,i)=>reserve.append(card(i+8,'予備 '+(i+1),c?'使用可':'除去済',jokerHints)));joker.refresh({base:g.removed,finished:g.done,win:g.removed===52,moves:g.history.length,recommendation:pick?pick.ids.map(i=>i<8?'列'+(i+1):'予備'+(i-7)).join('＋')+'（次に'+pick.following+'組）':''});}$('hint').onclick=hint;$('undo').onclick=undo;$('restart').onclick=()=>{if(!g.done&&!confirm('現在の対局を破棄して配り直しますか？'))return;start()};const joker=FiftyTwoJokerLayoutMode.create('nestor',{reset:start,hasProgress:()=>!!g&&g.history.length>0,label});start()})();</script><script src="./collection.js" defer></script></body></html>
