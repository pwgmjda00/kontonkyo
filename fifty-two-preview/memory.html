<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>神経衰弱 | FIFTY-TWO</title><style>
:root{font-family:system-ui,sans-serif;background:#141927;color:#f4f2eb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:13px}a{color:#a9d7f9}h1{font-size:30px;margin:12px 0 5px}.muted{font-size:13px;color:#adbcd3;line-height:1.6}.panel{background:#212b40;border:1px solid #536382;border-radius:15px;padding:13px;margin:10px 0}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.stats strong{font-size:24px;color:#f7d68b}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin:13px 0}.card{aspect-ratio:.71;min-width:0;border:2px solid #8499bd;border-radius:6px;background:repeating-linear-gradient(45deg,#344a72 0 6px,#293c60 6px 12px);color:#d7e5fa;display:grid;place-items:center;font:800 clamp(12px,3vw,20px) system-ui;cursor:pointer;touch-action:manipulation}.card.face{background:#f7f4ea;border-color:#f1e5c4;color:#202636}.card.red{color:#c0324f}.card.matched{background:#293d37;border-color:#557a6d;color:#8bb9a8;cursor:default;opacity:.38}.card:disabled{cursor:default}.card:focus-visible{outline:3px solid #ffda7d}.message{font-weight:700;color:#ffe0a0;min-height:42px;line-height:1.5}.actions{display:flex;gap:9px;flex-wrap:wrap}button.action{border:0;border-radius:10px;background:#e8c77d;color:#1d2635;font:800 16px system-ui;padding:12px 16px;min-height:45px;cursor:pointer}details{font-size:13px}summary{font-weight:800;cursor:pointer}li{margin:5px 0}@media(max-width:400px){.board{gap:3px}.card{border-width:1px;border-radius:4px;font-size:11px}}
</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>神経衰弱 <small class="muted">MEMORY · 第26作</small></h1><p class="muted">26組の数字を探す記憶勝負。CPUも見たカードを覚えている。</p><section class="panel"><div class="stats"><span>あなた <strong id="mine">0</strong>組</span><span>CPU <strong id="cpu">0</strong>組</span><span>残り <strong id="remaining">26</strong>組</span><span id="turn">あなたの番</span></div><p id="message" class="message" aria-live="polite"></p><div id="board" class="board" aria-label="神経衰弱のカード52枚"></div><div class="actions"><button id="restart" class="action">新しい対局</button></div></section><details class="panel"><summary>📖 遊び方</summary><ol><li>52枚を裏向きに並べます。数字が同じ2枚を揃えると1組獲得。マークは違っても構いません。</li><li>1回に2枚めくります。揃えばもう一度、外れたら相手の番です。</li><li>同じ数字のカードは4枚あるため、各数字につき2組できます。</li><li>CPUは一度見たカードの位置を記憶します。全26組を取り終えた時点で多く獲得した方が勝利です。</li></ol></details></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),suits=['♠','♥','♦','♣'];let g,timer=null;const label=c=>(c.r===1?'A':c.r===11?'J':c.r===12?'Q':c.r===13?'K':c.r)+suits[c.si];function start(){if(timer!==null){clearTimeout(timer);timer=null}const deck=[];for(let si=0;si<4;si++)for(let r=1;r<=13;r++)deck.push({si,r});for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}g={deck,matched:new Set(),seen:new Map(),opened:[],mine:0,cpu:0,turn:0,busy:false,done:false,message:'2枚めくって同じ数字を揃えよう。'};render()}function remember(i){g.seen.set(i,g.deck[i].r)}function available(){return g.deck.map((_,i)=>i).filter(i=>!g.matched.has(i))}function chooseCpu(){const ids=available(),pairs=new Map();for(const i of ids){if(!g.seen.has(i))continue;const r=g.seen.get(i);if(!pairs.has(r))pairs.set(r,[]);pairs.get(r).push(i)}for(const arr of pairs.values())if(arr.length>=2)return arr.slice(0,2);const known=ids.filter(i=>g.seen.has(i)),unknown=ids.filter(i=>!g.seen.has(i));if(unknown.length){const first=unknown[Math.floor(Math.random()*unknown.length)];const r=g.deck[first].r;const partner=known.find(i=>g.seen.get(i)===r);const pool=unknown.filter(i=>i!==first);return[first,partner!==undefined?partner:(pool.length?pool[Math.floor(Math.random()*pool.length)]:known[0])]}return ids.slice(0,2)}function reveal(i){if(g.done||g.busy||g.turn!==0||g.matched.has(i)||g.opened.includes(i))return;g.opened.push(i);remember(i);render();if(g.opened.length===2)resolve()}function resolve(){g.busy=true;const [a,b]=g.opened;const same=g.deck[a].r===g.deck[b].r;g.message=same?(g.turn===0?'正解！ もう一度。':'CPUがペアを獲得。'):('不一致。'+(g.turn===0?'CPUの番。':'あなたの番。'));render();timer=setTimeout(()=>{timer=null;if(same){g.matched.add(a);g.matched.add(b);g.seen.delete(a);g.seen.delete(b);if(g.turn===0)g.mine++;else g.cpu++;}else g.turn=1-g.turn;g.opened=[];g.busy=false;if(g.matched.size===52){g.done=true;g.message='対局終了！ '+(g.mine>g.cpu?'あなたの勝利！':g.mine<g.cpu?'CPUの勝利。':'引き分け。')}render();if(!g.done&&g.turn===1)cpuStep()},650)}function cpuStep(){if(g.done||g.turn!==1||g.busy)return;g.busy=true;g.message='CPUがカードを選んでいる…';render();timer=setTimeout(()=>{timer=null;const pair=chooseCpu();if(pair.length<2){g.busy=false;return}g.opened=pair;pair.forEach(remember);g.busy=false;resolve()},550)}function render(){$('mine').textContent=g.mine;$('cpu').textContent=g.cpu;$('remaining').textContent=26-g.mine-g.cpu;$('turn').textContent=g.done?'終了':g.turn===0?'あなたの番':'CPUの番';$('message').textContent=g.message;const board=$('board');board.replaceChildren(...g.deck.map((c,i)=>{const matched=g.matched.has(i),face=g.opened.includes(i);const b=document.createElement('button');b.type='button';b.className='card'+(matched?' matched':face?' face'+(c.si===1||c.si===2?' red':''):'');b.textContent=matched?'✓':face?label(c):'✦';b.setAttribute('aria-label',matched?'取得済み':face?label(c):'裏向きのカード '+(i+1));b.disabled=matched||face||g.busy||g.turn!==0||g.done;b.onclick=()=>reveal(i);return b}))}$('restart').onclick=()=>{if(!g.done&&!confirm('今の対局を終了して新しく始めますか？'))return;start()};start();
})();
</script></body></html>
