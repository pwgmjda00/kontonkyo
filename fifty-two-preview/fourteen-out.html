<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>フォーティーン・アウト | FIFTY-TWO</title><style>:root{font-family:system-ui,sans-serif;background:#151e2c;color:#f7f1e8}*{box-sizing:border-box}body{margin:0}main{max-width:790px;margin:auto;padding:14px}a{color:#f0d49b}h1{font-size:29px;margin:12px 0 5px}.muted{font-size:13px;color:#c0cbd8;line-height:1.7}.panel{background:#233247;border:1px solid #586c84;border-radius:15px;padding:13px;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats strong{display:block;font-size:23px;color:#f2d58e}.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin:16px 0}.pile{border:1px solid #6a8198;border-radius:9px;min-width:0;min-height:118px;padding:6px;background:#1a293a;text-align:center}.pile .number{font-size:11px;color:#bdcad9}.card{width:100%;aspect-ratio:.74;max-height:105px;margin-top:4px;border:2px solid #e1d9ca;border-radius:8px;background:#fff9ee;color:#223244;font:900 clamp(16px,3vw,27px) system-ui;cursor:pointer;touch-action:manipulation}.card.red{color:#c32e51}.card.selected{outline:3px solid #f5d47b;outline-offset:1px}.card.hinted{box-shadow:0 0 0 3px #77d6af}.card.empty{background:transparent;border:1px dashed #61768a;color:#718399;cursor:default}.count{font-size:11px;color:#c4d0dc;margin-top:4px}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.action{border:0;border-radius:10px;background:#efd492;color:#202c3b;min-height:46px;padding:11px 15px;font:800 15px system-ui;cursor:pointer}.action:disabled{opacity:.45}.message{min-height:48px;color:#f8df9e;font-weight:700;line-height:1.6}.help{font-size:13px;line-height:1.8}@media(max-width:560px){.board{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.pile{min-height:104px;padding:4px}.card{font-size:20px}}@media(max-width:360px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>フォーティーン・アウト <small class="muted">第39作 · FOURTEEN OUT</small></h1><p class="muted">13列の山から、合計14になる2枚を取り除く。AとK、2とQ、3とJ……数字のペアを見抜け。</p><section class="panel"><div class="stats"><div>除去<strong id="removed">0 / 52</strong></div><div>残りの山<strong id="piles">13</strong></div><div>勝利<strong id="wins">0</strong></div></div><div class="board" id="board" aria-label="13列のカード"></div><p id="message" class="message" aria-live="polite"></p><div class="actions"><button id="hint" class="action">ヒント</button><button id="undo" class="action">1手戻す</button><button id="restart" class="action">新しい配り方</button></div></section><details class="panel help"><summary>📖 ルール</summary><p>52枚を13列に4枚ずつ配ります。各列の一番上のカードから、<strong>数字の合計が14になる2枚</strong>を選んで除去します。Aは1、Jは11、Qは12、Kは13。マークは無関係です。選べるのは各列の一番上だけ。52枚すべて取り除けば勝利です。ヒントは消せる組を表示します。</p></details></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),suits=['♠','♥','♦','♣'];let g,wins=0;try{const n=Number(localStorage.getItem('fifty-two-fourteen-out-wins'));if(Number.isSafeInteger(n)&&n>=0)wins=n}catch(e){}const label=c=>(c.r===1?'A':c.r===11?'J':c.r===12?'Q':c.r===13?'K':c.r)+suits[c.si];function start(){const d=[];for(let si=0;si<4;si++)for(let r=1;r<=13;r++)d.push({si,r});for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}g={piles:Array.from({length:13},(_,i)=>d.slice(i*4,i*4+4)),selected:null,hinted:[],removed:0,history:[],done:false,message:'合計14になる2枚を選ぼう。'};render()}function top(i){const p=g.piles[i];return p[p.length-1]}function valid(i,j){return i!==j&&!!top(i)&&!!top(j)&&top(i).r+top(j).r===14}function possible(){const arr=[];for(let i=0;i<13;i++)for(let j=i+1;j<13;j++)if(valid(i,j))arr.push([i,j]);return arr}function snapshot(){return {piles:g.piles.map(p=>p.slice()),selected:g.selected,hinted:g.hinted.slice(),removed:g.removed,done:g.done,message:g.message}}function tap(i){if(g.done||!top(i))return;if(g.selected!==null&&valid(g.selected,i)){g.history.push(snapshot());if(g.history.length>200)g.history.shift();const a=g.piles[g.selected].pop(),b=g.piles[i].pop();g.removed+=2;g.selected=null;g.hinted=[];g.message=label(a)+' と '+label(b)+' を除去。';if(g.removed===52){g.done=true;wins++;try{localStorage.setItem('fifty-two-fourteen-out-wins',String(wins))}catch(e){}g.message='🏆 26ペアすべて発見！ 完全勝利。'}else if(!possible().length)g.message='これ以上ペアがない。1手戻して別の組み合わせを試そう。';render();return}g.selected=g.selected===i?null:i;g.hinted=[];g.message=g.selected===null?'選択を解除した。':'合計14になる別の列を選ぼう。';render()}function hint(){const p=possible();g.selected=null;g.hinted=p.length?p[0]:[];g.message=p.length?'緑の2枚が合計14。':'ペアがない。1手戻すか配り直そう。';render()}function undo(){if(!g.history.length)return;if(g.done){wins=Math.max(0,wins-1);try{localStorage.setItem('fifty-two-fourteen-out-wins',String(wins))}catch(e){}}const history=g.history,h=history.pop();Object.assign(g,h,{history});g.message='1手戻した。';render()}function render(){$('removed').textContent=g.removed+' / 52';$('piles').textContent=g.piles.filter(p=>p.length).length;$('wins').textContent=wins;$('message').textContent=g.message;$('hint').disabled=g.done;$('undo').disabled=!g.history.length;const root=$('board');root.replaceChildren();g.piles.forEach((p,i)=>{const c=top(i),el=document.createElement('div');el.className='pile';const n=document.createElement('div');n.className='number';n.textContent='列 '+(i+1);const b=document.createElement('button');b.type='button';b.className='card'+(!c?' empty':c.si===1||c.si===2?' red':'')+(g.selected===i?' selected':'')+(g.hinted.includes(i)?' hinted':'');b.textContent=c?label(c):'·';b.disabled=!c||g.done;b.setAttribute('aria-label',c?'列'+(i+1)+' '+label(c):'空列');b.onclick=()=>tap(i);const count=document.createElement('div');count.className='count';count.textContent=p.length+'枚';el.append(n,b,count);root.append(el)})}$('hint').onclick=hint;$('undo').onclick=undo;$('restart').onclick=()=>{if(!g.done&&!confirm('現在の対局を破棄して配り直しますか？'))return;start()};start()})();</script></body></html>
