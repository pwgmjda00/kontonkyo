<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aces Up | FIFTY-TWO</title><style>:root{font-family:system-ui,sans-serif;background:#131d29;color:#f4f1e8}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:14px}a{color:#f0d59a}h1{font-size:30px;margin:12px 0 5px}.muted{color:#b8c7d5;font-size:13px;line-height:1.7}.panel{border:1px solid #526a7c;border-radius:16px;background:#223244;padding:14px;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats strong{display:block;font-size:23px;color:#f2d78f}.columns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0;align-items:start}.column{border:1px solid #617a8e;border-radius:12px;min-height:175px;padding:9px;text-align:center;background:#1c2b39}.column.selected{outline:3px solid #e9c978}.stack{height:100px;position:relative;margin:12px auto 4px;max-width:100px}.card{display:grid;place-items:center;border:2px solid #ded8c6;background:#fff9ef;color:#1a2c39;border-radius:9px;position:absolute;width:100%;height:90px;font:900 24px system-ui;box-shadow:0 4px 7px #0004;cursor:pointer;touch-action:manipulation}.card.red{color:#bb284a}.card.eligible{outline:3px solid #e8c96b}.card:disabled{cursor:default}.count{font-size:12px;color:#c1d2e0}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.action{min-height:46px;border:0;border-radius:10px;background:#ebd18d;color:#202b37;padding:12px 16px;font:800 15px system-ui;cursor:pointer}.action:disabled{opacity:.45}.message{min-height:48px;color:#ffe2a3;font-weight:700;line-height:1.65}.help{font-size:13px;line-height:1.8}@media(max-width:400px){.columns{gap:5px}.column{padding:5px;min-height:140px}.stack{height:78px}.card{height:70px;font-size:18px}}</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>エースアップ <small class="muted">第34作 · ACES UP</small></h1><p class="muted">同じマークの小さいカードを取り除き、最後に4枚のAだけを残せ。</p><section class="panel"><div class="stats"><div>残り山札<strong id="stock">48</strong></div><div>除去<strong id="removed">0 / 48</strong></div><div>通算勝利<strong id="wins">0</strong></div></div><div id="columns" class="columns" aria-label="4列のカード"></div><p class="message" id="message" aria-live="polite"></p><div class="actions"><button id="deal" class="action">4枚配る</button><button id="undo" class="action">1手戻す</button><button id="restart" class="action">新しい対局</button></div></section><details class="panel help"><summary>📖 ルール</summary><p>最初に4列へ1枚ずつ配ります。各列の一番上だけ操作できます。同じマークのカードが2枚以上見えている場合、その中で数字が小さいカードをタップして除去できます。Aが最強、Kが次に強く、2が最弱です。空列があれば別の列の一番上を移動できます。山札からは4列へ1枚ずつ配ります。全52枚を処理し、4枚のAだけが残れば勝利です。選択中のカードをもう一度タップすると選択を解除できます。</p></details></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),suits=['♠','♥','♦','♣'];let g,wins=0;try{const n=Number(localStorage.getItem('fifty-two-aces-up-wins'));if(Number.isSafeInteger(n)&&n>=0)wins=n}catch(e){}const label=c=>(c.r===1?'A':c.r===11?'J':c.r===12?'Q':c.r===13?'K':c.r)+suits[c.si],power=c=>c.r===1?14:c.r;function snapshot(){return {stock:g.stock.slice(),cols:g.cols.map(c=>c.slice()),removed:g.removed,selected:g.selected,done:g.done,message:g.message}}function save(){g.history.push(snapshot());if(g.history.length>200)g.history.shift()}function start(){const deck=[];for(let si=0;si<4;si++)for(let r=1;r<=13;r++)deck.push({si,r});for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}g={cols:Array.from({length:4},(_,i)=>[deck[i]]),stock:deck.slice(4),removed:0,selected:null,done:false,message:'同じマークの弱いカードを消そう。',history:[]};render()}function top(i){const c=g.cols[i];return c[c.length-1]}function removable(i){const c=top(i);return !!c&&g.cols.some((col,j)=>j!==i&&col.length&&col[col.length-1].si===c.si&&power(col[col.length-1])>power(c))}function check(){if(g.stock.length===0&&g.cols.every(col=>col.length===1&&col[0].r===1)){g.done=true;wins++;try{localStorage.setItem('fifty-two-aces-up-wins',String(wins))}catch(e){}g.message='🏆 4枚のAだけを残した！ 完全勝利。'}else if(g.stock.length===0&&!g.cols.some((col,i)=>removable(i))&&!g.cols.some(col=>col.length===0)){g.done=true;g.message='これ以上動かせない。残り '+g.cols.reduce((n,c)=>n+c.length,0)+'枚。新しい対局で再挑戦。'}}function select(i){if(g.done)return;if(g.selected!==null&&g.selected!==i&&!top(i)){save();g.cols[i].push(g.cols[g.selected].pop());g.selected=null;g.message='空列へ移動した。';check();render();return}if(removable(i)){save();const c=g.cols[i].pop();g.removed++;g.selected=null;g.message=label(c)+' を除去。';check();render();return}if(!top(i)){g.message='移動したい列の一番上を先に選択してね。';render();return}g.selected=g.selected===i?null:i;g.message=g.selected===null?'選択を解除した。':'移動先の空列を選択。';render()}function deal(){if(g.done||g.stock.length<4)return;save();for(let i=0;i<4;i++)g.cols[i].push(g.stock.shift());g.selected=null;g.message='4枚配った。';check();render()}function undo(){if(!g.history.length)return;const h=g.history.pop();Object.assign(g,h,{history:g.history});render()}function render(){$('stock').textContent=g.stock.length;$('removed').textContent=g.removed+' / 48';$('wins').textContent=wins;$('message').textContent=g.message;$('deal').disabled=g.done||g.stock.length===0;$('undo').disabled=!g.history.length;const root=$('columns');root.replaceChildren();g.cols.forEach((col,i)=>{const wrap=document.createElement('div');wrap.className='column'+(g.selected===i?' selected':'');const heading=document.createElement('div');heading.className='count';heading.textContent='列 '+(i+1)+' · '+col.length+'枚';const stack=document.createElement('div');stack.className='stack';const c=top(i);if(c){const b=document.createElement('button');b.type='button';b.className='card'+(c.si===1||c.si===2?' red':'')+(removable(i)?' eligible':'');b.textContent=label(c);b.setAttribute('aria-label',label(c)+(removable(i)?' 除去可能':' 選択して移動'));b.onclick=()=>select(i);stack.append(b)}else{const b=document.createElement('button');b.type='button';b.className='card';b.style.background='#354c61';b.style.color='#e9d9a0';b.textContent='＋';b.setAttribute('aria-label','空列 移動先');b.onclick=()=>select(i);stack.append(b)}wrap.append(heading,stack);root.append(wrap)})}$('deal').onclick=deal;$('undo').onclick=undo;$('restart').onclick=()=>{if(!g.done&&!confirm('現在の対局を破棄して配り直しますか？'))return;start()};start()})();</script><script src="./collection.js" defer></script></body></html>
