<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOKER 77 検証 | FIFTY-TWO</title><style>body{font:16px system-ui;background:#14131e;color:#f8f1e8;max-width:760px;margin:auto;padding:20px}a{color:#cfbaff}li{margin:8px 0}.pass{color:#9ee9ae}.fail{color:#ff9999}</style><a href="./jokers.html">← JOKER 77</a><h1>JOKER 77 セルフテスト</h1><p>ブラウザで共通エンジンの定義・得点・戦闘を検査します。ゲーム画面の操作テストではありません。</p><strong id="summary">検証中…</strong><ol id="results"></ol><script src="./engine/jokers.js"></script><script>(()=>{'use strict';const j=window.FiftyTwoJokers,out=document.getElementById('results');let ok=0,fail=0;function test(name,fn){let error='';try{if(!fn())error='assertion failed'}catch(e){error=String(e)}const li=document.createElement('li');li.className=error?'fail':'pass';li.textContent=(error?'✗ ':'✓ ')+name+(error?'：'+error:'');out.append(li);error?fail++:ok++}test('77枚のIDが一意',()=>j.catalog.length===77&&new Set(j.catalog.map(c=>c.id)).size===77);test('全カードに効果説明',()=>j.catalog.every(c=>c.description&&c.effect.type));test('同日の7枚が重複せず再現可能',()=>{const a=j.daily('2026-11-06').map(c=>c.id),b=j.daily('2026-11-06').map(c=>c.id);return a.length===7&&new Set(a).size===7&&a.join()===b.join()});test('日替わりの装備検証',()=>j.daily('2026-11-06').every(c=>j.validateEquip(c.id,'2026-11-06')));test('未装備は得点変化なし',()=>j.applyScore(null,10,{round:1}).score===10);test('WAR全77枚に個別の能力説明',()=>j.catalog.every(c=>j.battleDescription(c).startsWith('WAR：')&&j.battleDescription(c)!=='WAR：未対応'));test('WAR全77枚の能力説明が重複しない',()=>new Set(j.catalog.map(c=>j.battleDescription(c))).size===77);test('通常WARの強さを保持',()=>{const x=j.battlePower(null,{r:1},{r:13});return x.player===14&&x.enemy===13});for(const c of j.catalog){test(c.id+' 得点・戦闘値が有限',()=>{for(let round=1;round<=10;round++){const x=j.applyScore(c,round*3,{round,win:round%2===0,streak:round,behind:round>5});const y=j.battlePower(c,{r:round%13+1},{r:(round+3)%13+1},{round,behind:round>5});if(!Number.isFinite(x.score)||x.score<0||!Number.isFinite(y.player)||!Number.isFinite(y.enemy))return false}return !!j.abilityDescription(c,'war')})}document.getElementById('summary').textContent=ok+'件成功 / '+fail+'件失敗';})();</script></html>
