<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ブラックホール | FIFTY-TWO</title><style>:root{font-family:system-ui,sans-serif;background:#080d1d;color:#f2f0eb}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:14px}a{color:#d1bdf7}h1{font-size:30px;margin:12px 0 5px}.muted{color:#bfc5dc;font-size:13px;line-height:1.7}.panel{border:1px solid #5b558d;border-radius:18px;background:linear-gradient(140deg,#1c2140,#11182b);padding:14px;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stats strong{display:block;font-size:23px;color:#f0d592}.center{text-align:center;margin:12px auto 18px}.center .hole{display:grid;place-items:center;width:120px;height:120px;margin:8px auto;border:6px solid #8979c5;border-radius:50%;box-shadow:0 0 25px #8775c46e,inset 0 0 25px #000;position:relative;background:radial-gradient(circle,#070b18 25%,#302c5d 100%)}.center .face{font:900 31px system-ui;color:#fff0c2}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:12px 0}.pile{min-width:0;border:1px solid #62678e;background:#1c2541;border-radius:11px;padding:6px;text-align:center}.pile .head,.pile .count{font-size:11px;color:#c7c8df}.card{display:grid;place-items:center;width:100%;aspect-ratio:.72;max-height:95px;border:2px solid #ded8ce;border-radius:8px;background:#fff8ed;color:#243147;font:900 clamp(17px,3.4vw,27px) system-ui;margin:5px auto;cursor:pointer;touch-action:manipulation}.card.red{color:#c12c52}.card.legal{outline:3px solid #86dfb9;outline-offset:1px}.card.empty{background:#26314e;border:1px dashed #73799e;color:#777fa4;cursor:default}.card:disabled{opacity:.48;cursor:default}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.action{border:0;border-radius:10px;background:#e9d18f;color:#1c2738;min-height:45px;padding:11px 14px;font:800 15px system-ui;cursor:pointer}.action:disabled{opacity:.45}.message{min-height:48px;color:#f7dfa3;line-height:1.6;font-weight:700}.help{font-size:13px;line-height:1.8}@media(max-width:500px){.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.card{font-size:23px}.pile{padding:4px}}</style></head><body><main><a href="./">← FIFTY-TWOに戻る</a><h1>ブラックホール <small class="muted">第43作 · BLACK HOLE</small></h1><p class="muted">中央のブラックホールに、数字が1つ違うカードを吸い込ませよう。AとKはつながる。</p><section class="panel"><div class="stats"><div>吸収<strong id="absorbed">1 / 52</strong></div><div>残りの山<strong id="remaining">17</strong></div><div>勝利<strong id="wins">0</strong></div></div><div class="center"><div class="muted">ブラックホールの中心</div><div class="hole"><span class="face" id="center">A♠</span></div><div class="muted" id="next">前後の数字を選ぼう</div></div><div id="board" class="board" aria-label="17列の山札"></div><p id="message" class="message" aria-live="polite"></p><div class="actions"><button id="hint" class="action">ヒント</button><button id="undo" class="action">1手戻す</button><button id="restart" class="action">新しい宇宙</button></div></section><details class="panel help"><summary>📖 遊び方</summary><p>中央のカード1枚を起点に、残り51枚を17列×3枚で並べます。各列の一番上から、中央のカードと数字が<strong>1つ違う</strong>カードを選んで吸収します。Aの隣は2とK、Kの隣はQとA。マークは無関係です。52枚すべてを吸収すれば勝利。緑の枠は吸収できるカードです。</p></details></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),suits=['♠','♥','♦','♣'];let g,wins=0;try{const n=Number(localStorage.getItem('fifty-two-black-hole-wins'));if(Number.isSafeInteger(n)&&n>=0)wins=n}catch(e){}const label=c=>(c.r===1?'A':c.r===11?'J':c.r===12?'Q':c.r===13?'K':c.r)+suits[c.si],rank=r=>r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r);function start(){const deck=[];for(let si=0;si<4;si++)for(let r=1;r<=13;r++)deck.push({si,r});for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}g={center:deck[0],piles:Array.from({length:17},(_,i)=>deck.slice(i*3+1,i*3+4)),absorbed:1,history:[],done:false,message:'緑の枠のカードを選んで吸収しよう。'};render()}function top(i){const p=g.piles[i];return p[p.length-1]}function legal(i){const c=top(i);return !!c&&(Math.abs(c.r-g.center.r)===1||Math.abs(c.r-g.center.r)===12)}function choices(){return g.piles.map((_,i)=>i).filter(legal)}function snapshot(){return {center:g.center,piles:g.piles.map(p=>p.slice()),absorbed:g.absorbed,done:g.done,message:g.message}}function take(i){if(g.done||!legal(i))return;g.history.push(snapshot());if(g.history.length>200)g.history.shift();g.center=g.piles[i].pop();g.absorbed++;g.message=label(g.center)+' を吸収。';if(g.absorbed===52){g.done=true;wins++;try{localStorage.setItem('fifty-two-black-hole-wins',String(wins))}catch(e){}g.message='🌌 全52枚を吸収。ブラックホール完全勝利！'}else if(!choices().length){g.message='吸収できるカードがない。1手戻して別の経路を探そう。'}render()}function hint(){const a=choices();g.message=a.length?'緑枠の '+label(top(a[0]))+' を選べる。':'吸収できるカードがない。1手戻そう。';render()}function undo(){if(!g.history.length)return;if(g.done){wins=Math.max(0,wins-1);try{localStorage.setItem('fifty-two-black-hole-wins',String(wins))}catch(e){}}const history=g.history,h=history.pop();Object.assign(g,h,{history});g.message='1手戻した。';render()}function render(){$('absorbed').textContent=g.absorbed+' / 52';$('remaining').textContent=g.piles.filter(p=>p.length).length;$('wins').textContent=wins;$('center').textContent=label(g.center);$('next').textContent='次：'+rank(g.center.r===1?13:g.center.r-1)+' または '+rank(g.center.r===13?1:g.center.r+1);$('message').textContent=g.message;$('hint').disabled=g.done;$('undo').disabled=!g.history.length;const root=$('board');root.replaceChildren();g.piles.forEach((p,i)=>{const c=top(i),el=document.createElement('div');el.className='pile';const h=document.createElement('div');h.className='head';h.textContent='列 '+(i+1);const b=document.createElement('button');b.type='button';b.className='card'+(!c?' empty':c.si===1||c.si===2?' red':'')+(legal(i)?' legal':'');b.textContent=c?label(c):'·';b.disabled=!legal(i)||g.done;b.setAttribute('aria-label',c?'列'+(i+1)+' '+label(c)+(legal(i)?' 吸収可能':' 吸収不可'):'空列');b.onclick=()=>take(i);const count=document.createElement('div');count.className='count';count.textContent=p.length+'枚';el.append(h,b,count);root.append(el)})}$('hint').onclick=hint;$('undo').onclick=undo;$('restart').onclick=()=>{if(!g.done&&!confirm('現在の対局を破棄して配り直しますか？'))return;start()};start()})();</script></body></html>
