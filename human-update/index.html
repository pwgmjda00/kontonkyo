<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人間アップデート通知</title><meta property="og:title" content="人間アップデート通知"><meta property="og:description" content="人間にも、パッチノートがあっていい。"><style>*{box-sizing:border-box}body{margin:0;background:#101218;color:#eee;font:16px system-ui,sans-serif}main{max-width:580px;margin:auto;padding:20px}h1{font-size:27px;margin:8px 0}header{margin:20px 0}small,p{color:#aab0c2}canvas{width:100%;height:auto;border-radius:16px;display:block}button,input,select,textarea{font:inherit;color:inherit;background:#222631;border:1px solid #41495b;border-radius:10px;padding:12px;min-height:46px}button{cursor:pointer}button.primary{background:#c1ccff;color:#11172b;font-weight:bold}nav,.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button,.row button{flex:1}label{display:block;margin:14px 0 5px;font-size:13px;color:#b9c0d0}input,textarea,select{width:100%}textarea{resize:vertical;min-height:70px}details{margin:20px 0}summary{cursor:pointer;padding:12px 0}footer{text-align:center;font-size:12px;color:#999;margin:32px 0}a{color:#b9c9ff}</style></head><body><main><header><small>HUMAN UPDATE</small><h1>人間アップデート通知</h1><p>人間にも、パッチノートがあっていい。</p></header><canvas id="card" width="1080" height="1080" aria-label="アップデート通知の画像プレビュー"></canvas><nav><button id="random" class="primary">🎲 再生成</button><button id="download">画像保存</button><button id="share">共有</button></nav><label for="mood">アップデートの傾向</label><select id="mood"><option value="mix">おまかせ</option><option value="fun">ネタ</option><option value="soft">やさしい</option><option value="dark">皮肉</option><option value="love">恋愛</option></select><details><summary>自分で編集する</summary><label>ユーザー名（任意）</label><input id="name" maxlength="24" placeholder="名無しの人間"><label>バージョン</label><input id="version" maxlength="24"><label>追加された機能</label><textarea id="add" maxlength="100"></textarea><label>変更された仕様</label><textarea id="change" maxlength="100"></textarea><label>既知の不具合</label><textarea id="bug" maxlength="100"></textarea><label>配色</label><select id="theme"><option value="dark">ダークOS</option><option value="light">ライトOS</option><option value="green">ターミナル</option><option value="pink">ピンクOS</option></select></details><p id="status" role="status"></p><footer><a href="../author/">余白と遊び</a> / HUMAN UPDATE β</footer></main><script>
const $=id=>document.getElementById(id),c=$('card'),ctx=c.getContext('2d'),fields=['name','version','add','change','bug','theme','mood'];const pools={fun:[['布団との通信速度を改善しました。','無意味な検索に対応しました。','冷蔵庫を開ける機能を強化しました。','脳内会議の参加人数を増やしました。'],['やる気の発生条件を緩和しました。','予定のない日の処理速度を改善しました。','深夜の語彙力を上方修正しました。','無駄な買い物の判定を変更しました。'],['何をしに来たか忘れる場合があります。','寝る直前に名案が発生します。','充電しても朝は起動しません。','返信を脳内で完了することがあります。']],soft:[['何もしない日を許可しました。','小さな楽しみを検出できるようになりました。','休憩機能を追加しました。','自分への優しさを追加しました。'],['完璧を求める処理を軽減しました。','失敗時の自己評価を調整しました。','休息を正式な予定に変更しました。','他人と比較する頻度を下げました。'],['褒め言葉の受信に時間がかかります。','疲労を後から検出する場合があります。','気持ちの言語化には時間が必要です。','休憩中も考え事が続く場合があります。']],dark:[['社交辞令の自動翻訳を追加しました。','矛盾の検出精度を向上しました。','期待値の手動調整に対応しました。','沈黙を回答として認識します。'],['世間体の優先度を下げました。','無意味な議論からの退出を高速化しました。','正論の使用頻度を調整しました。','他人の評価を参考情報に変更しました。'],['納得と理解が同期しない場合があります。','正しさだけでは動作しません。','皮肉がそのまま送信される場合があります。','考えすぎにより処理が停止します。']],love:[['好きな人の通知を優先表示します。','会いたい気持ちの検出に対応しました。','思い出の保存容量を拡張しました。','好意を伝える機能を追加しました。'],['駆け引きの処理を簡略化しました。','返信待ちの表示を変更しました。','相手への期待値を調整しました。','言葉より行動を優先するよう変更しました。'],['優しくされると好きになる場合があります。','好きな人の前で語彙力が低下します。','既読の処理に時間がかかります。','思い出が不意に再生されます。']]};const pick=a=>a[Math.floor(Math.random()*a.length)];function generate(){let m=$('mood').value;['add','change','bug'].forEach((k,i)=>{$(k).value=pick(m==='mix'?Object.values(pools).flatMap(p=>p[i]):pools[m][i])});draw()}function lines(t,w){let out=[],line='';for(let ch of t){if(ch==='\n'||ctx.measureText(line+ch).width>w){out.push(line);line=ch==='\n'?'':ch}else line+=ch}if(line)out.push(line);return out}function draw(){let palettes={dark:['#171923','#f3f5ff','#aab8ff','#9de5b2','#ffb4ba'],light:['#f3f5fa','#182238','#405ba4','#176d42','#a52d42'],green:['#101a13','#d1f8d8','#8ceaa2','#8ceaa2','#efcf88'],pink:['#352039','#fff1f8','#f4b9e6','#bce9d2','#ffb7b7']};let [bg,fg,accent,good,bad]=palettes[$('theme').value];ctx.font='38px sans-serif';let groups=[['＋ 追加された機能','add',good],['↻ 変更された仕様','change',accent],['！ 既知の不具合','bug',bad]].map(([label,id,color])=>({label,color,lines:lines($(id).value,900)}));c.height=Math.max(1080,420+groups.reduce((n,g)=>n+95+g.lines.length*53,0));ctx.fillStyle=bg;ctx.fillRect(0,0,1080,c.height);function text(t,x,y,size,color,bold=false){ctx.fillStyle=color;ctx.font=(bold?'bold ':'')+size+'px sans-serif';ctx.fillText(t,x,y)}text('HUMAN OS  /  '+$('version').value,72,100,32,accent,true);text('アップデートのお知らせ',72,190,60,fg,true);text($('name').value||'名無しの人間',72,255,35,accent);ctx.strokeStyle=accent;ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(72,295);ctx.lineTo(1008,295);ctx.stroke();ctx.globalAlpha=1;let y=370;for(let g of groups){text(g.label,72,y,32,g.color,true);y+=65;for(let l of g.lines){text(l,72,y,38,fg);y+=53}y+=45}text('HUMAN UPDATE  /  余白と遊び',72,c.height-55,25,accent);try{localStorage.setItem('human-update-v1',JSON.stringify(Object.fromEntries(fields.map(k=>[k,$(k).value]))))}catch{}}function blob(){return new Promise(resolve=>c.toBlob(resolve,'image/png'))}function message(){return '人間アップデート通知\n'+$('version').value+'\n＋ '+$('add').value+'\n↻ '+$('change').value+'\n！ '+$('bug').value+'\n#人間アップデート通知\n'+location.origin+location.pathname}async function download(){let b=await blob();if(!b)return;$('status').textContent='画像を保存します。';let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='human-update.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}$('download').onclick=download;$('share').onclick=async()=>{try{let b=await blob(),f=new File([b],'human-update.png',{type:'image/png'});if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],text:message()});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(message());$('status').textContent='投稿文をコピーしました。画像保存後に添付してください。'}catch{$('status').textContent='共有できませんでした。画像保存をお試しください。'}};$('random').onclick=generate;fields.forEach(k=>$(k).addEventListener('input',k==='mood'?generate:draw));$('version').value=new Date().toLocaleDateString('ja-JP').replaceAll('/','.');let old;try{old=JSON.parse(localStorage.getItem('human-update-v1'))}catch{}if(old){fields.forEach(k=>{if(typeof old[k]==='string')$(k).value=old[k]});draw()}else generate();
</script></body></html>
