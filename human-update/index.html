<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人間アップデート通知</title><meta property="og:title" content="人間アップデート通知"><meta property="og:description" content="人間にも、パッチノートがあっていい。"><style>*{box-sizing:border-box}body{margin:0;background:#101218;color:#eee;font:16px system-ui,sans-serif}main{max-width:580px;margin:auto;padding:20px}h1{font-size:27px;margin:8px 0}header{margin:20px 0}small,p{color:#aab0c2}canvas{width:100%;height:auto;border-radius:16px;display:block}button,input,select,textarea{font:inherit;color:inherit;background:#222631;border:1px solid #41495b;border-radius:10px;padding:12px;min-height:46px}button{cursor:pointer}button.primary{background:#c1ccff;color:#11172b;font-weight:bold}nav,.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button,.row button{flex:1}label{display:block;margin:14px 0 5px;font-size:13px;color:#b9c0d0}input,textarea,select{width:100%}textarea{resize:vertical;min-height:70px}details{margin:20px 0}summary{cursor:pointer;padding:12px 0}footer{text-align:center;font-size:12px;color:#999;margin:32px 0}a{color:#b9c9ff}body{background:#10132b}canvas{border-radius:0;image-rendering:pixelated}button,input,select,textarea{border-radius:0;border:3px double #aab8ff}button.primary{background:#344b9a;color:white;box-shadow:3px 3px #080a17}header{border:4px double #aab8ff;padding:16px}h1{letter-spacing:.06em}</style></head><body><main><header><small>HUMAN UPDATE</small><h1>人間アップデート通知</h1><p>人間にも、パッチノートがあっていい。</p></header><canvas id="card" width="1080" height="1080" aria-label="アップデート通知の画像プレビュー"></canvas><nav><button id="random" class="primary">🎲 再生成</button><button id="download">画像保存</button><button id="share">共有</button></nav><label for="mood">アップデートの傾向</label><select id="mood"><option value="mix">おまかせ</option><option value="fun">ネタ</option><option value="soft">やさしい</option><option value="dark">皮肉</option><option value="love">恋愛</option></select><label for const $=id=>document.getElementById(id),c=$('card'),ctx=c.getContext('2d'),fields=['name','version','add','change','bug','theme','mood','hero'];const pools={fun:[['布団との通信速度を改善しました。','無意味な検索に対応しました。','冷蔵庫を開ける機能を強化しました。','脳内会議の参加人数を増やしました。'],['やる気の発生条件を緩和しました。','予定のない日の処理速度を改善しました。','深夜の語彙力を上方修正しました。','無駄な買い物の判定を変更しました。'],['何をしに来たか忘れる場合があります。','寝る直前に名案が発生します。','充電しても朝は起動しません。','返信を脳内で完了することがあります。']],soft:[['何もしない日を許可しました。','小さな楽しみを検出できるようになりました。','休憩機能を追加しました。','自分への優しさを追加しました。'],['完璧を求める処理を軽減しました。','失敗時の自己評価を調整しました。','休息を正式な予定に変更しました。','他人と比較する頻度を下げました。'],['褒め言葉の受信に時間がかかります。','疲労を後から検出する場合があります。','気持ちの言語化には時間が必要です。','休憩中も考え事が続く場合があります。']],dark:[['社交辞令の自動翻訳を追加しました。','矛盾の検出精度を向上しました。','期待値の手動調整に対応しました。','沈黙を回答として認識します。'],['世間体の優先度を下げました。','無意味な議論からの退出を高速化しました。','正論の使用頻度を調整しました。','他人の評価を参考情報に変更しました。'],['納得と理解が同期しない場合があります。','正しさだけでは動作しません。','皮肉がそのまま送信される場合があります。','考えすぎにより処理が停止します。']],love:[['好きな人の通知を優先表示します。','会いたい気持ちの検出に対応しました。','思い出の保存容量を拡張しました。','好意を伝える機能を追加しました。'],['駆け引きの処理を簡略化しました。','返信待ちの表示を変更しました。','相手への期待値を調整しました。','言葉より行動を優先するよう変更しました。'],['優しくされると好きになる場合があります。','好きな人の前で語彙力が低下します。','既読の処理に時間がかかります。','思い出が不意に再生されます。']]};const extra={"fun":[["二度寝のコンボ受付時間を延長しました。","脳内反省会に無限周回モードを追加しました。","冷蔵庫の巡回クエストを追加しました。","何もしていないのに疲れるスキルを習得しました。","月曜日に対する防御力を強化しました。","独り言のフルボイス化に対応しました。"],["布団の拘束力を上方修正しました。","休日の体感時間を下方修正しました。","財布の耐久値を再調整しました。","明日から本気を出す機能を常設化しました。","睡眠の推奨レベルを引き上げました。","会話終了後の反省会を短縮しました。"],["やる気のドロップ率は非公開です。","起床時の不具合は運営でも再現できません。","人生のチュートリアルが見つかりません。","空腹時に人格が変わるのは仕様です。","課金しても時間は増えません。","月曜日の削除予定はありません。"]],"soft":[["途中保存できるようになりました。","何もしない時間にも経験値が入ります。","助けを求めるコマンドを追加しました。","小さな達成に報酬を追加しました。","予定変更時の救済措置を追加しました。","自分のペースで進行できます。"],["休憩に必要な条件を撤廃しました。","失敗による経験値減少を廃止しました。","他人とのランキングを非表示にしました。","回復アイテムの使用制限を解除しました。","完璧クリアの必須条件を撤廃しました。","遠回りにも経験値が入るよう変更しました。"],["回復速度には個体差があります。","進捗が見えない場合も内部では進行しています。","休憩中に罪悪感が発生する場合があります。","過去のログが突然再生される場合があります。","褒め言葉の反映には時間がかかります。","すべてのクエストを受ける必要はありません。"]],"dark":[["建前をスキップする機能を追加しました。","矛盾に対するクリティカル判定を追加しました。","無言で退出 ..','...442244...','..44444444..','..44444444..','...11..11...'],demon:['.1........1.','.11......11.','..11111111..','..12222221..','..12322321..','..12222221..','...122221...','....1111....','.1144444411.','114444444411','1.44444444.1','..44444444..','...555555...','...55..55...','...11..11...'],slime:['............','............','............','.....44.....','....4444....','...444444...','..44444444..','.4444444444.','.4414441444.','444444444444','444411444444','444444444444','.4444444444.','..44444444..','............'],cat:['............','..1......1..','..11....11..','..11111111..','..13333331..','..13133131..','..13323331..','...111111...','....3333....','...333333.1.','...333333.1.','...33333311.','...333333...','...11..11...','............']};let palettes={mage:['','#17112c','#a27be8','#ffd5a1','#7854c6','#43517d'],priest:['','#29243b','#e6bc52','#ffd5a1','#f1eee1','#43517d'],demon:['','#1c1028','#d85c76','#ffe16b','#813c9c','#42304e'],slime:['','#173e36','#92f4b4','#d4ffda','#58cfa0','#43517d'],cat:['','#47352c','#e78f9d','#e9bd83','#719cf0','#43517d']};colors=palettes[kind]||colors;(variants[kind]||sprite).forEach((row,j)=>[...row].forEach((v,i)=>{if(v!=='.'){ctx.fillStyle=colors[+v];ctx.fillRect(x+i*12,y+j*12,12,12)}}))}function draw(){let palettes={dark:['#172653','#ffffff','#b9caff','#80efad','#ff9cae'],light:['#f3f5fa','#182238','#405ba4','#176d42','#a52d42'],green:['#101a13','#d1f8d8','#8ceaa2','#8ceaa2','#efcf88'],pink:['#352039','#fff1f8','#f4b9e6','#bce9d2','#ffb7b7']};let [bg,fg,accent,good,bad]=palettes[$('theme').value];ctx.font='38px sans-serif';let groups=[['＋ 追加された機能','add',good],['↻ 変更された仕様','change',accent],['！ 既知の不具合','bug',bad]].map(([label,id,color])=>({label,color,lines:lines($(id).value,900)}));c.height=Math.max(1080,420+groups.reduce((n,g)=>n+95+g.lines.length*53,0));ctx.fillStyle=bg;ctx.fillRect(0,0,1080,c.height);ctx.strokeStyle=accent;ctx.lineWidth=8;ctx.strokeRect(20,20,1040,c.height-40);ctx.lineWidth=3;ctx.strokeRect(34,34,1012,c.height-68);ctx.fillStyle=accent;for(let i=0;i<4;i++){ctx.fillRect(930+i*12,72-i*12,12,12);ctx.fillRect(930+i*12,72+i*12,12,12)}function text(t,x,y,size,color,bold=false){ctx.fillStyle=color;ctx.font=(bold?'bold ':'')+size+'px sans-serif';ctx.fillText(t,x,y)}text('HUMAN OS  /  '+$('version').value,72,100,32,accent,true);text('アップデートのお知らせ',72,190,52,fg,true);text($('name').value||'名無しの人間',72,255,35,accent);pixelHero(840,105);ctx.strokeStyle=accent;ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(72,295);ctx.lineTo(1008,295);ctx.stroke();ctx.globalAlpha=1;let y=370;for(let g of groups){text(g.label,72,y,32,g.color,true);y+=65;for(let l of g.lines){text(l,72,y,38,fg);y+=53}y+=45}text('HUMAN UPDATE  /  余白と遊び',72,c.height-55,25,accent);ctx.fillStyle=accent;for(let i=0;i<4;i++)ctx.fillRect(955+i*8,c.height-85+i*8,56-i*16,8);let low=document.createElement('canvas');low.width=540;low.height=Math.ceil(c.height/2);let lc=low.getContext('2d');lc.drawImage(c,0,0,low.width,low.height);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(low,0,0,c.width,c.height);try{localStorage.setItem('human-update-v1',JSON.stringify(Object.fromEntries(fields.map(k=>[k,$(k).value]))))}catch{}}function blob(){return new Promise(resolve=>c.toBlob(resolve,'image/png'))}function message(){return '人間アップデート通知\n'+$('version').value+'\n＋ '+$('add').value+'\n↻ '+$('change').value+'\n！ '+$('bug').value+'\n#人間アップデート通知\n'+location.origin+location.pathname}async function download(){let b=await blob();if(!b)return;$('status').textContent='画像を保存します。';let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='human-update.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}$('download').onclick=download;$('share').onclick=async()=>{try{let b=await blob(),f=new File([b],'human-update.png',{type:'image/png'});if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],text:message()});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(message());$('status').textContent='投稿文をコピーしました。画像保存後に添付してください。'}catch{$('status').textContent='共有できませんでした。画像保存をお試しください。'}};$('random').onclick=generate;fields.forEach(k=>$(k).addEventListener('input',k==='mood'?generate:draw));$('version').value=new Date().toLocaleDateString('ja-JP').replaceAll('/','.');let old;try{old=JSON.parse(localStorage.getItem('human-update-v1'))}catch{}if(old){fields.forEach(k=>{if(typeof old[k]==='string')$(k).value=old[k]});draw()}else generate();
