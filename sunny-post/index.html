<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひなたぼっこ郵便局</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5df;color:#594a3b;font:15px system-ui}main{max-width:480px;margin:auto;padding:16px}h1{font-size:24px;margin:8px 0}small{color:#87755e}canvas{width:100%;display:block;image-rendering:pixelated;border:4px solid #e1c9a4;border-radius:16px;background:#b9d69a}button{font:inherit;color:inherit;background:#fffaf0;border:1px solid #d7bb92;border-radius:12px;padding:12px;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}section{background:#fffaf0;border-radius:14px;padding:12px;margin-top:12px}h2{font-size:16px;margin:0 0 8px}p{margin:8px 0}#letters p{border-bottom:1px dashed #e4d4b8;padding-bottom:8px}#letters{max-height:220px;overflow:auto}a{color:#80684e}</style><main><small>ひだまり町　小さな郵便局</small><h1>ひなたぼっこ郵便局</h1><p id="status"></p><canvas id="garden" width="240" height="180" aria-label="動物たちが訪れる庭"></canvas><p id="notice">今日も、のんびり。</p><div class="row"><button id="food">おやつを置く</button><button id="toy">家具を替える</button></div><section><h2>✉ 届いた手紙</h2><div id="letters"></div></section><section><h2>訪れたお客さん <span id="count"></span></h2><div id="album"></div></section><p><small>閉じている間にも、お客さんは遊びに来ます。<br>試作 v0.01</small></p><a href="../author/">作品一覧</a></main><script>
const $=id=>document.getElementById(id),c=$('garden'),g=c.getContext('2d');const animals=[['きなこ','#dba15e','猫','クッションがふかふかだったよ。'],['ごま','#77747c','猫','お昼寝してたら夕方になってた。'],['ゆき','#f7eee0','猫','おやつ、ごちそうさま。'],['ぽん','#a77a56','たぬき','葉っぱを一枚置いていくね。'],['ぴょこ','#81b76c','かえる','雨が降ったらまた来るね。'],['もち','#f4c3ce','ふしぎ','……もち。']];let state={coins:5,food:3,toy:0,seen:[],letters:[],visitors:[],next:Date.now()+8000};try{let v=JSON.parse(localStorage.getItem('sunpost1'));if(v&&Array.isArray(v.letters)&&Array.isArray(v.visitors))state={...state,...v}}catch{}const save=()=>{try{localStorage.setItem('sunpost1',JSON.stringify(state))}catch{}};const toys=['赤いクッション','木の箱','花のじゅうたん'];function tick(now){let changed=false;for(let i=0;i<state.visitors.length;i++){let v=state.visitors[i];if(v.until<=now){let a=animals[v.k];state.letters.unshift({k:v.k,time:v.until});state.coins+=2;state.visitors.splice(i--,1);changed=true}}if(now>=state.next){if(state.food>0&&state.visitors.length<3){let choices=animals.map((_,i)=>i).filter(i=>!state.visitors.some(v=>v.k===i)),k=choices[Math.floor(Math.random()*choices.length)];state.food--;state.visitors.push({k,until:now+45000,x:45+Math.random()*150,y:110+Math.random()*35});if(!state.seen.includes(k))state.seen.push(k);$('notice').textContent=animals[k][0]+'が遊びに来た。'}state.next=now+20000;changed=true}if(changed){save();ui()}}function ui(){$('status').textContent='葉っぱ '+state.coins+' 枚　｜　おやつ '+state.food+' 個';$('food').textContent='おやつ＋3（葉っぱ1枚）';$('food').disabled=state.coins<1;$('toy').textContent=toys[state.toy]+' ↻';$('count').textContent=state.seen.length+'/'+animals.length;$('album').textContent=animals.map((a,i)=>state.seen.includes(i)?a[0]:'？？？').join('　');$('letters').replaceChildren(...state.letters.slice(0,30).map(v=>{let p=document.createElement('p');p.textContent=animals[v.k][0]+'：'+animals[v.k][3];return p}));if(!state.letters.length)$('letters').textContent='まだ手紙はありません。'}$('food').onclick=()=>{if(state.coins<1)return;state.coins--;state.food+=3;state.next=Math.min(state.next,Date.now()+3000);save();ui()};$('toy').onclick=()=>{state.toy=(state.toy+1)%3;save();ui()};function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}function draw(t){rect(0,0,240,180,'#b9d69a');for(let i=0;i<50;i++){let x=(i*47)%240,y=65+(i*29)%115;rect(x,y,3,2,'#9fc285')}rect(73,24,94,62,'#e9c59a');rect(66,20,108,9,'#a56d60');rect(76,12,88,9,'#b77c6b');rect(85,5,70,8,'#c98c76');rect(112,48,21,38,'#89694f');rect(86,43,18,17,'#fff2b5');rect(143,43,14,17,'#fff2b5');rect(118,67,3,3,'#e9c59a');rect(89,30,63,10,'#fff2d8');g.fillStyle='#765a47';g.font='7px sans-serif';g.fillText('POST OFFICE',94,37);rect(108,86,29,94,'#e6d4a9');for(let i=0;i<8;i++){let x=i<4?12+i*13:180+(i-4)*13;rect(x,80,2,10,'#628d5d');rect(x-2,77,6,5,i%2?'#f7e4a0':'#eaa5aa')}rect(19,96,30,17,['#d88d86','#b88e63','#e5cce5'][state.toy]);rect(184,99,22,12,'#e8d5ac');rect(188,100,14,5,state.food?'#9d704e':'#c7b58e');for(let v of state.visitors){let a=animals[v.k],x=v.x+Math.sin(t/1800+v.k)*4,y=v.y;rect(x-11,y+9,24,4,'#91b17c');rect(x-10,y-3,21,13,a[1]);rect(x-12,y-11,17,16,a[1]);if(v.k<4){rect(x-12,y-15,5,6,a[1]);rect(x,y-15,5,6,a[1]);rect(x+10,y+2,8,4,a[1]);rect(x+15,y-3,4,6,a[1])}else{rect(x-10,y-13,5,5,a[1]);rect(x,y-13,5,5,a[1])}let blink=Math.floor(t/350)%13===0;rect(x-8,y-5,2,blink?1:3,'#4c4239');rect(x,y-5,2,blink?1:3,'#4c4239');rect(x-5,y,3,2,'#b67f76');rect(x-8,y+8,5,3,a[1]);rect(x+4,y+8,5,3,a[1]);}requestAnimationFrame(draw)}tick(Date.now());ui();setInterval(()=>tick(Date.now()),1000);requestAnimationFrame(draw);
</script></html>
