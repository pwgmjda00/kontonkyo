name: Build Dopa Button

on:
  push:
    branches: [main, dopa-button-release]
    paths:
      - 'dopa-button/**'
      - '.github/workflows/dopa-pages.yml'
      - '.github/workflows/pages.yml'
      - 'src/**'
      - 'public/**'
      - 'data/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate the isolated game directory
        id: app
        shell: bash
        run: |
          if [ -f dopa-button/package.json ]; then
            echo 'path=dopa-button' >> "$GITHUB_OUTPUT"
          else
            echo 'path=.' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.path }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix '${{ steps.app.outputs.path }}'
      - name: Validate the supplied probability data
        run: python3 '${{ steps.app.outputs.path }}/tools/validate_data.py'
      - name: Build
        run: npm run build --prefix '${{ steps.app.outputs.path }}'
      # The repository already publishes main through GitHub Pages. The release
      # process commits the tested dist to dopa-button/play/, keeping the old
      # root site intact. Do not change the repository's existing Pages source.
