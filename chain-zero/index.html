<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>連鎖狂 ZERO</title><style>*{box-sizing:border-box}body{margin:0;background:#10101c;color:#fff;font:15px system-ui;text-align:center}main{max-width:520px;margin:auto;padding:12px}h1{font-size:15px;letter-spacing:4px;margin:5px}#stats{display:flex;justify-content:space-between;color:#bcbad6}#score{font:bold 40px monospace;color:#ffe39b}canvas{width:100%;height:min(58vh,480px);background:#18182b;border:1px solid #44435d;border-radius:18px;touch-action:none}button{background:#292841;color:white;border:1px solid #77739e;border-radius:12px;padding:12px;font:inherit;width:100%;margin:4px 0}#choices button{text-align:left}small{color:#bcbad6}#msg{min-height:48px;margin:8px}#laws{font-size:12px;color:#c9b6ff}button:active{background:#55478b}</style><main><h1>連鎖狂 ZERO</h1><div id="stats"><span id="stage"></span><span id="total"></span></div><div id="score">0</div><canvas id="c"></canvas><div id="msg"></div><div id="laws"></div><div id="choices"></div><small>一手で宇宙を壊せ。10ステージ。</small></main><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),colors=['#ff7896','#77dfff','#ffe17b','#b9a0ff'],symbols=['H','O','C','He'];let W,H,atoms=[],waves=[],queue=[],stage=1,total=0,score=0,chain=0,mult=1,state=0,next=0,last=0,counts=[0,0,0,0],owned=[],preview=null,ac;const laws=[['核分裂','赤の爆発範囲 +45%'],['酸素過剰','青を取るたび倍率 +0.3'],['炭素文明','黄の得点3倍'],['希ガス共鳴','紫が離れた原子を誘爆'],['連鎖中毒','5連鎖ごとに倍率×1.5'],['超新星','15連鎖で巨大爆発'],['初期衝撃','最初の爆発範囲 +45%'],['化学革命','H・O・Cの組で倍率×2']];const has=i=>owned.filter(x=>x===i).length;function resize(){let r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}function hud(){$('stage').textContent='STAGE '+stage+'/10';$('total').textContent='TOTAL '+Math.floor(total).toLocaleString();$('score').textContent=Math.floor(score).toLocaleString();$('laws').textContent=owned.map(i=>laws[i][0]).join(' / ')}function setup(){resize();atoms=[];waves=[];queue=[];score=chain=0;mult=1;counts=[0,0,0,0];state=0;preview=null;for(let i=0;i<30;i++){let p;for(let j=0;j<100;j++){p={x:20+Math.random()*(W-40),y:20+Math.random()*(H-40),k:Math.random()*4|0};if(atoms.every(a=>Math.hypot(a.x-p.x,a.y-p.y)>24))break}atoms.push(p)}$('choices').replaceChildren();$('msg').textContent='狙いを定めて、指を離すと爆発。';hud()}function blast(x,y,r,k){waves.push({x,y,r,k,t:0})}function sound(k){if(!ac)return;try{let o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime;o.frequency.value=220*2**([0,3,7,10,12,15,19][chain%7]/12);v.gain.setValueAtTime(.035,t);v.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(v);v.connect(ac.destination);o.start();o.stop(t+.2)}catch{}}function hit(p){chain++;counts[p.k]++;mult+=.1;if(p.k===1)mult+=.3*has(1);if(chain%5===0)mult*=1.5**has(4);if(has(7)&&p.k!==3&&Math.min(...counts.slice(0,3))>0&&counts[p.k]===Math.min(...counts.slice(0,3)))mult*=2**has(7);score+=100*mult*(p.k===2?3**has(2):1);blast(p.x,p.y,44*(p.k===0?1+.45*has(0):1),p.k);if(p.k===3&&has(3)&&atoms.length){let a=atoms[Math.random()*atoms.length|0];blast(a.x,a.y,30,3)}if(chain===15&&has(5))blast(W/2,H/2,Math.min(W,H)*.43,2);sound(p.k);$('msg').textContent=chain+' CHAIN  ×'+mult.toFixed(2);hud()}function finish(){state=2;total+=score;hud();$('msg').textContent=chain+'/30 CHAIN ｜ '+Math.floor(score).toLocaleString()+' POINTS';let choices=$('choices');if(stage===10){let b=document.createElement('button');b.textContent='もう一度挑戦';b.onclick=()=>{stage=1;total=0;owned=[];setup()};choices.append(b);return}let pool=laws.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,3);for(let i of pool){let b=document.createElement('button');b.textContent=laws[i][0]+' ｜ '+laws[i][1];b.onclick=()=>{owned.push(i);stage++;setup()};choices.append(b)}}function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{if(state!==0)return;c.setPointerCapture(e.pointerId);preview=pos(e);try{ac??=new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}};c.onpointermove=e=>{if(preview&&state===0)preview=pos(e)};c.onpointercancel=()=>preview=null;c.onpointerup=e=>{if(state!==0||!preview)return;let p=pos(e);preview=null;state=1;next=performance.now();blast(p.x,p.y,52*(1+.45*has(6)),3)};function frame(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;g.clearRect(0,0,W,H);for(let p of atoms){g.fillStyle=colors[p.k];g.beginPath();g.arc(p.x,p.y,11,0,7);g.fill();g.fillStyle='#151525';g.font='bold 10px monospace';g.textAlign='center';g.fillText(symbols[p.k],p.x,p.y+3)}if(preview){g.strokeStyle='#ffffff99';g.setLineDash([4,4]);g.beginPath();g.arc(preview.x,preview.y,52*(1+.45*has(6)),0,7);g.stroke();g.setLineDash([])}for(let a of waves){a.t+=dt;let r=a.r*Math.min(1,a.t/.55);g.globalAlpha=Math.max(0,1-a.t/1.05);g.strokeStyle=colors[a.k];g.lineWidth=3;g.beginPath();g.arc(a.x,a.y,r,0,7);g.stroke();g.globalAlpha=1;for(let i=atoms.length-1;i>=0;i--)if(a.t<.85&&Math.hypot(atoms[i].x-a.x,atoms[i].y-a.y)<=r)queue.push(atoms.splice(i,1)[0])}waves=waves.filter(a=>a.t<1.05);for(let p of queue){g.strokeStyle=colors[p.k];g.beginPath();g.arc(p.x,p.y,11+3*Math.sin(t/80),0,7);g.stroke()}if(queue.length&&t>=next){hit(queue.shift());next=t+Math.max(95,260-chain*5)}if(state===1&&!queue.length&&!waves.length)finish();requestAnimationFrame(frame)}setup();requestAnimationFrame(frame);
</script></html>
