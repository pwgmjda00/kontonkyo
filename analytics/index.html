<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品運営ダッシュボード</title><style>*{box-sizing:border-box}body{font:15px/1.6 system-ui;background:#f4f4f4;color:#171717;max-width:1000px;margin:auto;padding:18px}input,select,button{font:inherit;padding:10px;max-width:100%}input{width:100%;margin:4px 0}button{background:#222;color:white;border:0}section{background:white;padding:16px;margin:12px 0;border:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#fff;padding:14px;border:1px solid #ddd}.metric strong{display:block;font-size:26px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}progress{width:100%;accent-color:#222}.scroll{overflow:auto}small{color:#555}</style><h1>作品運営ダッシュボード</h1><form id="auth"><label>解析Worker URL<input id="endpoint" type="url" required placeholder="https://…workers.dev"></label><label>管理者トークン<input id="token" type="password" required autocomplete="off"></label><label>期間 <select id="days"><option>7</option><option>30</option></select> 日</label> <button>取得</button></form><p id="status" role="status">未接続</p><main id="report" hidden><label>作品 <select id="project"></select></label> <button id="csv">CSV出力</button><div class="grid" id="metrics"></div><section><h2>日別訪問イベント</h2><div id="trend"></div></section><section><h2>作品別集計</h2><div class="scroll"><table id="projects"></table></div></section><section><h2>流入元</h2><div id="sources"></div></section><section><h2>イベント・モード別</h2><div class="scroll"><table id="events"></table></div></section><small>UTC基準。訪問イベントは実人数ではありません。完了率は期間内イベント数の比で、個別セッションの追跡ではありません。共有操作は投稿成功を意味しません。</small></main><script>
(()=>{const $=id=>document.getElementById(id);let rows=[],days=7;const sum=(a,n)=>a.filter(x=>x.name===n).reduce((s,x)=>s+x.n,0),vis=a=>sum(a,'visit')+sum(a,'page_view'),ratio=(n,d)=>d?(100*n/d).toFixed(1)+'%':'未算出';function table(id,head,data){const t=$(id);t.replaceChildren();for(const [i,row] of [head,...data].entries()){const tr=document.createElement('tr');for(const v of row){const c=document.createElement(i?'td':'th');c.textContent=v;tr.append(c)}t.append(tr)}}function bars(id,items){const e=$(id);e.replaceChildren();const max=Math.max(1,...items.map(x=>x[1]));for(const [name,n] of items){const p=document.createElement('div');p.textContent=name+'：'+n;const b=document.createElement('progress');b.max=max;b.value=n;e.append(p,b)}}function render(){const a=rows.filter(x=>!$('project').value||x.project===$('project').value);const starts=sum(a,'duel_start')+sum(a,'cup_start')+sum(a,'game_start'),ends=sum(a,'duel_complete')+sum(a,'cup_complete')+sum(a,'game_complete');$('metrics').replaceChildren();for(const [k,v] of [['訪問イベント',vis(a)],['開始',starts],['完了',ends],['完了／開始',ratio(ends,starts)],['共有操作',sum(a,'share_attempt')],['招待経由完了',sum(a,'invite_complete')],['エラー',sum(a,'error')]]){const d=document.createElement('div');d.className='metric';d.textContent=k;const s=document.createElement('strong');s.textContent=v;d.append(s);$('metrics').append(d)}const dates=Array.from({length:days},(_,i)=>new Date(Date.now()-(days-1-i)*86400000).toISOString().slice(0,10));bars('trend',dates.map(d=>[d,vis(a.filter(x=>x.day===d))]));bars('sources',['x','invite','other','direct'].map(s=>[s,vis(a.filter(x=>x.source===s))]));table('projects',['作品','訪問','共有'],[...new Set(rows.map(x=>x.project))].map(p=>{const b=rows.filter(x=>x.project===p);return[p,vis(b),sum(b,'share_attempt')]}));const m=new Map();for(const x of a){const k=x.name+' / '+x.mode;m.set(k,(m.get(k)||0)+x.n)}table('events',['イベント / モード','回数'],[...m].sort((a,b)=>b[1]-a[1]))}
$('auth').onsubmit=async e=>{e.preventDefault();$('report').hidden=true;$('status').textContent='取得中…';try{const u=new URL($('endpoint').value);if(u.protocol!=='https:'||!u.hostname.endsWith('.workers.dev')||u.username||u.password)throw Error();days=Number($('days').value);const token=$('token').value;$('token').value='';const r=await fetch(u.origin+'/admin/analytics?days='+days,{headers:{Authorization:'Bearer '+token},redirect:'error',cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(!Array.isArray(d.rows))throw Error();rows=d.rows.filter(x=>typeof x.project==='string'&&typeof x.day==='string'&&typeof x.name==='string'&&typeof x.mode==='string'&&typeof x.source==='string'&&Number.isFinite(x.n)&&x.n>=0);$('project').replaceChildren(new Option('全作品',''));for(const p of new Set(rows.map(x=>x.project)))$('project').append(new Option(p,p));render();$('report').hidden=false;$('status').textContent=rows.length?'取得完了':'記録なし'}catch{$('status').textContent='取得失敗。URL・認証・Workerの状態を確認してください。'}};$('project').onchange=render;$('csv').onclick=()=>{const esc=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const keys=['day','project','name','mode','source','n'];const a=rows.filter(x=>!$('project').value||x.project===$('project').value);const blob=new Blob(['\ufeff'+keys.join(',')+'\n'+a.map(x=>keys.map(k=>esc(x[k])).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='analytics.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}})();
</script></html>
