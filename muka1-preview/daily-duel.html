<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="canonical" href="https://pwgmjda00.github.io/kontonkyo/muka1-preview/daily-duel.html"><meta property="og:title" content="全国二択 | MUKA-1"><meta property="og:type" content="website"><meta property="og:url" content="https://pwgmjda00.github.io/kontonkyo/muka1-preview/daily-duel.html"><meta property="og:description" content="架空の構文だけで開催するグランプリ。"><meta name="twitter:card" content="summary_large_image"><meta property="og:image" content="https://pwgmjda00.github.io/kontonkyo/muka1-preview/ogp.png"><meta property="og:image:type" content="image/png"><meta property="og:image:alt" content="MUKA-1 ムカつく構文グランプリ"><meta name="twitter:image" content="https://pwgmjda00.github.io/kontonkyo/muka1-preview/ogp.png"><meta name="twitter:image:alt" content="MUKA-1 ムカつく構文グランプリ"><title>全国二択 | MUKA-1</title><style>body{background:#fff200;color:#111;font:17px/1.5 system-ui;max-width:520px;margin:auto;padding:20px}button{display:block;width:100%;font:inherit;font-weight:bold;background:white;border:3px solid #111;padding:18px;margin:12px 0;text-align:left}button:disabled{opacity:.65}a{color:inherit}progress{width:100%;accent-color:#111}small{display:block}</style><h1>全国二択</h1><p id="status" role="status">今日の対決を取得中…</p><main id="game"></main><p><a href="./">通常の決闘へ</a></p><small>架空構文のみ。端末識別子による重複抑制であり、厳密な一人一票ではありません。</small><script src="config.js"></script><script src="phrases.js"></script><script>async function boundedFetch(url,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);try{return await fetch(url,{...options,signal:controller.signal})}finally{clearTimeout(timer)}}function retryNotice(el,message){el.textContent=message;const b=document.createElement('button');b.type='button';b.textContent='再読み込み';b.onclick=()=>location.reload();el.append(document.createElement('br'),b)}</script><script>
(async()=>{const g=document.querySelector('#game'),s=document.querySelector('#status'),api=window.MUKA_API;function btn(t,fn){const b=document.createElement('button');b.textContent=t;b.onclick=fn;g.append(b);return b}try{const res=await boundedFetch(api+'/daily-duel');if(!res.ok)throw Error();const d=await res.json();if(!Array.isArray(d.pair)||d.pair.length!==2||!d.pair.every(id=>typeof MUKA_PHRASES[id]==='string'))throw Error();s.textContent=d.day+' ／ どっちが腹立つ？';d.pair.forEach((id,i)=>btn((i?'B：':'A：')+MUKA_PHRASES[id],async()=>{if(g.querySelector('button:disabled'))return;g.querySelectorAll('button').forEach(b=>b.disabled=true);try{let client=localStorage.getItem('muka1-voter');if(!client){client=crypto.randomUUID();localStorage.setItem('muka1-voter',client)}const r=await boundedFetch(api+'/daily-duel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({day:d.day,phrase:id,client})});if(!r.ok)throw Error();const v=await r.json();const total=v.counts.reduce((a,b)=>a+b,0);g.replaceChildren();s.textContent=(v.accepted?'投票完了':'投票済み')+' ／ '+total+'票';v.pair.forEach((p,j)=>{const label=document.createElement('p');label.textContent=MUKA_PHRASES[p]+' ／ '+(total?Math.round(v.counts[j]/total*100):0)+'%（'+v.counts[j]+'票）';const bar=document.createElement('progress');bar.max=Math.max(total,1);bar.value=v.counts[j];g.append(label,bar)});const pct=total?v.counts[v.pair.indexOf(v.choice)]/total*100:0;const title=total<30?'集計中':pct<=10?'絶滅危惧感性':pct<=25?'地下勢力':pct<45?'少数派閥':pct<=55?'国論分裂':pct<75?'多数派閥':pct<90?'世間の代弁者':'圧倒的民意';const h=document.createElement('h2');h.textContent=title;g.append(h);btn('Xで審判を募集',()=>location.href='https://twitter.com/intent/tweet?text='+encodeURIComponent('今日の全国二択、どっちが腹立つ？ #MUKA1')+'&url='+encodeURIComponent(location.origin+location.pathname));}catch{s.textContent='投票できません。日付が変わった場合は再読み込みしてください。';g.querySelectorAll('button').forEach(b=>b.disabled=false)}}))}catch{retryNotice(s,'全国二択は準備中、または通信できません。')}})();
</script></html>
