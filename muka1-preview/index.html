<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:title" content="MUKA-1｜どっちが腹立つ？"><meta property="og:description" content="架空の構文だけで開催する炎のグランプリ。俺だけがおかしいのか確認したい。 #MUKA1"><title>MUKA-1</title><style>*{box-sizing:border-box}body{background:#fff200;color:#111;font:16px/1.65 system-ui,sans-serif;margin:auto;max-width:520px;padding:20px 16px}h1{font-size:clamp(29px,8vw,44px);line-height:1.12;letter-spacing:-.05em;margin:8px 0;font-weight:950;text-align:center}h2{font-size:23px;line-height:1.5;margin:18px 0;background:#111;color:white;padding:10px;text-align:center}button{display:block;width:100%;min-height:88px;padding:18px;margin:0 0 8px;background:white;color:#111;border:2px solid #111;border-radius:0;box-shadow:3px 3px 0 #111;font:inherit;font-weight:750;text-align:left;cursor:pointer;touch-action:manipulation}button:active{background:#ffd5c4;transform:translate(2px,2px);box-shadow:1px 1px 0 #111}small{font-size:12px}#round{font-size:13px;font-weight:800;margin:20px 0 6px}#bar{height:5px;background:#111;transition:width .2s}main{min-height:250px}a{color:#111}button:focus-visible{outline:3px solid #d52200;outline-offset:3px}.kicker{text-align:center;font-size:12px;font-weight:800}.vs{text-align:center;font-weight:950;font-style:italic;margin:8px}footer{text-align:center;font-size:12px;border-top:2px solid #111;padding-top:12px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><div class="kicker">誰にも頼まれてない国民投票</div><h1>ムカつくツイート<br>グランプリ</h1><div class="kicker">MUKA-1 ／ 暇人による無益な調査</div><p id="round"></p><div id="bar"></div><main id="game"></main><p><a href="?duel=1">一問だけの決闘</a> ／ <a href="?daily=1">今日の全国共通お題</a> ／ <a href="./">ランダム大会</a></p><p><small>すべて創作です。実在の投稿者を評価するものではありません。</small></p><script>
const pool=['努力できない人って結局甘えてるだけ。','反論してくる時点で効いてるんだろうね。','怒らないで聞いてほしいんだけど、君にも原因あるよね？','本当に賢い人は自分を賢いとは思わない。','嫌なら見なきゃいいだけじゃない？','幸せな人はSNSで愚痴らないよ。','別に否定してないよ。考え方が幼いって言ってるだけ。','私、裏表ないから思ったこと全部言っちゃうんだよね。','普通に考えたら分かると思うけど。','成功した人の言葉には重みがあるんだよ。','そういうところだよ、君の悪いところ。','人それぞれだけど、私は絶対無理。','正論って嫌われるんだよね。','心に余裕がある人は怒らないよ。','知らないなら黙ってればいいのに。','自分磨きしてから恋愛したら？','言い訳を考える暇があるなら行動すれば？','私は誰にでも平等だから、嫌いな人にも優しいよ。','まあ、分かる人にだけ分かればいい。','君のためを思って言ってるんだけど。','その程度で傷つくならネット向いてないよ。','私ならもっと上手くやるけどね。','別にマウント取ってないよ。事実だから。','価値観の違いって便利な言葉だよね。','謝ってほしいなら、まず謝りたくなる態度を取ってほしい。','私は結果じゃなくて過程を見てるよ。結果が出てないだけで。','大人になれば私の言ってる意味が分かるよ。','聞かれたから答えただけなのに、なんで怒るの？','私の周りにはそんな人いないけどな。','期待してないから怒ってないよ。','本当に忙しい人は忙しいって言わない。','自分の機嫌くらい自分で取ろうよ。','そんなつもりで言ったんじゃないのに。','君は優しいから、損するタイプだよね。','別に勝ち負けじゃないよ。私は間違ってないけど。','それ、わざわざ言う必要あった？','私は気にしないけど、普通の人は気にすると思う。','何も言わないのも優しさなんだよ。','昔の私を見てるみたいで心配。','理解できないことを否定するのはよくないよ。'];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a} function daily(){const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());let seed=Array.from(date).reduce((s,ch)=>Math.imul(s,31)+ch.charCodeAt(0)|0,17);let a=Array.from({length:pool.length},(_,i)=>i);for(let i=a.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;let j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,8)} const q=new URLSearchParams(location.search),raw=q.get('cup'),parsed=raw?raw.split(',').map(Number):[];let ids=parsed.length===8&&new Set(parsed).size===8&&parsed.every(n=>Number.isInteger(n)&&n>=0&&n<pool.length)?parsed:(q.has('daily')?daily():shuffle(Array.from({length:pool.length},(_,i)=>i)).slice(0,8));let queue=ids.slice(),next=[],votes=[],stage=0,choices=[];const game=document.querySelector('#game'),round=document.querySelector('#round');function button(s,f){let b=document.createElement('button');b.textContent=s;b.onclick=f;game.append(b)}function duel(){game.replaceChildren();let raw=q.get('pair')||'',pair=raw.split(',').map(Number);if(!/^\d+,\d+$/.test(raw)||pair[0]===pair[1]||!pair.every(n=>Number.isInteger(n)&&n>=0&&n<pool.length))pair=shuffle(Array.from({length:pool.length},(_,i)=>i)).slice(0,2);round.textContent='一問だけの決闘';document.querySelector('#bar').style.width='0%';let h=document.createElement('h2');h.textContent='どっちが腹立つ？';game.append(h);pair.forEach((id,i)=>button((i?'B：':'A：')+pool[id],()=>{game.replaceChildren();document.querySelector('#bar').style.width='100%';let prior=q.get('pick'),valid=prior!==null&&/^\d+$/.test(prior)&&pair.includes(Number(prior));let title=document.createElement('h2');title.textContent=valid?(Number(prior)===id?'意見が一致しました。':'意見が割れました。'):'審判を募集します。';game.append(title);let p=document.createElement('p');p.textContent='あなたの選択：'+pool[id];game.append(p);let u=new URL(location.href);u.search='';u.searchParams.set('duel','1');u.searchParams.set('pair',pair.join(','));u.searchParams.set('pick',id);let msg='どっちが腹立つ？\nA：'+pool[pair[0]]+'\nB：'+pool[pair[1]]+'\n'+(valid&&Number(prior)!==id?'第三者の意見を求む。':'俺だけがおかしいのか？')+' #MUKA1';button('他人を巻き込む',async()=>{if(navigator.share){try{await navigator.share({text:msg,url:u.href});return}catch(e){if(e.name==='AbortError')return}}location.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg)+'&url='+encodeURIComponent(u.href)});button('Xで審判を募集',()=>location.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg)+'&url='+encodeURIComponent(u.href));button('別の二択',()=>location.href=location.pathname+'?duel=1');button('7試合の大会へ',()=>location.href=location.pathname)}))}function render(){game.replaceChildren();document.querySelector('#bar').style.width=votes.length/7*100+'%';if(queue.length===1&&next.length===0){let winner=queue[0];round.textContent='最悪が決まりました';let label=document.createElement('small');label.textContent='あなたが選んだ本日の最悪';game.append(label);let h=document.createElement('h2');h.textContent=pool[winner];game.append(h);let other=q.get('p');if(other){let prior=other.split(',').map(Number);if(prior.length===7&&prior.every(n=>ids.includes(n))){let p=document.createElement('p');let same=choices.slice(0,4).filter((v,i)=>v===prior[i]).length;p.textContent='初戦の感性一致：'+same+'/4 ｜ 優勝構文：'+(winner===prior[6]?'一致':'不一致');game.append(p)}}let u=new URL(location.href);u.search='';u.searchParams.set('cup',ids.join(','));u.searchParams.set('p',choices.join(','));let msg='俺が選んだ最悪の一文：'+pool[winner]+' 俺だけがおかしいのか確認したい。 #MUKA1';if(other){let prior=other.split(',').map(Number);if(prior.length===7&&prior.every(n=>ids.includes(n))){let same=choices.slice(0,4).filter((v,i)=>v===prior[i]).length;msg='初戦の感性一致率 '+(same*25)+'%。'+(same<=2?'第三者の意見を求む。':'お前も審判やってくれ。')+' #MUKA1'}}button('他人を巻き込む',async()=>{if(navigator.share){try{await navigator.share({title:'MUKA-1',text:msg,url:u.href});return}catch(e){if(e.name==='AbortError')return}}location.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg)+'&url='+encodeURIComponent(u.href)});button('Xで審判を募集',()=>location.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg)+'&url='+encodeURIComponent(u.href));button('地獄の号外を画像にする',()=>{const cv=document.createElement('canvas');cv.width=1200;cv.height=630;const ctx=cv.getContext('2d');ctx.fillStyle='#fff200';ctx.fillRect(0,0,1200,630);ctx.fillStyle='#111';ctx.fillRect(35,35,1130,105);ctx.fillStyle='#fff';ctx.font='bold 62px sans-serif';ctx.fillText('地獄の号外',65,110);ctx.fillStyle='#111';ctx.font='bold 32px sans-serif';ctx.fillText('MUKA-1 ／ 個人大会 優勝',65,200);ctx.font='bold 52px sans-serif';let line='',y=285;for(const ch of pool[winner]){if(ctx.measureText(line+ch).width>1060){ctx.fillText(line,65,y);y+=72;line=''}line+=ch}ctx.fillText(line,65,y);ctx.font='bold 30px sans-serif';ctx.fillText('俺だけがおかしいのか？',65,535);ctx.font='24px sans-serif';ctx.fillText('架空の構文 ／ pwgmjda00.github.io/kontonkyo/muka1-preview/',65,585);cv.toBlob(async blob=>{if(!blob)return;const file=new File([blob],'muka1.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:msg+' '+u.href});return}}catch(e){if(e.name==='AbortError')return}const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='muka1.png';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)},'image/png')});button('大会URLをコピー',async()=>{try{await navigator.clipboard.writeText(u.href);alert('コピーしました')}catch{prompt('URLをコピー',u.href)}});button('まだ腹が立つ',()=>location.href=location.pathname);button('今日の全国共通お題',()=>location.href=location.pathname+'?daily=1');return}round.textContent=['準々決勝','準決勝','決勝'][stage]+' ／ '+(votes.length+1)+'/7';let h=document.createElement('h2');h.textContent='どっちがムカつく？';game.append(h);queue.slice(0,2).forEach((id,i)=>{if(i){let vs=document.createElement('div');vs.className='vs';vs.textContent='VS';game.append(vs)}button((i?'B選手：':'A選手：')+pool[id],()=>{votes.push(i);choices.push(id);next.push(id);queue.splice(0,2);if(!queue.length){queue=next;next=[];stage++}render()})})}if(q.has('duel'))duel();else render();
</script></html>
