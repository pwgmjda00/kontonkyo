<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:title" content="MUKA-1｜どっちがムカつく？"><meta property="og:description" content="架空の構文だけで開催する炎のグランプリ。異議あり？同じ大会に挑戦。"><title>MUKA-1</title><style>*{box-sizing:border-box}body{background:#171010;color:#fff;font:17px system-ui;margin:auto;max-width:540px;padding:20px}h1{color:#ff6036;font-size:48px;margin:0}button{display:block;width:100%;padding:22px;margin:12px 0;background:#30201c;color:white;border:1px solid #a54b30;border-radius:12px;font:inherit;text-align:left;cursor:pointer}button:active{background:#9e321b}small{color:#c9aaa0}#bar{height:5px;background:#ff6036;transition:width .2s}a{color:#ff9a60}</style><h1>MUKA-1 🔥</h1><small>架空の構文グランプリ</small><p id="round"></p><div id="bar"></div><main id="game"></main><p><small>すべて創作です。実在の投稿者を評価するものではありません。</small></p><script>
const pool=['努力できない人って結局甘えてるだけ。','反論してくる時点で効いてるんだろうね。','怒らないで聞いてほしいんだけど、君にも原因あるよね？','本当に賢い人は自分を賢いとは思わない。','嫌なら見なきゃいいだけじゃない？','幸せな人はSNSで愚痴らないよ。','別に否定してないよ。考え方が幼いって言ってるだけ。','私、裏表ないから思ったこと全部言っちゃうんだよね。','普通に考えたら分かると思うけど。','成功した人の言葉には重みがあるんだよ。','そういうところだよ、君の悪いところ。','人それぞれだけど、私は絶対無理。','正論って嫌われるんだよね。','心に余裕がある人は怒らないよ。','知らないなら黙ってればいいのに。','自分磨きしてから恋愛したら？','言い訳を考える暇があるなら行動すれば？','私は誰にでも平等だから、嫌いな人にも優しいよ。','まあ、分かる人にだけ分かればいい。','君のためを思って言ってるんだけど。','その程度で傷つくならネット向いてないよ。','私ならもっと上手くやるけどね。','別にマウント取ってないよ。事実だから。','価値観の違いって便利な言葉だよね。'];
const q=new URLSearchParams(location.search),raw=q.get('cup'),parsed=raw?raw.split(',').map(Number):[];let ids=parsed.length===8&&new Set(parsed).size===8&&parsed.every(n=>Number.isInteger(n)&&n>=0&&n<pool.length)?parsed:Array.from({length:pool.length},(_,i)=>i).sort(()=>Math.random()-.5).slice(0,8);let queue=ids.slice(),next=[],votes=[],stage=0;const game=document.querySelector('#game'),round=document.querySelector('#round');function button(s,f){let b=document.createElement('button');b.textContent=s;b.onclick=f;game.append(b)}function render(){game.replaceChildren();document.querySelector('#bar').style.width=votes.length/7*100+'%';if(queue.length===1&&next.length===0){let winner=queue[0];round.textContent='優勝決定';let h=document.createElement('h2');h.textContent=pool[winner];game.append(h);let other=q.get('v');if(other&&/^[01]{7}$/.test(other)){let p=document.createElement('p');p.textContent='同じ選択位置：'+votes.filter((v,i)=>String(v)===other[i]).length+'/7（対戦候補が異なる場合あり）';game.append(p)}let u=new URL(location.href);u.search='';u.searchParams.set('cup',ids.join(','));u.searchParams.set('v',votes.join(''));let msg='私のMUKA-1優勝：'+pool[winner]+' 異議あり？同じ大会に挑戦。';button('Xで異議を募集',()=>location.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg)+'&url='+encodeURIComponent(u.href));button('大会URLをコピー',async()=>{try{await navigator.clipboard.writeText(u.href);alert('コピーしました')}catch{prompt('URLをコピー',u.href)}});button('新しい大会',()=>location.href=location.pathname);return}round.textContent=['準々決勝','準決勝','決勝'][stage]+' ／ '+(votes.length+1)+'/7';let h=document.createElement('h2');h.textContent='どっちがムカつく？';game.append(h);queue.slice(0,2).forEach((id,i)=>button(pool[id],()=>{votes.push(i);next.push(id);queue.splice(0,2);if(!queue.length){queue=next;next=[];stage++}render()}))}render();
</script></html>
