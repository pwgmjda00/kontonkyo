<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:title" content="MUKA-1｜どっちがムカつく？"><meta property="og:description" content="架空の構文だけで開催する炎のグランプリ。異議あり？同じ大会に挑戦。"><title>MUKA-1</title><style>*{box-sizing:border-box}body{background:#faf9f6;color:#20201e;font:16px/1.7 system-ui,sans-serif;margin:auto;max-width:520px;padding:28px 20px}h1{font-size:25px;letter-spacing:-.06em;margin:0;font-weight:850}h2{font-size:21px;line-height:1.65;margin:30px 0 18px}button{display:block;width:100%;min-height:90px;padding:22px 18px;margin:0 0 12px;background:#fff;color:#20201e;border:1px solid #d6d3cc;border-radius:3px;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation}button:hover{border-color:#20201e}button:active{background:#f4e8e2;border-color:#bd432c}small{color:#77736c;font-size:12px}#round{font-size:12px;letter-spacing:.08em;margin:32px 0 8px;color:#77736c}#bar{height:2px;background:#bd432c;transition:width .2s}main{min-height:290px}a{color:#bd432c}button:focus-visible{outline:2px solid #bd432c;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><h1>MUKA-1<span style="color:#bd432c">.</span></h1><small>ムカつく構文選手権</small><p id="round"></p><div id="bar"></div><main id="game"></main><p><small>すべて創作です。実在の投稿者を評価するものではありません。</small></p><script>
const pool=['努力できない人って結局甘えてるだけ。','反論してくる時点で効いてるんだろうね。','怒らないで聞いてほしいんだけど、君にも原因あるよね？','本当に賢い人は自分を賢いとは思わない。','嫌なら見なきゃいいだけじゃない？','幸せな人はSNSで愚痴らないよ。','別に否定してないよ。考え方が幼いって言ってるだけ。','私、裏表ないから思ったこと全部言っちゃうんだよね。','普通に考えたら分かると思うけど。','成功した人の言葉には重みがあるんだよ。','そういうところだよ、君の悪いところ。','人それぞれだけど、私は絶対無理。','正論って嫌われるんだよね。','心に余裕がある人は怒らないよ。','知らないなら黙ってればいいのに。','自分磨きしてから恋愛したら？','言い訳を考える暇があるなら行動すれば？','私は誰にでも平等だから、嫌いな人にも優しいよ。','まあ、分かる人にだけ分かればいい。','君のためを思って言ってるんだけど。','その程度で傷つくならネット向いてないよ。','私ならもっと上手くやるけどね。','別にマウント取ってないよ。事実だから。','価値観の違いって便利な言葉だよね。','謝ってほしいなら、まず謝りたくなる態度を取ってほしい。','私は結果じゃなくて過程を見てるよ。結果が出てないだけで。','大人になれば私の言ってる意味が分かるよ。','聞かれたから答えただけなのに、なんで怒るの？','私の周りにはそんな人いないけどな。','期待してないから怒ってないよ。','本当に忙しい人は忙しいって言わない。','自分の機嫌くらい自分で取ろうよ。','そんなつもりで言ったんじゃないのに。','君は優しいから、損するタイプだよね。','別に勝ち負けじゃないよ。私は間違ってないけど。','それ、わざわざ言う必要あった？','私は気にしないけど、普通の人は気にすると思う。','何も言わないのも優しさなんだよ。','昔の私を見てるみたいで心配。','理解できないことを否定するのはよくないよ。'];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a} const q=new URLSearchParams(location.search),raw=q.get('cup'),parsed=raw?raw.split(',').map(Number):[];let ids=parsed.length===8&&new Set(parsed).size===8&&parsed.every(n=>Number.isInteger(n)&&n>=0&&n<pool.length)?parsed:shuffle(Array.from({length:pool.length},(_,i)=>i)).slice(0,8);let queue=ids.slice(),next=[],votes=[],stage=0,choices=[];const game=document.querySelector('#game'),round=document.querySelector('#round');function button(s,f){let b=document.createElement('button');b.textContent=s;b.onclick=f;game.append(b)}function render(){game.replaceChildren();document.querySelector('#bar').style.width=votes.length/7*100+'%';if(queue.length===1&&next.length===0){let winner=queue[0];round.textContent='優勝決定';let label=document.createElement('small');label.textContent='あなたが選んだ、最もムカつく一文';game.append(label);let h=document.createElement('h2');h.textContent=pool[winner];game.append(h);let other=q.get('p');if(other){let prior=other.split(',').map(Number);if(prior.length===7&&prior.every(n=>ids.includes(n))){let p=document.createElement('p');let same=choices.slice(0,4).filter((v,i)=>v===prior[i]).length;p.textContent='初戦の感性一致：'+same+'/4 ｜ 優勝構文：'+(winner===prior[6]?'一致':'不一致');game.append(p)}}let u=new URL(location.href);u.search='';u.searchParams.set('cup',ids.join(','));u.searchParams.set('p',choices.join(','));let msg='私のMUKA-1優勝：'+pool[winner]+' 異議あり？同じ大会に挑戦。';button('異議あり？ Xで聞く',()=>location.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg)+'&url='+encodeURIComponent(u.href));button('大会URLをコピー',async()=>{try{await navigator.clipboard.writeText(u.href);alert('コピーしました')}catch{prompt('URLをコピー',u.href)}});button('新しい大会',()=>location.href=location.pathname);return}round.textContent=['準々決勝','準決勝','決勝'][stage]+' ／ '+(votes.length+1)+'/7';let h=document.createElement('h2');h.textContent='どっちがムカつく？';game.append(h);queue.slice(0,2).forEach((id,i)=>button(pool[id],()=>{votes.push(i);choices.push(id);next.push(id);queue.splice(0,2);if(!queue.length){queue=next;next=[];stage++}render()}))}render();
</script></html>
