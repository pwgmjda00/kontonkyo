<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUKA-1 全国ランキング</title><style>body{background:#fff200;color:#111;font:16px/1.6 system-ui;max-width:520px;margin:24px auto;padding:16px}li{background:white;border:2px solid;padding:12px;margin:8px 0}a{color:#111}h1{line-height:1.2}ol{padding:0;list-style:none}li{overflow-wrap:anywhere}.rank{display:block;font-weight:950;font-size:13px;letter-spacing:.08em;margin-bottom:8px}.framed{border:9px ridge var(--metal);box-shadow:0 0 0 2px #111,4px 5px 0 #111;background:#fffdf4;padding:18px;margin:20px 3px}.framed .rank{border-bottom:1px solid #aaa;padding-bottom:8px}.gold{--metal:#d6a52c}.silver{--metal:#b8bec5}.bronze{--metal:#b77948}.gold{font-size:20px;font-weight:800}.votes{display:block;text-align:right;font-size:13px;margin-top:10px}</style><a href="./">大会に戻る</a><h1>本日の最悪。<br>全国ランキング</h1><p><a href="?period=day">日間 TOP8</a> ／ <a href="?period=week">週間 TOP20</a></p><p id="status" role="status">集計中…</p><ol id="list"></ol><p><a href="history.html">全国号外・不名誉の殿堂</a></p><a href="./?daily=1">今日の大会に参加する</a><p><small>日本時間で毎日更新。端末ごとに1日1票を目安とした集計です。</small></p><script src="config.js"></script><script src="phrases.js"></script><script>const pool=Object.assign(Object.create(null),window.MUKA_PHRASES);const s=document.querySelector('#status');const weekly=new URLSearchParams(location.search).get('period')==='week';(async()=>{try{if(!window.MUKA_API)throw Error();const r=await fetch(window.MUKA_API+'/ranking'+(weekly?'?period=week':''));if(!r.ok)throw Error();const d=await r.json();if(weekly&&d.period!=='week')throw Error();s.textContent=(weekly?d.from+'〜':'')+d.day+' ／ '+(d.ranking.some(x=>x.votes>0)?(weekly?'週間 TOP20':'日替わり大会 TOP8'):'まだ投票がありません');let i=0,rank=0,last=null;for(const x of d.ranking.slice(0,weekly?20:8)){if(!Number.isInteger(x.phrase)||typeof pool[x.phrase]!=='string')continue;const li=document.createElement('li');i++;if(x.votes!==last){rank=i;last=x.votes}const label=document.createElement('span');label.className='rank';label.textContent=x.votes>0?(['','🥇 第1位','🥈 第2位','🥉 第3位'][rank]||'第'+rank+'位'):'未得票';if(x.votes>0&&rank<=3)li.className='framed '+['','gold','silver','bronze'][rank];const phrase=document.createElement('div');phrase.textContent=pool[x.phrase];const votes=document.createElement('span');votes.className='votes';votes.textContent=x.votes+'票';li.append(label,phrase,votes);document.querySelector('#list').append(li)}}catch{s.textContent='集計を取得できません。時間をおいて再読み込みしてください。'}})();</script></html>
