<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUKA-1 審査室</title><style>body{background:#fff200;color:#111;font:16px system-ui;max-width:600px;margin:20px auto;padding:16px}input,textarea,button{box-sizing:border-box;font:inherit;padding:12px;border:2px solid #111;width:100%;margin:5px 0}button{background:#111;color:white;font-weight:bold}article{background:white;border:2px solid;padding:12px;margin:12px 0}textarea{min-height:100px}</style><h1>薪の審査室</h1><label>API URL<input id="api" type="url" placeholder="https://...workers.dev"></label><label>管理者キー<input id="token" type="password" autocomplete="off"></label><button id="load">承認待ちを取得</button><p id="msg" role="status"></p><main id="list"></main><script>const $=id=>document.getElementById(id);async function call(method,body){const u=new URL($('api').value);if(u.protocol!=='https:'||!u.hostname.endsWith('.workers.dev'))throw Error('Workers URLを入力してください');const r=await fetch(u.origin+'/admin/submissions',{method,headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('通信エラー '+r.status);return r.json()}async function load(){try{const d=await call('GET');$('list').replaceChildren();$('msg').textContent=d.items.length+'件（最大100件表示）';for(const x of d.items){const a=document.createElement('article'),t=document.createElement('textarea');t.value=x.text;t.maxLength=140;a.append(t);for(const [label,status] of [['修正して承認','approved'],['却下','rejected']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(!confirm(label+'しますか？'))return;b.disabled=true;try{const d=await call('POST',{id:x.id,text:t.value,status});if(!d.updated)throw Error('更新されませんでした');a.remove();$('msg').textContent='処理しました'}catch(e){$('msg').textContent=e.message;b.disabled=false}};a.append(b)}$('list').append(a)}}catch(e){$('msg').textContent=e.message}}$('load').onclick=load;</script></html>
