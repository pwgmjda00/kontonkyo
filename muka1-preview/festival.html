<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特別興行 | MUKA-1</title><style>body{background:#fff200;color:#111;font:17px/1.5 system-ui;max-width:520px;margin:auto;padding:20px}button{display:block;width:100%;font:inherit;background:white;border:3px solid;padding:14px;margin:8px 0;text-align:left}a{color:inherit}input,select{font:inherit;max-width:100%}article{background:white;border:2px solid;padding:12px;margin:8px 0}</style><h1>特別興行</h1><form id="archive"><select id="kind"><option value="m">月間</option><option value="y">年間</option></select><input id="period" type="month" required><button>過去大会を見る</button></form><p id="status" role="status">取得中…</p><main id="game"></main><p><a href="./">通常の決闘へ</a> ／ <a href="history.html">殿堂へ</a></p><script src="config.js"></script><script src="phrases.js"></script><script>
const q=new URLSearchParams(location.search),id=q.get('id'),g=document.querySelector('#game'),s=document.querySelector('#status'),kind=document.querySelector('#kind'),period=document.querySelector('#period');kind.onchange=()=>{period.type=kind.value==='m'?'month':'number';if(kind.value==='y'){period.min=2000;period.max=9999;period.value=new Date().getFullYear()-1}};document.querySelector('#archive').onsubmit=e=>{e.preventDefault();location.search='?id='+encodeURIComponent(kind.value+':'+period.value)};const url=window.MUKA_API+'/festival'+(id?'?id='+encodeURIComponent(id):'');function show(d,done=false){g.replaceChildren();s.textContent=d.id.replace('m:','月間 ').replace('y:','年間 ')+' ／ '+(d.candidates.length<2?'不成立':d.active?'開催中':'終了')+' ／ '+d.opens+'〜'+d.closes+'（終了日を含まない）';if(done)s.textContent+=' ／ '+(d.accepted?'投票完了':'投票済み');for(const x of d.ranking){const el=document.createElement(d.active&&!done?'button':'article');el.textContent=(d.winners.includes(x.phrase)?'👑 王者：':'')+(MUKA_PHRASES[x.phrase]||'構文 #'+x.phrase)+(!d.active||done?' ／ '+x.votes+'票':'');if(d.active&&!done)el.onclick=async()=>{g.querySelectorAll('button').forEach(b=>b.disabled=true);try{let client=localStorage.getItem('muka1-voter');if(!client){client=crypto.randomUUID();localStorage.setItem('muka1-voter',client)}const r=await fetch(window.MUKA_API+'/festival?id='+encodeURIComponent(d.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client,phrase:x.phrase})});if(!r.ok)throw Error();show(await r.json(),true)}catch{s.textContent='投票できません。再読み込みして確認してください。';g.querySelectorAll('button').forEach(b=>b.disabled=false)}};g.append(el)}const a=document.createElement('a');a.textContent='Xで大会を共有';a.href='https://twitter.com/intent/tweet?text='+encodeURIComponent('今年も腹立つ文章を決めよう。 #MUKA1')+'&url='+encodeURIComponent(location.origin+location.pathname+'?id='+d.id);g.append(a)};(async()=>{try{const r=await fetch(url);if(!r.ok)throw Error();show(await r.json())}catch{s.textContent='大会は準備中、または取得できません。'}})();
</script></html>
