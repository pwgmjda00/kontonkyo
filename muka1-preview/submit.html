<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="canonical" href="https://pwgmjda00.github.io/kontonkyo/muka1-preview/submit.html"><meta property="og:title" content="薪をくべる | MUKA-1"><meta property="og:type" content="website"><meta property="og:url" content="https://pwgmjda00.github.io/kontonkyo/muka1-preview/submit.html"><meta property="og:description" content="架空の構文だけで開催するグランプリ。"><meta name="twitter:card" content="summary_large_image"><meta property="og:image" content="https://pwgmjda00.github.io/kontonkyo/muka1-preview/ogp.png"><meta property="og:image:type" content="image/png"><meta property="og:image:alt" content="MUKA-1 ムカつく構文グランプリ"><meta name="twitter:image" content="https://pwgmjda00.github.io/kontonkyo/muka1-preview/ogp.png"><meta name="twitter:image:alt" content="MUKA-1 ムカつく構文グランプリ"><title>薪をくべる | MUKA-1</title><style>body{background:#fff200;color:#111;font:16px system-ui;max-width:560px;margin:20px auto;padding:16px}textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:2px solid #111;margin:12px 0}button{background:#111;color:white;font-weight:bold}button:disabled{opacity:.5}textarea{min-height:140px}</style><a href="./">大会に戻る</a><h1>薪をくべる。</h1><p>キモかった構文を、誰の投稿か分からない架空の文章に書き換えてください。</p><form id="form"><textarea id="t" minlength="5" maxlength="140" required placeholder="ここに構文"></textarea><div id="count">0/140</div><label><input type="checkbox" id="ok" required> 個人名、ID、リンク、特定できる情報を含まない架空の文章です。</label><button id="send" disabled>審査員に送りつける</button></form><p id="msg" role="status">投稿受付は準備中です。</p><p>匿名・承認制。採用時に文章を編集する場合があります。</p><script src="config.js"></script><script>const API=window.MUKA_API||'';const $=id=>document.getElementById(id);$('t').oninput=()=>{$('count').textContent=$('t').value.length+'/140'};if(API){$('send').disabled=false;$('msg').textContent=''}$('form').onsubmit=async e=>{e.preventDefault();if(!API)return;$('send').disabled=true;try{const r=await fetch(API+'/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('t').value,confirm:$('ok').checked})});if(!r.ok)throw Error('投稿できませんでした。内容を確認してください。');$('form').reset();$('count').textContent='0/140';$('msg').textContent='審査待ちになりました。公開はまだされません。'}catch(e){$('msg').textContent=e.message}finally{$('send').disabled=false}};</script></html>
