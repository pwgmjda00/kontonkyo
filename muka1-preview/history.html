<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="canonical" href="https://pwgmjda00.github.io/kontonkyo/muka1-preview/history.html"><meta property="og:title" content="不名誉の殿堂 | MUKA-1"><meta property="og:type" content="website"><meta property="og:url" content="https://pwgmjda00.github.io/kontonkyo/muka1-preview/history.html"><meta property="og:description" content="架空の構文だけで開催するグランプリ。"><meta name="twitter:card" content="summary_large_image"><meta property="og:image" content="https://pwgmjda00.github.io/kontonkyo/muka1-preview/ogp.png"><meta property="og:image:type" content="image/png"><meta property="og:image:alt" content="MUKA-1 ムカつく構文グランプリ"><meta name="twitter:image" content="https://pwgmjda00.github.io/kontonkyo/muka1-preview/ogp.png"><meta name="twitter:image:alt" content="MUKA-1 ムカつく構文グランプリ"><title>不名誉の殿堂 | MUKA-1</title><style>body{background:#fff200;color:#111;font:16px/1.6 system-ui;max-width:520px;margin:auto;padding:18px}a{color:inherit}article{background:#fffdf4;border:9px ridge #c69c36;padding:16px;margin:18px 0;overflow-wrap:anywhere}button{font:inherit;background:#111;color:white;padding:12px;width:100%;border:0}h1{line-height:1.2}small{display:block}</style><a href="ranking.html">ランキングに戻る</a><h1>全国号外</h1><p id="status" role="status">集計中…</p><section id="daily"></section><h2>不名誉の殿堂</h2><p>直近12週間の確定優勝構文</p><section id="weeks"></section><script src="config.js"></script><script src="phrases.js"></script><script>async function boundedFetch(url,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);try{return await fetch(url,{...options,signal:controller.signal})}finally{clearTimeout(timer)}}function retryNotice(el,message){el.textContent=message;const b=document.createElement('button');b.type='button';b.textContent='再読み込み';b.onclick=()=>location.reload();el.append(document.createElement('br'),b)}</script><script>const pool=Object.assign(Object.create(null),window.MUKA_PHRASES);function frame(parent,x,label){if(typeof pool[x.phrase]!=='string')return;const a=document.createElement('article');const s=document.createElement('small');s.textContent=label+' ／ '+x.votes+'票';const p=document.createElement('strong');p.textContent=pool[x.phrase];a.append(s,p);parent.append(a);return a}async function share(x,day){const cv=document.createElement('canvas');cv.width=1200;cv.height=630;const ctx=cv.getContext('2d');ctx.fillStyle='#fff200';ctx.fillRect(0,0,1200,630);ctx.fillStyle='#111';ctx.font='bold 65px sans-serif';ctx.fillText('全国号外 ／ MUKA-1',55,100);ctx.font='30px sans-serif';ctx.fillText(day+' ／ '+x.votes+'票',55,170);ctx.font='bold 44px sans-serif';let line='',y=250;for(const ch of pool[x.phrase]){if(ctx.measureText(line+ch).width>1080){ctx.fillText(line,55,y);line='';y+=55}line+=ch}ctx.fillText(line,55,y);ctx.font='25px sans-serif';ctx.fillText('架空構文の全国投票 #MUKA1',55,585);cv.toBlob(async blob=>{if(!blob)return;const file=new File([blob],'muka1-news.png',{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],text:'#MUKA1 '+new URL('./',location.href).href});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)})}(async()=>{const status=document.querySelector('#status');try{const r=await boundedFetch(window.MUKA_API+'/history');if(!r.ok)throw Error();const d=await r.json();status.textContent=d.day+' の確定結果'+(d.winners.length?'':' ／ 投票なし');for(const x of d.winners){const a=frame(document.querySelector('#daily'),x,d.winners.length>1?'共同優勝':'優勝');if(a){const b=document.createElement('button');b.textContent='号外を画像にする';b.onclick=()=>share(x,d.day);a.append(b)}}for(const x of d.weeks)frame(document.querySelector('#weeks'),x,x.week+' 週の優勝');if(!d.weeks.length)document.querySelector('#weeks').textContent='まだ確定した週間優勝はありません。'}catch{status.textContent='履歴APIは準備中、または通信できません。'}})();</script></html>
