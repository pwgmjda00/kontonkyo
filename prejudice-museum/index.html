<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>偏見博物館</title><meta property="og:title" content="偏見博物館"><meta property="og:description" content="あなたという、誤解の展覧会。"><style>*{box-sizing:border-box}body{margin:0;background:#181714;color:#eee5ce;font-family:serif}main{max-width:620px;margin:auto;padding:24px}header{text-align:center;padding:45px 0 25px}small{color:#b9a77f;letter-spacing:.1em}h1{font-size:42px;letter-spacing:.12em;margin:12px 0}p{line-height:1.8}button,input,textarea{font:inherit;border:1px solid #a18b60;border-radius:4px;padding:14px;width:100%;margin:5px 0;background:#29251e;color:#f3e8d0}button{cursor:pointer;min-height:48px}button.primary{background:#cbb98d;color:#201c15;font-weight:bold}textarea{min-height:100px}article{border:5px double #9b8353;background:#27231c;padding:24px;margin:20px 0;text-align:center;box-shadow:0 5px 15px #0005}article p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:20px}nav{display:flex;gap:8px}section{margin:24px 0}footer{text-align:center;color:#aa9976;font-size:12px;margin:40px 0}label{display:block;margin-top:10px}.muted{color:#b8ad97;font-size:13px}.actions{display:flex;gap:6px}button:focus-visible{outline:2px solid white}</style></head><body><main><header><small>MUSEUM OF PREJUDICE</small><h1>偏見博物館</h1><p>あなたという、誤解の展覧会。</p></header><nav id="nav"></nav><section id="panel"></section><footer>余白と遊び / 試作展示室</footer></main><script>
const panel=document.querySelector('#panel'),nav=document.querySelector('#nav');let state={name:'',works:[]};try{let x=JSON.parse(localStorage.getItem('prejudice-museum-v1'));if(x&&Array.isArray(x.works))state=x}catch{}function save(){try{localStorage.setItem('prejudice-museum-v1',JSON.stringify(state));return true}catch{alert('端末に保存できませんでした');return false}}function el(tag,text,parent=panel){let e=document.createElement(tag);e.textContent=text||'';parent.append(e);return e}function btn(text,fn,parent=panel,primary=false){let b=el('button',text,parent);if(primary)b.className='primary';b.onclick=fn;return b}function field(label,value='',multi=false){el('label',label);let e=el(multi?'textarea':'input');e.value=value;e.maxLength=multi?160:40;return e}function clear(){panel.replaceChildren()}function link(payload){return location.origin+location.pathname+'#'+encodeURIComponent(JSON.stringify(payload))}async function copy(v){try{await navigator.clipboard.writeText(v);alert('コピーしました')}catch{prompt('コピーしてください',v)}}function gallery(){clear();el('h2',state.name?state.name+'の展示室':'展示室');let items=state.works.filter(w=>w.approved);if(!items.length){el('p','まだ展示作品はありません。まずは寄贈を募集してみましょう。');btn('寄贈を募集する',manage,panel,true)}for(let w of items){let a=el('article');el('p',w.text,a);el('small','作者不詳 / 匿名寄贈',a)}if(items.length)btn('展示室の共有リンクをコピー',()=>copy(link({type:'gallery',name:state.name,works:items.map(w=>w.text)})),panel,true)}function manage(){clear();el('h2','館長室');let name=field('博物館の名前（ニックネーム）',state.name);btn('募集リンクを作る',()=>{state.name=name.value.trim()||'名無し';if(save())copy(link({type:'invite',name:state.name}))},panel,true);el('p','寄贈者が作った返信リンクを受け取って開くと、展示候補として追加されます。サーバーを使わない試作方式です。').className='muted';el('h3','寄贈された作品');for(let w of state.works){let a=el('article');el('p',w.text,a);el('small',w.approved?'展示中':'未承認',a);let row=el('div','',a);row.className='actions';btn(w.approved?'展示を取り下げる':'展示する',()=>{w.approved=!w.approved;save();manage()},row);btn('削除',()=>{if(confirm('この寄贈を削除しますか？')){state.works=state.works.filter(x=>x!==w);save();manage()}},row)}btn('展示室を見る',gallery)}function donate(name){clear();el('h2',name+'への寄贈');el('p','軽い思い込みや愛のある偏見を一つ。個人情報、脅迫、侮辱は書かないでください。');let t=field('偏見', '',true);t.placeholder='例：冷蔵庫に飲み物しかなさそう。';btn('寄贈リンクを作る',()=>{let text=t.value.trim();if(!text)return alert('偏見を入力してください');let url=link({type:'gift',name,text,id:crypto.randomUUID?crypto.randomUUID():Date.now().toString()});clear();el('h2','寄贈作品ができました');el('p','このリンクを館長にDMなどで送ってください。自動送信はされません。');btn('返信リンクをコピー',()=>copy(url),panel,true)},panel,true)}function route(){let p;try{p=JSON.parse(decodeURIComponent(location.hash.slice(1)))}catch{}if(p?.type==='invite'&&typeof p.name==='string'){donate(p.name.slice(0,40));return}if(p?.type==='gift'&&typeof p.text==='string'&&typeof p.id==='string'){clear();el('h2','寄贈が届きました');el('p',p.text.slice(0,160));btn('展示候補として受け取る',()=>{if(!state.works.some(w=>w.id===p.id)){state.works.push({id:p.id,text:p.text.slice(0,160),approved:false});if(!save())return}history.replaceState(null,'',location.pathname);manage()},panel,true);return}if(p?.type==='gallery'&&Array.isArray(p.works)){clear();el('h2',String(p.name||'').slice(0,40)+'の展示室');for(let text of p.works.slice(0,50)){if(typeof text!=='string')continue;let a=el('article');el('p',text.slice(0,160),a);el('small','作者不詳 / 匿名寄贈',a)}btn('この館長に偏見を寄贈する',()=>donate(String(p.name||'名無し').slice(0,40)),panel,true);return}if(state.name)gallery();else manage()}btn('展示室',gallery,nav);btn('館長室',manage,nav);window.addEventListener('hashchange',route);route();
</script></body></html>
