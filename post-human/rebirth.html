<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人間廃業</title><style>*{box-sizing:border-box}body{margin:0;background:#101018;color:#eee;font:14px system-ui}main{max-width:520px;margin:auto;padding:10px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:17px}canvas{width:100%;height: min(43vh,340px);background:#191923;border:1px solid #383847;border-radius:12px}button{background:#242432;border:1px solid #55546b;color:#fff;border-radius:8px;padding:10px;font:inherit}#slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}#loot{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:125px;overflow:auto}#loot button{text-align:left}small{color:#aaa}progress{width:100%;accent-color:#e95777}p{margin:6px 0}#info{min-height:38px;color:#d6bcff}</style><main><header><h1>人間廃業 <small>POST HUMAN</small></h1><span id="depth"></span></header><canvas id="c"></canvas><progress id="hp" max="100"></progress><p id="stats"></p><p id="chain" aria-live="off" style="color:#ffcc75;font-weight:700;min-height:20px"></p><p id="hint">指で移動・攻撃は自動。標本を集め、24秒ごとに適応。</p><div id="slots"></div><p id="info">装備を拾え。人間を辞めろ。</p><div id="loot"></div><p><button id="pause">一時停止</button> <button id="retry" hidden>再出撃</button></p></main><script>
const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d'),types=[['捕食獣','顎','攻撃','🦷','#ff7777',24],['監視眼','眼球','会心','👁️','#c59aff',5.5],['脈動体','心臓','速度','🫀','#ff92bd',12],['疾走虫','脚','移動','🦎','#8eeaaa',12],['装甲獣','外殻','防御','🐢','#e4c77b',8],['分裂体','細胞','追撃','🦠','#83dfff',0.5],['再生菌','組織','回復','🍄','#ffb477',0.35]];let organs=Array(7).fill(0);try{let a=JSON.parse(localStorage.postHumanEco);if(Array.isArray(a)&&a.length===7)organs=a.map(x=>Math.max(0,Number(x)||0))}catch{}let W,H,p,target,enemies,loot,fx,hp,kills,age,spawn,clock,last=0,paused,dead,pending=null,drag=false,travel=0,overflow=0,guardXP=0,healXP=0,rewardClock=[0,0],bossSpawned=false,won=false,samples=Array(7).fill(0),nextMutation=12,tech=0,choosing=false;function size(){let r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}function effective(n){return Math.min(n,10)+Math.max(0,n-10)/3}function bonus(k,n){let v=effective(n);return k===1?80*(1-Math.exp(-v*.075)):k===4?100*(1-1/(1+v*.08)):v*types[k][5]}function fmt(k,v){return Number(v.toFixed(2))+(k===5?'体':k===6?'HP/秒':k===1||k===4?'pt':'%')}function gainText(k,n){return '+'+fmt(k,bonus(k,organs[k]+n)-bonus(k,organs[k]))}function ui(){$('slots').replaceChildren(...types.map((a,i)=>{let b=document.createElement('button');b.textContent=a[3]+' '+a[2]+' Lv'+organs[i]+(organs[i]>=10?' ↓':'');b.onclick=()=>{$('info').textContent=a[0]+' → '+a[1]+'：'+a[2]+' '+fmt(i,bonus(i,organs[i]))+(organs[i]>=10?' ｜ Lv10超過分は1/3':'')+(['','','',' ｜ 移動距離で次撃強化',' ｜ 接触反撃','', ' ｜ 余剰回復を次撃に変換'][i])};return b}))}let combo=0,comboUntil=0,bestCombo=0;function reset(){combo=bestCombo=comboUntil=0;$('hint').textContent='指で移動・攻撃は自動。標本を集め、24秒ごとに適応。';samples=Array(7).fill(0);nextMutation=24;tech=0;choosing=false;bossSpawned=won=false;travel=overflow=guardXP=healXP=0;rewardClock=[0,0];pending=null;$('loot').replaceChildren();organs=Array(7).fill(0);size();p={x:W/2,y:H/2};target={...p};enemies=[];loot=[];fx=[];hp=100;kills=age=spawn=clock=0;paused=dead=false;$('retry').hidden=true;$('pause').textContent='一時停止';ui();for(let i of [0,2,6])add(i);mutate()}function add(k,x,y,l=1){let a=Math.random()*6.28;enemies.push({k,x:x??Math.max(12,Math.min(W-12,W/2+Math.cos(a)*W*.46)),y:y??Math.max(12,Math.min(H-12,H/2+Math.sin(a)*H*.46)),l,hp:(k===4?28:20)*Math.max(1,l),max:(k===4?28:20)*Math.max(1,l),bite:0,split:l===0,wind:0,cool:1.5,aim:null})}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function move(a,b,v,dt){let d=dist(a,b);if(d>1){let n=Math.min(d,v*dt);a.x=Math.max(10,Math.min(W-10,a.x+(b.x-a.x)/d*n));a.y=Math.max(10,Math.min(H-10,a.y+(b.y-a.y)/d*n))}}function hit(e,n){if(e.k===4)n*=.85;e.hp-=n;if(e.hp<=0)fx.push({x:e.x,y:e.y,n:'✦',t:.5});else if(e.k!==4&&dist(e,p)>1){let d=dist(e,p);e.x=Math.max(10,Math.min(W-10,e.x+(e.x-p.x)/d*4));e.y=Math.max(10,Math.min(H-10,e.y+(e.y-p.y)/d*4));}fx.push({x:e.x,y:e.y,n:Math.round(n),t:.5})}function attack(){let a=enemies.filter(e=>dist(e,p)<105+Math.min(45,tech*2)&&e.hp>0).sort((a,b)=>dist(a,p)-dist(b,p));if(!a.length)return;let crit=Math.random()<.1+bonus(1,organs[1])/100,d=(13*(1+.24*effective(organs[0])+.18*tech))*(crit?2:1);let dash=Math.min(1,travel/45)*3*(1-Math.exp(-effective(organs[3])*.04));hit(a[0],d*(1+dash));travel=0;if(overflow>0){hit(a[0],overflow*3);overflow=0}if(tech>=5&&a[0].wind>0)hit(a[0],d*Math.min(.8,tech*.025));if(organs[0]>=4&&a[0].hp<=0){for(let e of a.slice(1,3))if(dist(e,a[0])<55)hit(e,d*.5);}if(organs[2]>=5){for(let e of a.slice(1,4))if(dist(e,p)<65)hit(e,d*.25)}fx.push({x:p.x,y:p.y,ex:a[0].x,ey:a[0].y,t:.16});let extra=effective(organs[5])/2,limit=1+Math.floor(extra)+(Math.random()<extra%1?1:0);for(let i=1;i<Math.min(a.length,limit);i++)hit(a[i],d*.65)}function phase(){return Math.min(4,Math.floor(age/120))}function mutate(){choosing=true;paused=true;let panel=$('loot');panel.replaceChildren();let ranked=age===0?[0,4,6]:types.map((_,i)=>i).sort((a,b)=>samples[b]-samples[a]||organs[a]-organs[b]);function choose(k){if(!choosing)return;if(k===-1){tech++;hp=Math.min(100,hp+12)}else organs[k]+=2;samples.fill(0);choosing=false;paused=false;panel.replaceChildren();ui();$('info').textContent=k===-1?'技術適応：人間性を維持（技術5以上で予告中の敵に追撃）':types[k][1]+' 変異 Lv'+organs[k];}for(let k of [...ranked.slice(0,3),-1]){let b=document.createElement('button');b.textContent=k===-1?'技術＋1：攻撃＋18%・射程＋2・HP12回復':types[k][3]+' '+types[k][2]+' '+gainText(k,2);b.onclick=()=>choose(k);panel.append(b)}$('info').textContent='適応の時。変異か技術を選択。';}function frame(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;if(!paused&&!dead){age+=dt;if(age>=nextMutation&&age<600){nextMutation+=24;mutate();requestAnimationFrame(frame);return;}if(age>=600&&!bossSpawned){bossSpawned=true;add(4,W/2,20,1);let b=enemies[enemies.length-1];b.boss=true;b.hp=b.max=3000;b.cool=1;$('info').textContent='最後の人間、出現。';}if(age>comboUntil)combo=0;let old={...p};move(p,target,95*(1+effective(organs[3])*.12),dt);travel=Math.min(45,travel+dist(old,p));spawn-=dt;if(spawn<=0&&enemies.length<35&&!bossSpawned){let weights=types.map((_,i)=>(1+([[],[0,4],[5,6],[1,3],[0,1,4]][phase()].includes(i)?2:0))/(1+enemies.filter(e=>e.k===i).length));let roll=Math.random()*weights.reduce((a,b)=>a+b,0),k=0;while(k<6&&(roll-=weights[k])>0)k++;add(k,undefined,undefined,1+phase());spawn=Math.max(.75,3.8-age/190)}clock-=dt;if(clock<=0){attack();clock=Math.max(.12,.65/(1+effective(organs[2])*.12))}let heal=dt*effective(organs[6])*.35;overflow=Math.min(30,overflow+Math.max(0,hp+heal-100));healXP+=Math.min(heal,Math.max(0,100-hp));hp=Math.min(100,hp+heal);for(let e of enemies){if(e.hp<=0)continue;e.bite-=dt;e.cool-=dt;if(e.wind>0){e.wind-=dt;if(e.wind<=0){let q=e.aim,range=e.boss?(e.hp<e.max/2?65:48):e.k===1?24:34;if(dist(p,q)<range){let raw=(e.boss? (e.hp<e.max/2?65:45):e.k===1?9:12)*e.l,actual=raw/(1+effective(organs[4])*.08);hp-=actual;guardXP+=raw-actual;e.hp-=effective(organs[4])*2;}if(e.k===3)move(e,q,1600,.05);e.aim=null;e.cool=e.boss?(e.hp<e.max/2?0.8:1.5):2.4;}continue;}if((e.k===1||e.k===3||e.k===4)&&e.cool<=0&&dist(e,p)<(e.boss?180:e.k===1?130:e.k===3?85:45)){e.aim={...p};e.wind=e.k===4?.95:.75;continue;}let prey=e.k===0?enemies.filter(a=>a!==e&&!a.boss&&a.k!==0&&a.hp>0).sort((a,b)=>dist(a,e)-dist(b,e))[0]:null;let b=prey||p;if(e.k===3&&dist(e,p)<90)b={x:e.x+(e.x-p.x),y:e.y+(e.y-p.y)};if(e.k===1&&dist(e,p)<75&&dist(e,p)>50){}else move(e,b,(e.k===3?62:e.k===4?18:32)*Math.min(1.5,1+e.l*.08),dt);if(prey&&dist(e,prey)<17&&e.bite<=0){prey.hp-=12*e.l;e.bite=.7;if(prey.hp<=0){prey.eaten=true;e.l++;e.max+=20;e.hp=e.max}}if(dist(e,p)<19){let raw=dt*2.2*e.l,actual=raw/(1+effective(organs[4])*.08);guardXP+=raw-actual;hp-=actual;e.hp-=dt*effective(organs[4])*2.5}if(e.k===6)for(let a of enemies)if(a!==e&&dist(a,e)<45&&a.hp>0)a.hp=Math.min(a.max,a.hp+dt*2)}let gone=enemies.filter(e=>e.hp<=0);enemies=enemies.filter(e=>e.hp>0);for(let e of gone){if(e.eaten)continue;if(e.boss){won=true;dead=true;$('retry').hidden=false;let total=organs.reduce((a,b)=>a+b,0),k=organs.indexOf(Math.max(...organs));$('hint').textContent='END：'+(tech>=20?'人類最後の希望':total>=40?['完全捕食者','全知の異形','脈動する災厄','疾走する異形','不滅の外殻','歩く生態系','不死の失敗作'][k]:'人間のような何か');$('info').textContent='人間廃業 完了。最後の人間を撃破。';continue;}kills++;combo=age<=comboUntil?combo+1:1;comboUntil=age+2.5;bestCombo=Math.max(bestCombo,combo);if(combo>=3)fx.push({x:p.x,y:p.y-25,n:combo+' CHAIN!',t:.8});if(combo%5===0){hp=Math.min(100,hp+5);fx.push({x:p.x,y:p.y-42,n:'捕食連鎖 +5HP',t:1});}loot.push({x:e.x,y:e.y,k:e.k,l:Math.max(1,e.l)});if(e.k===5&&e.l>0){add(5,e.x-8,e.y,0);add(5,e.x+8,e.y,0);for(let a of enemies.slice(-2)){a.hp=a.max=7}}}for(let i=loot.length-1;i>=0;i--){let a=loot[i];if(dist(a,p)<27){let gain=1,display='標本 +1';samples[a.k]++;loot.splice(i,1);try{localStorage.postHumanEco=JSON.stringify(organs)}catch{}ui();$('info').textContent=types[a.k][3]+' '+types[a.k][1]+' 摘出！ '+types[a.k][2]+' '+display}}for(let j=0;j<2;j++){let k=j===0?4:6,v=j===0?guardXP:healXP;if(organs[k]>0&&v>=15&&age>=rewardClock[j]){if(j===0)guardXP-=15;else healXP-=15;samples[k]++;rewardClock[j]=age+15;ui();$('info').textContent=types[k][3]+' 適応標本：'+types[k][2]+' 標本＋1'}}if(hp<=0&&!won){hp=0;dead=true;$('retry').hidden=false;$('info').textContent='死亡。再出撃で肉体をリセット。'}}$('chain').textContent=combo>=2?combo+' CHAIN  /  BEST '+bestCombo:'BEST CHAIN '+bestCombo;g.clearRect(0,0,W,H);g.strokeStyle='#34354b';g.beginPath();g.arc(p.x,p.y,105+Math.min(45,tech*2),0,7);g.stroke();for(let a of loot){g.fillStyle=types[a.k][4];g.fillRect(a.x-5,a.y-5,10,10);g.font='10px system-ui';g.fillText(types[a.k][2]+'標本',a.x-12,a.y+16)}for(let e of enemies){let a=types[e.k];if(e.wind>0&&e.aim){g.strokeStyle=e.k===1?'#c59aff':e.k===3?'#8eeaaa':'#e4c77b';g.lineWidth=2;g.beginPath();g.arc(e.aim.x,e.aim.y,e.boss?(e.hp<e.max/2?65:48):e.k===1?24:34,0,7);g.stroke();g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.aim.x,e.aim.y);g.stroke();g.lineWidth=1;}g.fillStyle=a[4];let r=e.boss?22:8+Math.min(10,e.l*2);g.fillRect(e.x-r,e.y-r,r*2,r*2);g.font='16px system-ui';g.textAlign='center';g.fillText(e.boss?'人':a[3],e.x,e.y+5);g.font='10px system-ui';g.fillText(e.boss?'最後の人間 '+Math.ceil(e.hp):a[2]+'標本',e.x,e.y-r-4);g.fillRect(e.x-r,e.y+r+2,r*2*Math.max(0,e.hp/e.max),2)}g.save();g.translate(p.x,p.y);let tier=organs.map(n=>n===0?0:n<5?1:n<10?2:3);g.fillStyle='#fff';g.fillRect(-8,-10,16,20);g.fillStyle='#26213e';g.fillRect(-5,-5,3,4);g.fillRect(2,-5,3,4);for(let i=0;i<7;i++){if(!tier[i])continue;g.fillStyle=types[i][4];let n=tier[i];if(i===0){for(let j=0;j<n;j++){g.fillRect(-7+j*5,5,3,5+n*2)}}if(i===1){for(let j=0;j<n;j++){g.fillRect(-6+j*5,-13,4,4)}}if(i===2){g.fillRect(-3,0,6,3+n*2)}if(i===3){for(let j=0;j<n;j++){g.fillRect(-12-j*3,3+j*3,5,3);g.fillRect(7+j*3,3+j*3,5,3)}}if(i===4){g.fillRect(-10-n,-9,3+n,18);g.fillRect(7,-9,3+n,18)}if(i===5){for(let j=0;j<n;j++){g.fillRect(-14-j*4,-7,3,3);g.fillRect(11+j*4,-7,3,3)}}if(i===6){g.fillRect(-3,-17-n*2,6,7+n*2);g.fillRect(-6,-17-n*2,12,4)}}g.restore();for(let f of fx){g.globalAlpha=Math.max(0,f.t/.5);g.strokeStyle=g.fillStyle='#ffe7a1';if(f.ex!==undefined){g.beginPath();g.moveTo(f.x,f.y);g.lineTo(f.ex,f.ey);g.stroke()}else{g.fillText(f.n,f.x,f.y);f.y-=dt*20}f.t-=dt}fx=fx.filter(f=>f.t>0);g.globalAlpha=1;$('hp').value=hp;$('depth').textContent=['原始','捕食','増殖','淘汰','終末'][phase()]+' '+Math.floor(age)+'秒';$('stats').textContent='HP '+Math.ceil(hp)+' ｜ 撃破 '+kills+' ｜ 人間性 '+Math.round(100*(1-organs.reduce((a,b)=>a+b,0)/50))+'% ｜ 技術 '+tech;requestAnimationFrame(frame)}function aim(e){let r=c.getBoundingClientRect();target={x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);aim(e)};c.onpointermove=e=>{if(drag)aim(e)};c.onpointerup=c.onpointercancel=()=>{drag=false;target={...p}};c.style.touchAction='none';$('pause').onclick=()=>{if(pending||choosing)return;paused=!paused;$('pause').textContent=paused?'再開':'一時停止'};$('retry').onclick=reset;reset();requestAnimationFrame(frame);
</script></html>
