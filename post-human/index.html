<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人間廃業</title><style>*{box-sizing:border-box}body{margin:0;background:#101018;color:#eee;font:14px system-ui}main{max-width:520px;margin:auto;padding:10px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:17px}canvas{width:100%;height: min(43vh,340px);background:#191923;border:1px solid #383847;border-radius:12px}button{background:#242432;border:1px solid #55546b;color:#fff;border-radius:8px;padding:10px;font:inherit}#slots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}#loot{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:125px;overflow:auto}#loot button{text-align:left}small{color:#aaa}progress{width:100%;accent-color:#e95777}p{margin:6px 0}#info{min-height:38px;color:#d6bcff}</style><main><header><h1>人間廃業 <small>POST HUMAN</small></h1><span id="depth"></span></header><canvas id="c"></canvas><progress id="hp" max="100"></progress><p id="stats"></p><p id="hint">指で移動・攻撃は自動。敵の頭上の能力を狙え。</p><div id="slots"></div><p id="info">装備を拾え。人間を辞めろ。</p><div id="loot"></div><p><button id="pause">一時停止</button> <button id="retry" hidden>再出撃</button></p></main><script>
const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d'),types=[['捕食獣','顎','攻撃','🦷','#ff7777',24],['監視眼','眼球','会心','👁️','#c59aff',5.5],['脈動体','心臓','速度','🫀','#ff92bd',12],['疾走虫','脚','移動','🦎','#8eeaaa',12],['装甲獣','外殻','防御','🐢','#e4c77b',8],['分裂体','細胞','追撃','🦠','#83dfff',0.5],['再生菌','組織','回復','🍄','#ffb477',0.35]];let organs=Array(7).fill(0);try{let a=JSON.parse(localStorage.postHumanEco);if(Array.isArray(a)&&a.length===7)organs=a.map(x=>Math.max(0,Number(x)||0))}catch{}let W,H,p,target,enemies,loot,fx,hp,kills,age,spawn,clock,last=0,paused,dead,drag=false;function size(){let r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}function ui(){$('slots').replaceChildren(...types.map((a,i)=>{let b=document.createElement('button');b.textContent=a[3]+' '+a[2]+' Lv'+organs[i];b.onclick=()=>{$('info').textContent=a[0]+' → '+a[1]+'：'+a[2]+' '+(Math.round(organs[i]*a[5]*100)/100)+(i===5||i===6?'':'%')};return b}))}function reset(){organs=Array(7).fill(0);size();p={x:W/2,y:H/2};target={...p};enemies=[];loot=[];fx=[];hp=100;kills=age=spawn=clock=0;paused=dead=false;$('retry').hidden=true;$('pause').textContent='一時停止';ui();for(let i=0;i<7;i++)add(i)}function add(k,x,y,l=1){let a=Math.random()*6.28;enemies.push({k,x:x??Math.max(12,Math.min(W-12,W/2+Math.cos(a)*W*.46)),y:y??Math.max(12,Math.min(H-12,H/2+Math.sin(a)*H*.46)),l,hp:(k===4?42:20)*Math.max(1,l),max:(k===4?42:20)*Math.max(1,l),bite:0,split:l===0})}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function move(a,b,v,dt){let d=dist(a,b);if(d>1){let n=Math.min(d,v*dt);a.x=Math.max(10,Math.min(W-10,a.x+(b.x-a.x)/d*n));a.y=Math.max(10,Math.min(H-10,a.y+(b.y-a.y)/d*n))}}function hit(e,n){if(e.k===4)n*=.65;e.hp-=n;fx.push({x:e.x,y:e.y,n:Math.round(n),t:.5})}function attack(){let a=enemies.filter(e=>dist(e,p)<105&&e.hp>0).sort((a,b)=>dist(a,p)-dist(b,p));if(!a.length)return;let crit=Math.random()<Math.min(.8,.1+organs[1]*.055),d=(13*(1+.24*organs[0]))*(crit?2:1);hit(a[0],d);fx.push({x:p.x,y:p.y,ex:a[0].x,ey:a[0].y,t:.16});for(let i=1;i<Math.min(a.length,1+Math.floor(organs[5]/2));i++)hit(a[i],d*.65)}function frame(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;if(!paused&&!dead){age+=dt;move(p,target,95*(1+organs[3]*.12),dt);spawn-=dt;if(spawn<=0&&enemies.length<35){add(Math.random()*7|0,undefined,undefined,1+Math.floor(age/45));spawn=Math.max(.45,1.5-age/180)}clock-=dt;if(clock<=0){attack();clock=.65/(1+organs[2]*.12)}hp=Math.min(100,hp+dt*Math.min(3,organs[6]*.35));for(let e of enemies){if(e.hp<=0)continue;e.bite-=dt;let prey=e.k===0?enemies.filter(a=>a!==e&&a.k!==0&&a.hp>0).sort((a,b)=>dist(a,e)-dist(b,e))[0]:null;let b=prey||p;if(e.k===3&&dist(e,p)<90)b={x:e.x+(e.x-p.x),y:e.y+(e.y-p.y)};if(e.k===1&&dist(e,p)<75&&dist(e,p)>50){}else move(e,b,(e.k===3?62:e.k===4?18:32)*Math.min(1.5,1+e.l*.08),dt);if(prey&&dist(e,prey)<17&&e.bite<=0){prey.hp-=12*e.l;e.bite=.7;if(prey.hp<=0){prey.eaten=true;e.l++;e.max+=20;e.hp=e.max}}if(dist(e,p)<19)hp-=dt*5*e.l/(1+organs[4]*.08);if(e.k===6)for(let a of enemies)if(a!==e&&dist(a,e)<45&&a.hp>0)a.hp=Math.min(a.max,a.hp+dt*2)}let gone=enemies.filter(e=>e.hp<=0);enemies=enemies.filter(e=>e.hp>0);for(let e of gone){if(e.eaten)continue;kills++;loot.push({x:e.x,y:e.y,k:e.k,l:Math.max(1,e.l)});if(e.k===5&&e.l>0){add(5,e.x-8,e.y,0);add(5,e.x+8,e.y,0);for(let a of enemies.slice(-2)){a.hp=a.max=7}}}for(let i=loot.length-1;i>=0;i--){let a=loot[i];if(dist(a,p)<27){let room=Math.max(0,12+Math.floor(age/20)-organs.reduce((a,b)=>a+b,0));let gain=Math.min(room,a.l,Math.max(0,10-organs[a.k]));organs[a.k]+=gain;loot.splice(i,1);try{localStorage.postHumanEco=JSON.stringify(organs)}catch{}ui();$('info').textContent=types[a.k][3]+' '+types[a.k][1]+' 摘出！ '+types[a.k][2]+' Lv+'+gain}}if(hp<=0){hp=0;dead=true;$('retry').hidden=false;$('info').textContent='死亡。再出撃で肉体をリセット。'}}g.clearRect(0,0,W,H);g.strokeStyle='#34354b';g.beginPath();g.arc(p.x,p.y,105,0,7);g.stroke();for(let a of loot){g.fillStyle=types[a.k][4];g.fillRect(a.x-5,a.y-5,10,10);g.font='10px system-ui';g.fillText(types[a.k][2]+'+'+a.l,a.x-12,a.y+16)}for(let e of enemies){let a=types[e.k];g.fillStyle=a[4];let r=8+Math.min(10,e.l*2);g.fillRect(e.x-r,e.y-r,r*2,r*2);g.font='16px system-ui';g.textAlign='center';g.fillText(a[3],e.x,e.y+5);g.font='10px system-ui';g.fillText(a[2]+' Lv'+Math.max(1,e.l),e.x,e.y-r-4);g.fillRect(e.x-r,e.y+r+2,r*2*Math.max(0,e.hp/e.max),2)}g.fillStyle='#fff';g.fillRect(p.x-8,p.y-10,16,20);g.fillStyle='#26213e';g.fillRect(p.x-5,p.y-5,3,4);g.fillRect(p.x+2,p.y-5,3,4);for(let f of fx){g.globalAlpha=Math.max(0,f.t/.5);g.strokeStyle=g.fillStyle='#ffe7a1';if(f.ex!==undefined){g.beginPath();g.moveTo(f.x,f.y);g.lineTo(f.ex,f.ey);g.stroke()}else{g.fillText(f.n,f.x,f.y);f.y-=dt*20}f.t-=dt}fx=fx.filter(f=>f.t>0);g.globalAlpha=1;$('hp').value=hp;$('depth').textContent='生存 '+Math.floor(age)+'秒';$('stats').textContent='HP '+Math.ceil(hp)+' ｜ 撃破 '+kills+' ｜ 臓器 '+organs.reduce((a,b)=>a+b,0)+'/'+(12+Math.floor(age/20));requestAnimationFrame(frame)}function aim(e){let r=c.getBoundingClientRect();target={x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);aim(e)};c.onpointermove=e=>{if(drag)aim(e)};c.onpointerup=c.onpointercancel=()=>{drag=false;target={...p}};c.style.touchAction='none';$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止'};$('retry').onclick=reset;reset();requestAnimationFrame(frame);
</script></html>
