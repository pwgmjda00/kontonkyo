<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人間廃業</title><style>*{box-sizing:border-box}body{margin:0;background:#101018;color:#eee;font:14px system-ui}main{max-width:520px;margin:auto;padding:10px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:17px}canvas{width:100%;height: min(43vh,340px);background:#191923;border:1px solid #383847;border-radius:12px}button{background:#242432;border:1px solid #55546b;color:#fff;border-radius:8px;padding:10px;font:inherit}#slots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}#loot{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:180px;overflow:auto}#loot button{text-align:left}small{color:#aaa}progress{width:100%;accent-color:#e95777}p{margin:6px 0}#info{min-height:38px;color:#d6bcff}</style><main><header><h1>人間廃業 <small>POST HUMAN</small></h1><span id="depth"></span></header><canvas id="c"></canvas><progress id="hp" max="100"></progress><p id="stats"></p><div id="slots"></div><p id="info">装備を拾え。人間を辞めろ。</p><div id="loot"></div><p><button id="pause">一時停止</button> <button id="retry" hidden>再出撃</button></p></main><script>
const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d'),slots=['⚔️','👁️','🫀','🧠','💍'];const items=[
[0,'鉄の剣','基礎攻撃 +8'],[0,'双刃','二体を同時攻撃'],[0,'雷鳴','三撃ごとに全体雷撃'],[0,'死神の鎌','低HPの敵を即死'],
[1,'鷹の眼','会心率 +30%'],[1,'第三の眼','会心で追加攻撃'],[1,'虚無の眼','強敵への威力2倍'],[1,'血の眼','会心で回復'],
[2,'機械心臓','攻撃速度1.6倍'],[2,'捕食心臓','撃破でHP回復'],[2,'不眠心臓','時間で速度上昇'],[2,'爆弾心臓','撃破で周囲爆発'],
[3,'反響脳','五撃ごとに追撃'],[3,'狂戦脳','低HPほど攻撃力上昇'],[3,'学習脳','撃破数で攻撃力上昇'],[3,'再生脳','毎秒HP回復'],
[4,'毒の指輪','攻撃で毒を付与'],[4,'寄生指輪','撃破時に敵を引き寄せる衝撃'],[4,'黄金指輪','装備ドロップ率2倍'],[4,'連鎖指輪','会心で周囲に衝撃']];
let save;try{save=JSON.parse(localStorage.postHuman||'null')}catch{}let eq=save?.eq||[0,-1,-1,-1,-1],bag=save?.bag||[0],best=save?.best||0;let W,H,hp,kills,age,depth,shots,clock,spawn,paused,dead,enemies,fx,last=0,dropTime=0;function has(i){return eq.includes(i)}function persist(){try{localStorage.postHuman=JSON.stringify({eq,bag,best})}catch{}}function size(){let r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}function render(){ $('slots').replaceChildren(...slots.map((x,i)=>{let b=document.createElement('button');b.textContent=x+' '+(items[eq[i]]?.[1]||'空');b.onclick=()=>{$('info').textContent=items[eq[i]]?.[2]||'未装備'};return b}));$('loot').replaceChildren(...bag.map(i=>{let b=document.createElement('button');b.textContent=(has(i)?'✓ ':'')+items[i][1]+'｜'+items[i][2];b.style.borderColor=has(i)?'#b89aff':'#55546b';b.onclick=()=>{eq[items[i][0]]=i;persist();render();$('info').textContent=items[i][1]+' 装備'};return b}))}function reset(){size();hp=100;kills=age=shots=clock=spawn=dropTime=0;depth=1;paused=dead=false;enemies=[];fx=[];$('retry').hidden=true;$('pause').textContent='一時停止';render()}function drop(){let pool=items.map((_,i)=>i).filter(i=>!bag.includes(i));if(!pool.length)return;let i=pool[Math.random()*pool.length|0];bag.unshift(i);persist();render();$('info').textContent='◆ 発見：'+items[i][1]+' / '+items[i][2]}function enemy(){let boss=depth%5===0&&!enemies.some(e=>e.boss),k=boss?2:Math.random()<.25?1:0,a=Math.random()*6.283,r=Math.hypot(W,H)/2;let max=(k===2?100:k===1?30:14)*(1+depth*.24);enemies.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,k,boss,hp:max,max,poison:0})}function hurt(e,n){e.hp-=n;fx.push({x:e.x,y:e.y,n:Math.round(n),t:.45});}function attack(){if(!enemies.length)return;shots++;let sorted=[...enemies].sort((a,b)=>Math.hypot(a.x-W/2,a.y-H/2)-Math.hypot(b.x-W/2,b.y-H/2));let crit=Math.random()<(has(4)?.4:.1),d=(12+(has(0)?8:0)+(has(14)?kills*.25:0))*(has(13)?1+(100-hp)/40:1)*(crit?2:1);for(let e of sorted.slice(0,has(1)?2:1)){hurt(e,d*(has(6)&&e.k>0?2:1));if(has(3)&&e.hp<e.max*.25)e.hp=0;if(has(16))e.poison=3;if(crit&&has(5))hurt(e,d);if(crit&&has(7))hp=Math.min(100,hp+3);if(crit&&has(19))for(let a of enemies)if(Math.hypot(a.x-e.x,a.y-e.y)<65)hurt(a,d*.5)}if(has(2)&&shots%3===0||has(12)&&shots%5===0)for(let e of enemies)hurt(e,d*.65)}function frame(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;if(!paused&&!dead){age+=dt;depth=1+Math.floor(age/20);spawn-=dt;if(spawn<=0&&enemies.length<65){enemy();spawn=Math.max(.25,1.2-depth*.06)}clock-=dt;if(clock<=0){attack();clock=.65/(has(8)?1.6:1)/(has(10)?1+Math.min(3,age/40):1)}if(has(15))hp=Math.min(100,hp+dt*2);for(let e of enemies){let dx=W/2-e.x,dy=H/2-e.y,d=Math.hypot(dx,dy)||1;if(d>20){e.x+=dx/d*(e.k===1?47:30)*dt;e.y+=dy/d*(e.k===1?47:30)*dt}else hp-=dt*(e.boss?12:3);if(e.poison>0){e.poison-=dt;e.hp-=dt*7}}for(let e of enemies.filter(e=>e.hp<=0)){kills++;if(has(9))hp=Math.min(100,hp+4);if(has(11)||has(17))for(let a of enemies)if(a.hp>0&&Math.hypot(a.x-e.x,a.y-e.y)<75)hurt(a,has(11)?15:8);if(kills===3||Math.random()<(has(18)?.28:.14))drop()}enemies=enemies.filter(e=>e.hp>0);if(age-dropTime>25){drop();dropTime=age}if(hp<=0){hp=0;dead=true;best=Math.max(best,kills);persist();$('retry').hidden=false;$('info').textContent='死亡。装備は残る。再出撃せよ。'}}g.clearRect(0,0,W,H);for(let e of enemies){g.fillStyle=['#ad486b','#e6a45a','#b77bff'][e.k];let r=e.boss?15:7;g.fillRect(e.x-r,e.y-r,r*2,r*2);g.fillStyle='#fff';g.fillRect(e.x-3,e.y-2,2,2);g.fillRect(e.x+2,e.y-2,2,2);g.fillStyle='#f46';g.fillRect(e.x-r,e.y-r-4,r*2*Math.max(0,e.hp/e.max),2)}g.fillStyle='#a78bfa';g.fillRect(W/2-10,H/2-12,20,24);g.fillStyle='#fff';g.fillRect(W/2-6,H/2-5,4,4);g.fillRect(W/2+2,H/2-5,4,4);for(let f of fx){g.globalAlpha=Math.max(0,f.t/.45);g.fillStyle='#ffe49a';g.font='bold 12px monospace';g.fillText(f.n,f.x,f.y);f.y-=dt*24;f.t-=dt}fx=fx.filter(f=>f.t>0);g.globalAlpha=1;$('hp').value=hp;$('depth').textContent='深度 '+depth;$('stats').textContent='HP '+Math.ceil(hp)+' / 100 ｜ 撃破 '+kills+' ｜ 装備 '+bag.length+'/20';requestAnimationFrame(frame)}$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止'};$('retry').onclick=reset;reset();requestAnimationFrame(frame);
</script></html>
