<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>連鎖狂 / CHAIN CHAOS</title><style>*{box-sizing:border-box}body{margin:0;background:#080912;color:white;font:16px monospace;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:absolute;top: max(20px,env(safe-area-inset-top));left:20px;right:20px;pointer-events:none}h1{font-size:18px;letter-spacing:.2em;margin:0}#score{font-size:56px;font-weight:bold}#best{color:#aaa}#hint{position:absolute;bottom:12%;width:100%;text-align:center;pointer-events:none;letter-spacing:.12em}button{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);background:#fff;color:#111;border:0;padding:14px 32px;font:bold 16px monospace;border-radius:4px}button[hidden]{display:none}</style><canvas></canvas><div id="hud"><h1>連鎖狂 / CHAIN CHAOS</h1><div id="score">0</div><div id="best"></div></div><div id="hint">好きな場所を一度タップ</div><button hidden>もう一度</button><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),score=document.querySelector('#score'),hint=document.querySelector('#hint'),btn=document.querySelector('button'),bestEl=document.querySelector('#best');let w,h,dots=[],waves=[],sparks=[],state=0,n=0,best=0,last=0,ac,shake=0;try{best=+localStorage.chainChaosBest||0}catch{};const colors=['#ff487e','#52faff','#ffe55b','#a67aff','#71ff9b'];function resize(){w=innerWidth;h=c.clientHeight;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();function reset(){dots=Array.from({length:130},()=>({x:Math.random()*w,y:100+Math.random()*Math.max(100,h-200),vx:(Math.random()-.5)*45,vy:(Math.random()-.5)*45,col:colors[Math.random()*5|0],r:3+Math.random()*4}));waves=[];sparks=[];n=0;state=0;score.textContent='0';bestEl.textContent='BEST '+best;hint.textContent='好きな場所を一度タップ';btn.hidden=true}reset();function tone(){try{if(!ac)return;let o=ac.createOscillator(),a=ac.createGain(),t=ac.currentTime;o.type='triangle';o.frequency.value=220*2**((n%24)/12);a.gain.setValueAtTime(.035,t);a.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(a);a.connect(ac.destination);o.start();o.stop(t+.13)}catch{}}function blast(x,y,col,root=false){waves.push({x,y,col,t:0,max:root?75:35+Math.random()*25});for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,v=30+Math.random()*170;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:1,col})}shake=Math.min(12,shake+1.5)}c.addEventListener('pointerdown',e=>{if(state)return;try{ac ||=new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}state=1;hint.textContent='CHAIN REACTION';blast(e.clientX,e.clientY,'#ffffff',true)});btn.onclick=reset;addEventListener('resize',()=>{resize();reset()});function frame(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;g.globalCompositeOperation='source-over';g.fillStyle='rgba(8,9,18,.24)';g.fillRect(0,0,w,h);g.save();g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;for(let p of dots){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<5||p.x>w-5)p.vx*=-1;if(p.y<100||p.y>h-80)p.vy*=-1;p.x=Math.max(5,Math.min(w-5,p.x));p.y=Math.max(100,Math.min(h-80,p.y));g.fillStyle=p.col;g.shadowColor=p.col;g.shadowBlur=10;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}g.shadowBlur=0;g.globalCompositeOperation='lighter';for(let a of [...waves]){a.t+=dt;let r=a.max*Math.min(1,a.t/.42);g.globalAlpha=Math.max(0,1-a.t/.85);g.strokeStyle=a.col;g.lineWidth=3;g.beginPath();g.arc(a.x,a.y,r,0,7);g.stroke();g.globalAlpha*=.14;g.fillStyle=a.col;g.fill();for(let i=dots.length-1;i>=0;i--){let p=dots[i];if(a.t<.65&&Math.hypot(p.x-a.x,p.y-a.y)<r+p.r){dots.splice(i,1);n++;score.textContent=n+' CHAIN';blast(p.x,p.y,p.col);tone()}}}waves=waves.filter(a=>a.t<.85);for(let p of sparks){p.t-=dt*1.6;p.x+=p.vx*dt;p.y+=p.vy*dt;g.globalAlpha=Math.max(0,p.t);g.fillStyle=p.col;g.fillRect(p.x,p.y,3,3)}sparks=sparks.filter(p=>p.t>0);g.globalAlpha=1;g.restore();if(state===1&&!waves.length){state=2;best=Math.max(best,n);try{localStorage.chainChaosBest=best}catch{}bestEl.textContent='BEST '+best;hint.textContent=n===130?'PERFECT CHAOS':n+' / 130';btn.hidden=false}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
