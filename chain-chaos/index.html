<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>連鎖狂 / ATOMIC CHAOS</title><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eee;font:15px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;pointer-events:none}h1{font: bold 18px monospace;margin:0;color:#9eeaff}#score{font:bold 42px monospace}#hint{color:#b9cbdc}footer{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:8px}button{background:#142437;color:white;border:1px solid #52748b;border-radius:8px;padding:12px;flex:1;font:inherit}button[hidden]{display:none}dialog{background:#101d30;color:white;border:1px solid #52748b;width:min(94vw,540px);max-height:80dvh;border-radius:12px}#grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}#grid span{padding:6px 0;text-align:center;background:#263b50;font:12px monospace}#grid .locked{opacity:.25}small{color:#a9bdcf}</style><canvas></canvas><header><h1>連鎖狂 / ATOMIC CHAOS</h1><div id="score">0</div><div id="hint">原子の近くを一度タップ</div></header><footer><button id="again" hidden>次の実験</button><button id="dex">物質・元素図鑑</button></footer><dialog><button id="close">閉じる</button><h2>物質図鑑</h2><div id="materials"></div><h2>元素図鑑</h2><small>原子番号順 / 実験で回収した元素</small><div id="grid"></div><p><small>実在する化学式を使用。結合・元素出現はゲーム用の架空モデルです。</small></p></dialog><script>
const $=s=>document.querySelector(s),c=$('canvas'),g=c.getContext('2d'),symbols='H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' '),common='H H H H O O O C C N Na Cl Si S Fe He'.split(' '),recipes=[['H₂O','水',{H:2,O:1},'#52cfff'],['CO₂','二酸化炭素',{C:1,O:2},'#dbe8ff'],['NaCl','塩化ナトリウム',{Na:1,Cl:1},'#fff1a0'],['O₃','オゾン',{O:3},'#ba86ff'],['NH₃','アンモニア',{N:1,H:3},'#7cffae'],['SiO₂','二酸化ケイ素',{Si:1,O:2},'#b9faff'],['CH₄','メタン',{C:1,H:4},'#ffae66'],['H₂S','硫化水素',{H:2,S:1},'#e8db66'],['C₆H₁₂O₆','グルコース',{C:6,H:12,O:6},'#ff91d5']];let saved={elements:[],materials:[]};try{saved=JSON.parse(localStorage.atomicChaos)||saved}catch{}let w,h,atoms=[],waves=[],sparks=[],inventory={},events=[],state=0,count=0,last=0,ac;function color(s){return ({H:'#e7f3ff',O:'#ff6689',C:'#9aa7c1',N:'#829aff',Na:'#ffc36b',Cl:'#79ffa4',Si:'#71e2de',S:'#e8d760'})[s]||'#c49bff'}function size(){w=innerWidth;h=c.clientHeight;let d=Math.min(devicePixelRatio,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}function reset(){size();atoms=Array.from({length:100},()=>{let s=Math.random()<.09?symbols[Math.random()*118|0]:common[Math.random()*common.length|0];return {s,x:18+Math.random()*(w-36),y:115+Math.random()*Math.max(40,h-210),vx:(Math.random()-.5)*38,vy:(Math.random()-.5)*38}});waves=[];sparks=[];events=[];inventory={};state=count=0;$('#score').textContent='0';$('#hint').textContent='原子の近くを一度タップ';$('#again').hidden=true}function save(){try{localStorage.atomicChaos=JSON.stringify(saved)}catch{}}function blast(x,y,col,r=55){waves.push({x,y,col,r,t:0});for(let i=0;i<10;i++){let a=Math.random()*6.28,v=30+Math.random()*110;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:1,col})}}function tone(){try{let o=ac.createOscillator(),a=ac.createGain(),t=ac.currentTime;o.frequency.value=220*2**((count%24)/12);a.gain.setValueAtTime(.018,t);a.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(a);a.connect(ac.destination);o.start();o.stop(t+.11)}catch{}}function collect(p){count++;inventory[p.s]=(inventory[p.s]||0)+1;if(!saved.elements.includes(p.s))saved.elements.push(p.s);blast(p.x,p.y,color(p.s));tone();for(let [f,n,need,col] of [...recipes].reverse()){if(Object.entries(need).every(([s,k])=>(inventory[s]||0)>=k)){for(let [s,k] of Object.entries(need))inventory[s]-=k;if(!saved.materials.includes(f))saved.materials.push(f);events.push({f,n,t:2,col});blast(p.x,p.y,col,95)}}save();$('#score').textContent=count+' ATOMS'}c.onpointerdown=e=>{if(state)return;try{ac||=new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}state=1;blast(e.clientX,e.clientY,'#fff',75);$('#hint').textContent='REACTION IN PROGRESS'};$('#again').onclick=reset;$('#dex').onclick=()=>{$('#materials').replaceChildren(...recipes.map(([f,n])=>{let p=document.createElement('p');p.textContent=saved.materials.includes(f)?f+' / '+n:'？？？';return p}));$('#grid').replaceChildren(...symbols.map((s,i)=>{let p=document.createElement('span');p.textContent=(i+1)+' '+s;p.className=saved.elements.includes(s)?'':'locked';return p}));$('dialog').showModal()};$('#close').onclick=()=>$('dialog').close();addEventListener('resize',reset);reset();function frame(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;g.fillStyle='rgba(8,13,24,.3)';g.fillRect(0,0,w,h);for(let p of atoms){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<14||p.x>w-14)p.vx*=-1;if(p.y<105||p.y>h-75)p.vy*=-1;p.x=Math.max(14,Math.min(w-14,p.x));p.y=Math.max(105,Math.min(h-75,p.y));g.strokeStyle=color(p.s);g.fillStyle='#101d30';g.beginPath();g.arc(p.x,p.y,12,0,7);g.fill();g.stroke();g.fillStyle=color(p.s);g.font='bold 11px monospace';g.textAlign='center';g.fillText(p.s,p.x,p.y+4)}for(let a of [...waves]){a.t+=dt;let r=a.r*Math.min(1,a.t/.45);g.globalAlpha=Math.max(0,1-a.t/.8);g.strokeStyle=a.col;g.lineWidth=2;g.beginPath();g.arc(a.x,a.y,r,0,7);g.stroke();g.globalAlpha=1;for(let i=atoms.length-1;i>=0;i--)if(a.t<.65&&Math.hypot(atoms[i].x-a.x,atoms[i].y-a.y)<r){collect(atoms.splice(i,1)[0])}}waves=waves.filter(a=>a.t<.8);for(let p of sparks){p.t-=dt*1.5;p.x+=p.vx*dt;p.y+=p.vy*dt;g.globalAlpha=Math.max(0,p.t);g.fillStyle=p.col;g.fillRect(p.x,p.y,3,3)}sparks=sparks.filter(p=>p.t>0);g.globalAlpha=1;for(let [i,e] of events.slice(-3).entries()){g.globalAlpha=Math.min(1,e.t);g.fillStyle=e.col;g.font='bold 25px monospace';g.fillText(e.f+' '+e.n,w/2,h*.42+i*32)}for(let e of events)e.t-=dt;events=events.filter(e=>e.t>0);g.globalAlpha=1;if(state===1&&!waves.length){state=2;$('#hint').textContent='元素 '+saved.elements.length+'/118 ｜ 物質 '+saved.materials.length+'/'+recipes.length;$('#again').hidden=false}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
