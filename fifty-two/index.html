<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>52 / FIFTY-TWO · DEV</title><style>body{margin:0;background:#101014;color:#f2eadc;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #454047}h1{font-size:26px;letter-spacing:2px}.muted{color:#aaa0a3}button{background:#29252b;color:#f7e9d9;border:1px solid #75646b;border-radius:10px;padding:12px;cursor:pointer}button:disabled{opacity:.4}button:focus-visible{outline:3px solid #e6b96a}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.game{min-height:120px;text-align:left}.card{display:inline-flex;align-items:center;justify-content:center;flex-direction:column;background:#f8f2e9;color:#15151b;width:49px;height:74px;margin:3px;border-radius:6px;font-weight:bold;font-size:21px;box-shadow:0 2px 6px #0007}.red{color:#bd2340}.back{background:#293d59;color:#fff}.selected{outline:3px solid #f3c45e}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.columns{display:flex;gap:4px;overflow:auto}.column{min-width:55px;display:flex;flex-direction:column;align-items:center}.column .card{margin-bottom:-36px}.column button:last-child{margin-top:44px}.panel{padding:15px;background:#1b191e;border-radius:12px;margin:12px 0}.hidden{display:none}.status{min-height:32px;color:#e8c98a}</style><main><header><div><h1>52 / FIFTY-TWO</h1><p class="muted">DEVELOPMENT BUILD · バグ検証用</p></div><span>♠ ♥ ♦ ♣</span></header><section id="menu"><h2>ゲームを選択</h2><div class="games" id="games"></div><p class="muted">現在は「忘却」の基本操作を先行検証中。他4作品は準備中。既存作品には影響しません。</p></section><section id="play" class="hidden"><div class="row"><button id="home">← 戻る</button><button id="restart">新しい局</button></div><h2 id="title"></h2><div class="row"><button id="slow">じっくり</button><button id="fast">サクサク</button></div><div class="panel"><p id="status" class="status"></p><div id="stats"></div><div id="board"></div></div><p class="muted" id="help"></p></section></main><script>'use strict';const $=id=>document.getElementById(id),names=['墓標','共犯','13時','四王国','忘却'],suits=['♠','♥','♦','♣'];let state=null,lock=false,timer=null;function deck(){return suits.flatMap((s,si)=>Array.from({length:13},(_,i)=>({s,si,r:i+1,id:si*13+i+1})))}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){try{localStorage.setItem('fifty-two-dev-save',JSON.stringify(state))}catch(e){}}function showMenu(){$('menu').classList.remove('hidden');$('play').classList.add('hidden')}function newGame(i=4,mode='slow'){clearTimeout(timer);lock=false;let d=shuffle(deck());if(mode==='fast'){d=shuffle(Array.from({length:8},(_,i)=>[d.find(c=>c.si===0&&c.r===i+1),d.find(c=>c.si===1&&c.r===i+1)]).flat())}state={i,mode,cards:d,open:[],peek:true,peekUntil:Date.now()+(mode==='fast'?8000:30000),fails:0,score:0,streak:0,exchanges:0,done:false,msg:'カードを覚えよう'};save();render();schedulePeek()}function schedulePeek(){clearTimeout(timer);if(!state||!state.peek)return;let remaining=state.peekUntil-Date.now();if(remaining<=0){state.peek=false;save();render();return}timer=setTimeout(()=>{if(state?.peek&&Date.now()>=state.peekUntil){state.peek=false;save();render()}},remaining)}function btn(text,cb,cls=''){let b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=cb;return b}function render(){if(!state)return;$('menu').classList.add('hidden');$('play').classList.remove('hidden');$('title').textContent=names[state.i];$('slow').disabled=state.mode==='slow';$('fast').disabled=state.mode==='fast';$('status').textContent=state.msg+(state.done?' · 終局':'');$('stats').textContent='得点 '+state.score+' ｜ 失敗 '+state.fails+' ｜ 消去 '+state.cards.filter(c=>c===null).length+'/'+state.cards.length;$('help').textContent='最初にカードを記憶。2枚をめくり、同ランクまたは同スート連番なら消去。成功後は残りのカード2枚が位置交換する。サクサクは失敗5回で終了。';let board=$('board');board.replaceChildren();board.style.display='grid';board.style.gridTemplateColumns='repeat('+ (state.mode==='fast'?4:Math.min(13,Math.max(4,Math.floor((window.innerWidth-55)/57))))+',minmax(0,1fr))';state.cards.forEach((c,i)=>{let visible=state.peek||state.open.includes(i),b=btn(c===null?'':visible?(({'1':'A','11':'J','12':'Q','13':'K'}[c.r]||c.r)+c.s):'✧',()=>flip(i),'card'+(visible&&c&&[1,2].includes(c.si)?' red':'')+(!visible?' back':'')+(state.open.includes(i)?' selected':''));b.disabled=c===null||state.done||state.peek||lock;board.append(b)});save()}function flip(i){if(!state||state.peek||state.done||lock||state.cards[i]===null||state.open.includes(i))return;state.open.push(i);if(state.open.length<2){render();return}let [a,b]=state.open,c=state.cards[a],d=state.cards[b];if(c.r===d.r||(c.si===d.si&&Math.abs(c.r-d.r)===1)){state.score+=(c.r===d.r?10:15)+state.streak*5;state.streak++;state.cards[a]=state.cards[b]=null;state.open=[];state.exchanges++;if(state.mode==='slow'||state.exchanges%2===0){let ids=state.cards.map((v,j)=>v?j:-1).filter(j=>j>=0);if(ids.length>=2){let x=ids.splice(Math.floor(Math.random()*ids.length),1)[0],y=ids[Math.floor(Math.random()*ids.length)];[state.cards[x],state.cards[y]]=[state.cards[y],state.cards[x]];state.msg='位置 '+(x+1)+' と '+(y+1)+' が交換された'}else state.msg='消去成功'}else state.msg='消去成功';if(state.cards.every(v=>v===null)){state.done=true;state.msg='全消去！ 勝利'}}else{state.fails++;state.streak=0;state.msg='不一致';if(state.mode==='fast'&&state.fails>=5){state.done=true;state.msg='失敗回数上限'}else{lock=true;render();timer=setTimeout(()=>{lock=false;if(state&&!state.done){state.open=[];render()}},650);return}}render()}$('games').replaceChildren(...names.map((n,i)=>btn(n+' · '+(i===4?'プレイ可能':'準備中'),()=>newGame(i),'game')));Array.from($('games').children).forEach((b,i)=>b.disabled=i!==4);$('home').onclick=showMenu;$('restart').onclick=()=>{if(confirm('現在の局を破棄しますか？'))newGame(state.i,state.mode)};$('slow').onclick=()=>{if(confirm('局をリセットしてじっくりモードにしますか？'))newGame(state.i,'slow')};$('fast').onclick=()=>{if(confirm('局をリセットしてサクサクモードにしますか？'))newGame(state.i,'fast')};try{let s=JSON.parse(localStorage.getItem('fifty-two-dev-save'));if(s&&s.i===4&&Array.isArray(s.cards)){state=s;state.open=[];render();schedulePeek();showMenu()}}catch(e){localStorage.removeItem('fifty-two-dev-save')}</script></html>
