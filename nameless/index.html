<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無名の神話</title><style>*{box-sizing:border-box}body{margin:0;background:#111619;color:#e1e3d9;font:14px system-ui}main{max-width:600px;margin:auto;padding:12px}h1{font-size:24px;margin:8px 0}small{color:#a2ad9f}#resources{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.res,button,article{background:#20282b;border:1px solid #394640;border-radius:6px;padding:10px;color:inherit}.res b{display:block;font-size:18px}button{font:inherit;cursor:pointer}button:disabled{opacity:.4}nav{display:flex;gap:5px;margin:12px 0}nav button{flex:1;padding:9px 3px}button.active{border-color:#b9ce9e;color:#d4e8b7}article{margin:6px 0}article button{width:100%;text-align:left}progress{width:100%;height:7px;accent-color:#b9ce9e}p{margin:8px 0}#log{font-size:12px;color:#a8b6a4;max-height:100px;overflow:auto}a{color:#b9ce9e}</style><main><small>NAMELESS / v0.01</small><h1>無名の神話</h1><p id="chapter"></p><div id="resources"></div><nav id="nav"></nav><div id="panel"></div><article id="log"></article><small>自動保存・オフライン進行対応</small>　<a href="../author/">作品一覧</a></main><script>
const $=x=>document.getElementById(x),fresh=()=>({r:{hp:10,wood:0,food:3,gold:0,knowledge:0,str:0,herb:0},lv:{},xp:{},flags:{},action:'rest',progress:0,mem:0,lives:0,log:['名前もないあなたは、小さな村で目を覚ました。'],time:Date.now()});let s=fresh();try{let a=JSON.parse(localStorage.nameless01);if(a&&a.r&&a.flags)s=a}catch{}let tab=0;const names={hp:'体力',wood:'薪',food:'食料',gold:'金貨',knowledge:'知識',str:'筋力',herb:'薬草'};const cap=k=>({hp:10+(s.flags.bed?5:0)+Math.floor(s.r.str/5),wood:s.flags.shed?60:15,food:s.flags.shed?40:12,gold:9999,knowledge:100,str:100,herb:20})[k];const actions=[['rest','休む',2,{}, {hp:3},()=>true],['wood','薪を拾う',3,{hp:1},{wood:2},()=>true],['food','木の実を探す',4,{hp:2},{food:3},()=>true],['eat','食事',1,{food:1},{hp:6},()=>true],['read','本を読む',5,{hp:1,wood:1},{knowledge:2},()=>s.flags.school],['work','村の手伝い',5,{hp:2,wood:2},{gold:3},()=>s.flags.work],['train','剣の稽古',6,{hp:3,food:1},{str:2},()=>s.flags.sword],['forest','森を探索',8,{hp:4,food:1},{herb:2,gold:4},()=>s.flags.forest],['medicine','薬草を調合',4,{herb:1},{hp:10},()=>s.flags.forest]];const say=x=>{s.log.unshift(x);s.log=s.log.slice(0,20)};const can=c=>Object.entries(c).every(([k,v])=>s.r[k]>=v);const pay=c=>Object.entries(c).forEach(([k,v])=>s.r[k]-=v);const gain=c=>Object.entries(c).forEach(([k,v])=>s.r[k]=Math.min(cap(k),s.r[k]+v));const duration=a=>a[2]/(1+Math.min(2,(s.lv[a[0]]||0)*.08)+s.mem*.05);const milestones=[['work','村人の信頼',{wood:6},'薪を届けると、村の仕事を紹介された。'],['school','古い本',{gold:6},'文字を学ぶことができるようになった。'],['bed','寝床を整える',{wood:10,gold:3},'最大体力が増えた。'],['shed','物置を建てる',{wood:12,gold:8},'薪と食料の貯蔵上限が増えた。'],['sword','剣を借りる',{knowledge:6,gold:9},'剣の稽古が解禁された。'],['forest','森への許可',{str:8,knowledge:10},'村の外へ出られるようになった。'],['friend','森の精霊と契約',{herb:6,gold:12},'精霊が木の実を集めてくれる。'],['end','旅立ち',{str:16,knowledge:20,herb:8,gold:20},'あなたは村を旅立った。新しい人生へ進める。']];function tick(dt){if(s.flags.friend){s.pass=(s.pass||0)+dt;if(s.pass>=15){gain({food:Math.floor(s.pass/15)});s.pass%=15}}let a=actions.find(a=>a[0]===s.action);if(!a||!a[5]())return;if(!can(a[3]))return;if(Object.entries(a[4]).every(([k])=>s.r[k]>=cap(k)))return;s.progress+=dt;let d=duration(a);if(s.progress>=d){s.progress-=d;pay(a[3]);gain(a[4]);s.xp[a[0]]=(s.xp[a[0]]||0)+1;if(s.xp[a[0]]>=5+(s.lv[a[0]]||0)*3){s.xp[a[0]]=0;s.lv[a[0]]=(s.lv[a[0]]||0)+1;say(a[1]+'の習熟 Lv'+s.lv[a[0]])}}}function save(){s.time=Date.now();try{localStorage.nameless01=JSON.stringify(s)}catch{}}function render(){ $('chapter').textContent=s.flags.end?'第一章 完 / 旅立ち':s.flags.forest?'第一章 / 森の向こう':'第一章 / 名もなき村';$('resources').innerHTML=Object.keys(names).filter(k=>k!=='herb'||s.flags.forest).map(k=>'<div class="res"><small>'+names[k]+'</small><b>'+s.r[k]+' / '+cap(k)+'</b></div>').join('');$('nav').innerHTML=['行動','物語','仲間','記憶'].map((n,i)=>'<button class="'+(tab===i?'active':'')+'" data-tab="'+i+'">'+n+'</button>').join('');let p=$('panel');if(tab===0)p.innerHTML=actions.filter(a=>a[5]()).map(a=>'<article><button data-action="'+a[0]+'" class="'+(s.action===a[0]?'active':'')+'">'+a[1]+'　Lv'+(s.lv[a[0]]||0)+'<br><small>'+Object.entries(a[3]).map(([k,v])=>names[k]+' −'+v).concat(Object.entries(a[4]).map(([k,v])=>names[k]+' ＋'+v)).join('　')+' / '+duration(a).toFixed(1)+'秒</small></button>'+(s.action===a[0]?'<progress max="1" value="'+Math.min(1,s.progress/duration(a))+'"></progress><small>'+(!can(a[3])?'資源不足：待機中':'自動反復中')+'</small>':'')+'</article>').join('');if(tab===1)p.innerHTML=milestones.filter((m,i)=>!s.flags[m[0]]&&(i===0||s.flags.work)&&(m[0]!=='forest'||s.flags.sword)&&(m[0]!=='friend'&&m[0]!=='end'||s.flags.forest)).map(m=>'<article><button data-story="'+m[0]+'" '+(!can(m[2])?'disabled':'')+'>'+m[1]+'<br><small>'+Object.entries(m[2]).map(([k,v])=>names[k]+' '+v).join('　')+'</small></button></article>').join('')||'<p>村での物語を終えた。</p>';if(tab===2)p.innerHTML=s.flags.friend?'<article>森の精霊<br><small>15秒ごとに食料＋1</small></article>':'<p>まだ仲間はいない。森を探索しよう。</p>';if(tab===3)p.innerHTML='<article>前世の記憶 '+s.mem+'<br>人生 '+(s.lives+1)+'<p>記憶1につき行動速度＋5%。</p><button data-rebirth '+(!s.flags.end?'disabled':'')+'>転生する</button></article>'; $('log').textContent=s.log.slice(0,4).join(' ／ ')}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab!==undefined)tab=+b.dataset.tab;if(b.dataset.action){s.action=b.dataset.action;s.progress=0}if(b.dataset.story){let m=milestones.find(m=>m[0]===b.dataset.story);if(m&&!s.flags[m[0]]&&can(m[2])){pay(m[2]);s.flags[m[0]]=true;say(m[3])}}if(b.hasAttribute('data-rebirth')&&s.flags.end&&confirm('村での資源と能力を手放し、記憶を継承しますか？')){let m=s.mem+1,l=s.lives+1;s=fresh();s.mem=m;s.lives=l;tab=0}save();render()});let offline=Math.min(28800,Math.max(0,(Date.now()-s.time)/1000));for(let i=0;i<offline;i+=.5)tick(Math.min(.5,offline-i));if(offline>60)say('留守の間も、選択した行動を続けた。');save();render();let last=Date.now(),counter=0;setInterval(()=>{let now=Date.now(),dt=Math.min(28800,(now-last)/1000);last=now;for(let i=0;i<dt;i+=.5)tick(Math.min(.5,dt-i));render();if(++counter%10===0)save()},500);addEventListener('pagehide',save);
</script></html>
