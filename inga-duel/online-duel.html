<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>因果決闘 | 通信対戦テスト</title><style>
:root{font-family:system-ui,sans-serif;background:#101019;color:#f5f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:auto;padding:14px}h1{font-size:23px;color:#ffe070}.panel{background:#231e2d;border:1px solid #574861;border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}button,input{font:inherit;border-radius:9px;padding:11px}button{background:#51415d;color:white;border:1px solid #8a7696}button.primary{background:#ffe070;color:#17121b;font-weight:bold}button:disabled{opacity:.4}input{width:100%;background:#14111b;color:white;border:1px solid #83718e;font-size:20px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cards button{text-align:left}select{width:100%;font:inherit;padding:12px;border-radius:9px;background:#14111b;color:white;border:1px solid #83718e;margin:8px 0}#deckPreview{margin:8px 0;line-height:1.7}#relicOffer{padding:12px;border:1px solid #ffe070;border-radius:12px;margin:12px 0}.cards small{display:block;color:#ccc;margin-top:5px}.hidden{display:none}.muted{color:#c9c0d0;font-size:13px}.code{color:#ffe070;font-size:24px;letter-spacing:.08em;overflow-wrap:anywhere}.invite{display:flex;gap:8px;flex-wrap:wrap}.invite button{flex:1;min-width:130px}button{touch-action:manipulation;min-height:44px}.hp{color:#ff9da3;font-weight:bold}#notice{color:#ffe070;min-height:24px}.fx-layer{position:fixed;inset:0;z-index:90;pointer-events:none;display:grid;place-items:center;overflow:hidden}.fx-burst{font-weight:1000;font-size:clamp(42px,12vw,92px);color:#fff;text-shadow:0 0 20px var(--fx),0 0 60px var(--fx);animation:impact .9s ease-out both;text-align:center;max-width:95vw;overflow-wrap:anywhere}.fx-layer:before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle,var(--fx),transparent 58%);opacity:.35;animation:flash .8s both}.fx-layer.fx-ruin{--fx:#ff3c70}.fx-layer.fx-guard{--fx:#32e3e0}.fx-layer.fx-fate{--fx:#b66bff}.fx-layer.fx-blood{--fx:#ed1835}.fx-layer.fx-victory{--fx:#ffe16c}.fx-layer.fx-defeat{--fx:#ff2854}.fx-layer.fx-draw{--fx:#a0a0c4}@keyframes impact{0%{transform:scale(.2) rotate(-15deg);opacity:0;filter:blur(15px)}30%{transform:scale(1.2) rotate(3deg);opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:0}}@keyframes flash{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(2)}}#resultOverlay{position:fixed;inset:0;z-index:100;background:rgba(8,5,17,.91);display:grid;place-items:center;padding:20px}#resultOverlay.hidden{display:none}#resultPanel{text-align:center;border:2px solid #f8d16b;background:linear-gradient(135deg,#281b3d,#120e1c);border-radius:24px;padding:32px 20px;box-shadow:0 0 80px #9a3dff88;width:min(95vw,480px);animation:resultIn .6s both}#resultTitle{font-size:clamp(48px,13vw,82px);font-weight:1000;letter-spacing:.1em;text-shadow:0 0 35px #ffc34a}#resultOverlay.defeat #resultPanel{border-color:#f44;box-shadow:0 0 80px #f448}#resultOverlay.defeat #resultTitle{color:#ff6177}#resultOverlay.draw #resultTitle{color:#ddd}@keyframes resultIn{from{transform:scale(.5) rotate(-7deg);opacity:0}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.fx-burst,.fx-layer:before,#resultPanel{animation:none}}.sound-controls{display:flex;gap:8px;justify-content:flex-end;margin:8px 0}.sound-controls button{font-size:13px;padding:7px 10px}.fx-layer.hidden{display:none}</style><div id="fxLayer" class="fx-layer hidden" aria-hidden="true"><div id="fxText" class="fx-burst"></div></div><div id="resultOverlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div id="resultPanel"><div id="resultTitle"></div><p id="resultDetail"></p><button id="resultDismiss" class="primary">戦績を確認する</button><button id="resultNew">新しい対戦へ</button></div></div><main>
<h1>因果決闘 ∞ PARADOX</h1><div class="sound-controls"><button id="bgmToggle">♫ BGM OFF</button><button id="sfxToggle">🔊 効果音 ON</button></div><p class="muted">β1.3.0 遠隔テスト版。WebSocket優先、通信不調時はHTTP同期。</p>
<section class="panel" id="setup"><h2>合言葉で対戦</h2><label for="code">ひらがな8文字</label><input id="code" maxlength="8" placeholder="せかいのおわりに" autocomplete="off"><label for="theme">使用デッキ（各職業30枚すべて使用）</label><select id="theme"></select><div id="deckPreview" class="muted"></div><details><summary>全30枚のカード一覧</summary><div id="deckBuilder" class="cards"></div></details><p class="row"><button class="primary" id="create">部屋を作る</button><button id="join">部屋に参加</button></p></section>
<section class="panel hidden" id="waiting"><h2>相手を待機中</h2><div class="code" id="roomCode"></div><p class="muted">この画面のまま待機できます。相手が参加すると自動で始まります。</p><p class="invite"><button id="share" class="primary">📨 招待リンクを送る</button><button id="copyCode">合言葉をコピー</button></p><p class="muted">招待リンクには合言葉だけが含まれます。認証用の秘密情報は含みません。</p></section>
<section class="panel hidden" id="battle"><div class="row"><b id="phase"></b><span id="revision"></span></div><div class="row"><div>相手<div class="hp" id="oppHp"></div><div id="oppBlock"></div></div><div>あなた<div class="hp" id="selfHp"></div><div id="selfBlock"></div></div></div><p id="resource"></p><div class="cards" id="hand"></div><p class="row"><button id="skill">職業スキル ⚡2</button><button id="end" class="primary">ターン終了</button></p><div id="relics" class="muted"></div><p>因果は補助資源。好きな用途に消費できます。</p><div class="row"><button id="fateEnergy">因果2→⚡+1</button><button id="fateDraw">因果3→1枚引く</button><button id="fateGuard">因果4→防御+7</button></div><section id="relicOffer" class="hidden"><h3>✨ レリック獲得：3択から1つ選択</h3><div class="cards" id="relicChoices"></div></section><h3>行動履歴</h3><div id="log" class="muted"></div></section>
<section class="panel"><p id="notice" role="status"></p><button id="leave">この端末の接続を解除</button></section>
</main><script src="cards.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),KEY='inga-online-session-v1';
let session=null,revision=0,busy=false,ws=null,retryAt=0,pending=false,lastView=null,pendingSince=0,seenLog=0,seenResult=false,fxTimer=null,audio=null,bgmTimer=null,bgmOn=false,sfxOn=true;
const themeSelect=$('theme');
for(const theme of duelThemes){const opt=document.createElement('option');opt.value=theme.id;opt.textContent=theme.name+' / '+theme.description;themeSelect.append(opt)}
let deckIds=[];
function selectedCards(){const theme=duelThemes.find(t=>t.id===themeSelect.value)||duelThemes[0];return theme.cards.map(id=>cards.find(c=>c.id===id))}
const deck=()=>selectedCards().map(c=>c.id);
function updatePreview(){
 $('deckPreview').textContent='全30種類を各1枚使用する職業デッキ。';
 $('deckBuilder').replaceChildren(...selectedCards().map(card=>{const p=document.createElement('div');p.className='panel';p.textContent=card.name+' ◆'+card.cost+' / '+card.desc;return p}));
}
function resetDeck(){updatePreview()}
themeSelect.onchange=resetDeck;resetDeck();
const validCode=value=>/^[ぁ-ゖ]{8}$/u.test(value.normalize('NFKC'));
function inviteUrl(){const url=new URL(location.href);url.searchParams.set('code',session.code);return url.toString()}
async function copyText(value){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);return true}return false}
function show(id){for(const name of ['setup','waiting','battle'])$(name).classList.toggle('hidden',name!==id)}
function note(msg){$('notice').textContent=msg}
async function api(route,data){
 const response=await fetch('/api/'+route,{method:data===undefined?'GET':'POST',headers:{...(data===undefined?{}:{'content-type':'application/json'}),...(session?{'authorization':'Bearer '+session.token}:{})},body:data===undefined?undefined:JSON.stringify(data),cache:'no-store'});
 const result=await response.json();if(!result.ok)throw Error(result.reason||'request_failed');return result;
}

function audioContext(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch(_){return null}}
function tone(freq,duration=.12,kind='sine',volume=.04,delay=0){const ac=audioContext();if(!ac||!sfxOn&&!bgmOn)return;const osc=ac.createOscillator(),gain=ac.createGain(),t=ac.currentTime+delay;osc.type=kind;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(volume,t);gain.gain.exponentialRampToValueAtTime(.001,t+duration);osc.connect(gain).connect(ac.destination);osc.start(t);osc.stop(t+duration+.01)}
function playBgmBeat(){if(!bgmOn)return;const notes=[110,164.81,130.81,196,146.83,220,130.81,164.81];const i=(playBgmBeat.i=(playBgmBeat.i||0)+1);const ac=audioContext();if(!ac)return;const osc=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;osc.type='triangle';osc.frequency.value=notes[i%notes.length];g.gain.setValueAtTime(.018,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);osc.connect(g).connect(ac.destination);osc.start(t);osc.stop(t+.33)}
$('bgmToggle').onclick=()=>{bgmOn=!bgmOn;$('bgmToggle').textContent=bgmOn?'♫ BGM ON':'♫ BGM OFF';if(bgmOn){audioContext();playBgmBeat();bgmTimer=setInterval(playBgmBeat,380)}else{clearInterval(bgmTimer);bgmTimer=null}};
$('sfxToggle').onclick=()=>{sfxOn=!sfxOn;$('sfxToggle').textContent=sfxOn?'🔊 効果音 ON':'🔇 効果音 OFF'};
function fxFor(e){if(e.type==='play'){const n=e.name||'',id=e.cardId||0;if(/血|痛|不死|献|殉|涙/.test(n))return ['fx-blood','🩸 '+n];if(/守護|盾|壁|金剛|防御/.test(n))return ['fx-guard','🛡️ '+n];if(/因果|量子|予|接続|分岐/.test(n))return ['fx-fate','🌀 '+n];return ['fx-ruin',(['⚔️','💥','🔥','⚡','🌠','🗡️'][id%6])+' '+n]}if(e.type==='skill')return ['fx-fate','✦ 職業スキル'];if(e.type==='relic')return ['fx-victory','✨ '+e.name];return null}
function flashFx(kind,label,large=false){const layer=$('fxLayer');layer.className='fx-layer '+kind;$('fxText').textContent=label;clearTimeout(fxTimer);fxTimer=setTimeout(()=>layer.classList.add('hidden'),large?1500:900);if(sfxOn){const f=kind==='fx-guard'?350:kind==='fx-fate'?560:kind==='fx-blood'?140:kind==='fx-victory'?660:230;tone(f,.17,'sawtooth',.035);tone(f*1.5,.2,'triangle',.025,.1)}}
function showResult(v){if(seenResult||!v.over)return;seenResult=true;const won=v.winner===session.seat,draw=v.winner===null,el=$('resultOverlay');el.className=draw?'draw':won?'victory':'defeat';$('resultTitle').textContent=draw?'引き分け':won?'勝 利':'敗 北';$('resultDetail').textContent='第'+v.turn+'ターン決着 · あなた HP '+v.player.hp+' / 相手 HP '+v.opponent.hp;flashFx(draw?'fx-draw':won?'fx-victory':'fx-defeat',draw?'DRAW':won?'VICTORY':'DEFEAT',true)}
$('resultDismiss').onclick=()=>$('resultOverlay').classList.add('hidden');
$('resultNew').onclick=()=>{$('resultOverlay').classList.add('hidden');$('leave').click()};

function render(state){
 const oldRevision=revision;revision=state.revision;lastView=state;const v=state.view,me=v.player,op=v.opponent,turn=v.active===session.seat;
 if(v.log.length){const last=v.log[v.log.length-1];const stamp=v.turn+':'+v.log.length+':'+(last.name||last.type);if(oldRevision!==revision&&seenLog!==stamp){seenLog=stamp;const effect=fxFor(last);if(effect&&!v.over)flashFx(...effect)}}
 show('battle');$('phase').textContent=v.over?'決闘終了':turn?'あなたのターン':'相手のターン';$('revision').textContent='第'+v.turn+'ターン';
 $('selfHp').textContent='HP '+me.hp+'/'+me.maxHp;$('oppHp').textContent='HP '+op.hp+'/'+op.maxHp;
 $('selfBlock').textContent='防御 '+me.block;$('oppBlock').textContent='防御 '+op.block;
 $('resource').textContent='⚡ '+me.energy+'　因果 '+me.fate+'　山札 '+me.deckCount+'　相手手札 '+op.handCount+'枚';
 $('hand').replaceChildren(...me.hand.map(card=>{const b=document.createElement('button');b.disabled=busy||pending||!turn||v.over||v.relicPending||card.cost>me.energy;const title=document.createElement('b');title.textContent=card.name+' ◆'+card.cost;const desc=document.createElement('small');desc.textContent=card.desc;b.append(title,desc);b.onclick=()=>act({type:'play',uid:card.uid});return b}));
 $('end').disabled=busy||pending||!turn||v.over||v.relicPending;$('skill').disabled=busy||pending||!turn||v.over||v.relicPending||me.energy<2||me.skillUsed;for(const [id,cost] of [['fateEnergy',2],['fateDraw',3],['fateGuard',4]])$(id).disabled=busy||pending||!turn||v.over||v.relicPending||me.fate<cost;
 $('skill').textContent='✦ '+({ruin:'破滅：4ダメージ＋防御2削り',guard:'守護：防御+6・瀕死時回復2',fate:'因果：因果+2・条件ドロー',blood:'血盟：HP-3・⚡+3・次ターン⚡-1'}[me.job]||'職業スキル')+'（⚡2、各ターン1回）';
 $('relics').textContent='✨ あなたのレリック：'+(v.relics?.[session.seat]?.map(r=>r.name).join(' / ')||'なし');
 const offer=$('relicOffer');offer.classList.toggle('hidden',!v.relicOffer);
 $('relicChoices').replaceChildren(...(v.relicOffer||[]).map(r=>{const b=document.createElement('button');b.disabled=busy||pending;b.textContent=r.name+'：'+r.desc;b.onclick=()=>act({type:'relic',id:r.id});return b}));
 if(v.over)showResult(v);
 $('log').replaceChildren(...v.log.slice(-16).reverse().map(e=>{const p=document.createElement('p');const who=e.seat===session.seat?'あなた':'相手';let detail=e.type==='play'?'「'+(e.name||'カード')+'」を使用':e.type==='end_turn'?'ターン終了':e.type==='relic'?'レリック「'+e.name+'」を獲得':e.type==='fate'||e.type==='skill'?e.name+'を使用':e.type;
 if(e.type==='play'){if(e.damage)detail+=' / '+e.damage+'ダメージ';if(e.block)detail+=' / 防御+'+e.block;if(e.healing)detail+=' / HP+'+e.healing;if(e.selfDamage)detail+=' / 自傷'+e.selfDamage;if(e.fate>0)detail+=' / 因果+'+e.fate}
 if(e.energySpent)detail+=' / ⚡'+e.energySpent+'消費';if(e.type==='income')detail='ターン開始：因果+1';if(e.type==='limit')detail=e.name;
 p.textContent='第'+e.turn+'ターン · '+who+'：'+detail;return p}));
}
function connectSocket(){
 if(!session||ws||Date.now()<retryAt)return;
 const socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws=socket;
 socket.onopen=()=>{if(ws===socket)socket.send(JSON.stringify({type:'hello',token:session.token}))};
 socket.onmessage=event=>{if(ws!==socket)return;let msg;try{msg=JSON.parse(event.data)}catch(_){return}
  if(msg.type==='state'){pending=false;pendingSince=0;if(msg.status==='waiting'){show('waiting');$('roomCode').textContent=session.code}else if(msg.view)render(msg);note('リアルタイム接続中')}
  else if(msg.type==='rejected'){pending=false;pendingSince=0;note('操作できません：'+msg.reason);socket.send(JSON.stringify({type:'sync'}))}
  else if(msg.type==='error')note('通信エラー：'+msg.reason)
 };
 socket.onclose=()=>{if(ws===socket){ws=null;pending=false;pendingSince=0;retryAt=Date.now()+3000;note('再接続待ち（HTTP同期に切り替え）')}};
 socket.onerror=()=>socket.close();
}
async function sync(){
 if(!session||busy)return;
 if(pending&&Date.now()-pendingSince>7000){pending=false;pendingSince=0;if(ws){ws.close();ws=null}note('応答が遅いため再同期します')}
 if(ws&&ws.readyState===WebSocket.OPEN)return;
 connectSocket();
 try{const state=await api('status');if(state.status==='waiting'){show('waiting');$('roomCode').textContent=session.code;note('対戦相手を待っています');return}render(state);note('接続中')}catch(e){if(e.message==='unauthorized'){session=null;sessionStorage.removeItem(KEY);if(ws){ws.close();ws=null}show('setup');note('接続期限が切れました。新しい部屋を作成してください')}else note('通信状態：'+e.message)}
}
async function begin(route){
 if(busy)return;
 const input=$('code').value.normalize('NFKC');if(!validCode(input)){note('合言葉はひらがな8文字で入力してください');return}
 
 busy=true;
 try{const result=await api(route,{code:input,deck:deck()});if(ws){ws.close();ws=null}pending=false;pendingSince=0;lastView=null;seenResult=false;seenLog=0;session={token:result.token,seat:result.seat,code:result.code};sessionStorage.setItem(KEY,JSON.stringify(session));note('ルームに接続しました');await syncForced()}catch(e){note('接続できません：'+e.message)}finally{busy=false;if(lastView)render(lastView)}
}
async function syncForced(){const state=await api('status');pending=false;pendingSince=0;if(state.status==='waiting'){show('waiting');$('roomCode').textContent=session.code}else render(state)}
async function act(action){
 if(busy||pending||!session)return;busy=true;
 try{if(ws&&ws.readyState===WebSocket.OPEN){pending=true;pendingSince=Date.now();ws.send(JSON.stringify({type:'action',revision,action}));if(lastView)render(lastView);note('行動を送信しました')}else{await api('action',{revision,action});await syncForced();note('行動を送信しました')}}catch(e){note('操作できません：'+e.message);try{await syncForced()}catch(_){}}finally{busy=false;if(lastView)render(lastView)}
}
$('share').onclick=async()=>{if(!session)return;const url=inviteUrl();try{if(navigator.share){await navigator.share({title:'因果決闘 ∞ PARADOX',text:'合言葉：'+session.code,url});return}if(await copyText(url)){note('招待リンクをコピーしました');return}note('招待リンク：'+url)}catch(e){if(e.name!=='AbortError')note('共有できません：'+e.message)}};
$('copyCode').onclick=async()=>{if(!session)return;try{if(await copyText(session.code))note('合言葉をコピーしました');else note('合言葉：'+session.code)}catch(e){note('合言葉：'+session.code)}};
$('create').onclick=()=>begin('create');$('join').onclick=()=>begin('join');
$('end').onclick=()=>act({type:'end_turn'});$('skill').onclick=()=>act({type:'skill'});$('fateEnergy').onclick=()=>act({type:'fate',mode:'energy'});$('fateDraw').onclick=()=>act({type:'fate',mode:'draw'});$('fateGuard').onclick=()=>act({type:'fate',mode:'guard'});
$('leave').onclick=()=>{if(ws){ws.close();ws=null}pending=false;pendingSince=0;lastView=null;seenResult=false;$('resultOverlay').classList.add('hidden');session=null;sessionStorage.removeItem(KEY);show('setup');note('この端末の接続情報を消去しました。部屋は期限まで残ります。')};
try{const saved=JSON.parse(sessionStorage.getItem(KEY));if(saved&&typeof saved.token==='string'&&[0,1].includes(saved.seat))session=saved}catch(_){}
const inviteCode=new URLSearchParams(location.search).get('code');if(inviteCode&&validCode(inviteCode))$('code').value=inviteCode.normalize('NFKC');
if(session)sync();setInterval(sync,2000);
</script></html>
