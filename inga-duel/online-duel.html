<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>因果決闘 | 通信対戦テスト</title><style>
:root{font-family:system-ui,sans-serif;background:#101019;color:#f5f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:auto;padding:14px}h1{font-size:23px;color:#ffe070}.panel{background:#231e2d;border:1px solid #574861;border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}button,input{font:inherit;border-radius:9px;padding:11px}button{background:#51415d;color:white;border:1px solid #8a7696}button.primary{background:#ffe070;color:#17121b;font-weight:bold}button:disabled{opacity:.4}input{width:100%;background:#14111b;color:white;border:1px solid #83718e;font-size:20px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cards button{text-align:left}.cards small{display:block;color:#ccc;margin-top:5px}.hidden{display:none}.muted{color:#c9c0d0;font-size:13px}.code{color:#ffe070;font-size:24px;letter-spacing:.08em}.hp{color:#ff9da3;font-weight:bold}#notice{color:#ffe070;min-height:24px}</style><main>
<h1>因果決闘 ∞ PARADOX</h1><p class="muted">β0.8.4 ローカル通信試験。サーバー起動時のみ利用可能。WebSocket優先。接続できない場合はHTTPで同期します。</p>
<section class="panel" id="setup"><h2>合言葉で対戦</h2><label for="code">ひらがな8文字</label><input id="code" maxlength="8" placeholder="せかいのおわりに" autocomplete="off"><p class="row"><button class="primary" id="create">部屋を作る</button><button id="join">部屋に参加</button></p></section>
<section class="panel hidden" id="waiting"><h2>相手を待機中</h2><div class="code" id="roomCode"></div><p class="muted">相手が同じ合言葉を入力すると始まります。</p></section>
<section class="panel hidden" id="battle"><div class="row"><b id="phase"></b><span id="revision"></span></div><div class="row"><div>相手<div class="hp" id="oppHp"></div><div id="oppBlock"></div></div><div>あなた<div class="hp" id="selfHp"></div><div id="selfBlock"></div></div></div><p id="resource"></p><div class="cards" id="hand"></div><p class="row"><button id="fate">⚡ 因果断絶</button><button id="end" class="primary">ターン終了</button></p><h3>行動履歴</h3><div id="log" class="muted"></div></section>
<section class="panel"><p id="notice" role="status"></p><button id="leave">この端末の接続を解除</button></section>
</main><script src="cards.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),KEY='inga-online-session-v1';
let session=null,revision=0,busy=false,ws=null,retryAt=0,pending=false,lastView=null;
const deck=()=>starter.map(c=>c.id);
function show(id){for(const name of ['setup','waiting','battle'])$(name).classList.toggle('hidden',name!==id)}
function note(msg){$('notice').textContent=msg}
async function api(route,data){
 const response=await fetch('/api/'+route,{method:data===undefined?'GET':'POST',headers:{...(data===undefined?{}:{'content-type':'application/json'}),...(session?{'authorization':'Bearer '+session.token}:{})},body:data===undefined?undefined:JSON.stringify(data),cache:'no-store'});
 const result=await response.json();if(!result.ok)throw Error(result.reason||'request_failed');return result;
}
function render(state){
 revision=state.revision;lastView=state;const v=state.view,me=v.player,op=v.opponent,turn=v.active===session.seat;
 show('battle');$('phase').textContent=v.over?'決闘終了':turn?'あなたのターン':'相手のターン';$('revision').textContent='第'+v.turn+'ターン';
 $('selfHp').textContent='HP '+me.hp+'/'+me.maxHp;$('oppHp').textContent='HP '+op.hp+'/'+op.maxHp;
 $('selfBlock').textContent='防御 '+me.block;$('oppBlock').textContent='防御 '+op.block;
 $('resource').textContent='⚡ '+me.energy+'　因果 '+me.fate+'/6　山札 '+me.deckCount+'　相手手札 '+op.handCount+'枚';
 $('hand').replaceChildren(...me.hand.map(card=>{const b=document.createElement('button');b.disabled=busy||pending||!turn||v.over||card.cost>me.energy;const title=document.createElement('b');title.textContent=card.name+' ◆'+card.cost;const desc=document.createElement('small');desc.textContent=card.desc;b.append(title,desc);b.onclick=()=>act({type:'play',uid:card.uid});return b}));
 $('end').disabled=busy||pending||!turn||v.over;$('fate').disabled=busy||pending||!turn||v.over||me.fate<6;
 $('log').replaceChildren(...v.log.slice(-8).reverse().map(e=>{const p=document.createElement('p');p.textContent='T'+e.turn+' P'+(e.seat+1)+' '+e.type;return p}));
}
function connectSocket(){
 if(!session||ws||Date.now()<retryAt)return;
 const socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws=socket;
 socket.onopen=()=>{if(ws===socket)socket.send(JSON.stringify({type:'hello',token:session.token}))};
 socket.onmessage=event=>{if(ws!==socket)return;let msg;try{msg=JSON.parse(event.data)}catch(_){return}
  if(msg.type==='state'){pending=false;if(msg.status==='waiting'){show('waiting');$('roomCode').textContent=session.code}else if(msg.view)render(msg);note('リアルタイム接続中')}
  else if(msg.type==='rejected'){pending=false;note('操作できません：'+msg.reason);socket.send(JSON.stringify({type:'sync'}))}
  else if(msg.type==='error')note('通信エラー：'+msg.reason)
 };
 socket.onclose=()=>{if(ws===socket){ws=null;pending=false;retryAt=Date.now()+3000;note('再接続待ち（HTTP同期に切り替え）')}};
 socket.onerror=()=>socket.close();
}
async function sync(){
 if(!session||busy)return;
 if(ws&&ws.readyState===WebSocket.OPEN)return;
 connectSocket();
 try{const state=await api('status');if(state.status==='waiting'){show('waiting');$('roomCode').textContent=session.code;note('対戦相手を待っています');return}render(state);note('接続中')}catch(e){note('通信状態：'+e.message)}
}
async function begin(route){
 if(busy)return;busy=true;
 try{const result=await api(route,{code:$('code').value,deck:deck()});if(ws){ws.close();ws=null}pending=false;lastView=null;session={token:result.token,seat:result.seat,code:result.code};sessionStorage.setItem(KEY,JSON.stringify(session));note('ルームに接続しました');await syncForced()}catch(e){note('接続できません：'+e.message)}finally{busy=false}
}
async function syncForced(){const state=await api('status');pending=false;if(state.status==='waiting'){show('waiting');$('roomCode').textContent=session.code}else render(state)}
async function act(action){
 if(busy||pending||!session)return;busy=true;
 try{if(ws&&ws.readyState===WebSocket.OPEN){pending=true;ws.send(JSON.stringify({type:'action',revision,action}));if(lastView)render(lastView);note('行動を送信しました')}else{await api('action',{revision,action});await syncForced();note('行動を送信しました')}}catch(e){note('操作できません：'+e.message);try{await syncForced()}catch(_){}}finally{busy=false}
}
$('create').onclick=()=>begin('create');$('join').onclick=()=>begin('join');
$('end').onclick=()=>act({type:'end_turn'});$('fate').onclick=()=>act({type:'fate'});
$('leave').onclick=()=>{if(ws){ws.close();ws=null}pending=false;lastView=null;session=null;sessionStorage.removeItem(KEY);show('setup');note('この端末の接続情報を消去しました。部屋は期限まで残ります。')};
try{const saved=JSON.parse(sessionStorage.getItem(KEY));if(saved&&typeof saved.token==='string'&&[0,1].includes(saved.seat))session=saved}catch(_){}
if(session)sync();setInterval(sync,2000);
</script></html>
