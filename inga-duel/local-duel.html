<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>因果決闘 | ローカル対戦</title><style>
:root{font-family:system-ui,sans-serif;color:#f4f0e9;background:#111019}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:14px}h1{font-size:22px;color:#ffdf64}.panel{background:#211e2d;border:1px solid #494052;border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}button{border:1px solid #83718f;background:#3c314e;color:white;border-radius:10px;padding:11px;cursor:pointer;font-weight:700}button:disabled{opacity:.35}button.primary{background:#ffdf64;color:#181322;border:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cards button{text-align:left;min-height:88px}.cards small{display:block;font-weight:400;margin-top:6px;color:#ddd}.hint{font-size:12px;color:#bfb7cd}.hp{color:#ff929a;font-weight:800}.hidden{display:none}.log{font-size:12px;max-height:130px;overflow:auto}#notice{color:#ffe37d}a{color:#ffe37d}</style><main><h1>因果決闘 ∞ PARADOX</h1><p class="hint">ローカル2人対戦・試験版。1台の端末を交互に渡して遊ぶ。オンライン通信は未実装。</p><p><a href="./">← CPU戦・因果巡礼に戻る</a></p><section class="panel"><div class="row"><b id="phase">準備中</b><button id="restart">新しい決闘</button></div><p id="notice" role="status"></p><button id="reveal" class="primary">自分の手札を表示</button></section><section id="arena" class="hidden"><section class="panel"><div class="row"><div><b id="oppName"></b><div class="hp" id="oppHp"></div><div id="oppBlock"></div></div><div><b id="selfName"></b><div class="hp" id="selfHp"></div><div id="selfBlock"></div></div></div><p id="resource"></p></section><section class="panel"><div id="hand" class="cards"></div><div class="row" style="margin-top:12px"><button id="fate">⚡ 因果断絶</button><button id="end" class="primary">ターン終了</button></div></section><section class="panel"><b>行動ログ</b><div id="log" class="log"></div></section></section></main><script src="battle-core.js"></script><script src="battle-rules.js"></script><script src="cards.js"></script><script src="duel-engine.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);let match=null,revealed=false;
function deck(){return Array.from({length:3},()=>starter.map(c=>c)).flat()}
function start(){match=IngaDuel.createMatch([deck(),deck()],{seed:Math.floor(Math.random()*4294967296)});revealed=false;render()}
function act(action){const r=IngaDuel.apply(match,match.state.active,action);if(!r.ok){$('notice').textContent='操作できません: '+r.reason;return}if(action.type==='end_turn'||match.state.over)revealed=false;render()}
function render(){const s=match.state,seat=s.active,view=IngaDuel.publicView(match,seat),me=view.player,op=view.opponent;
 $('phase').textContent=s.over?(s.winner===null?'相討ち':'勝者：プレイヤー'+(s.winner+1)):'プレイヤー'+(seat+1)+' のターン';
 $('notice').textContent=s.over?'決闘終了。新しい決闘を開始できます。':revealed?'カードを選んで行動しよう。':'端末をプレイヤー'+(seat+1)+'に渡してから手札を表示。';
 $('reveal').classList.toggle('hidden',revealed||s.over);$('arena').classList.toggle('hidden',!revealed||s.over);
 if(!revealed||s.over)return;
 $('oppName').textContent='相手：プレイヤー'+(2-seat);$('selfName').textContent='あなた：プレイヤー'+(seat+1);
 $('oppHp').textContent='HP '+op.hp+'/40';$('selfHp').textContent='HP '+me.hp+'/40';$('oppBlock').textContent='防御 '+op.block;$('selfBlock').textContent='防御 '+me.block;
 $('resource').textContent='⚡ '+me.energy+' エネルギー　因果 '+me.fate+'/6　山札 '+me.deckCount+'　相手手札 '+op.handCount+'枚';
 $('hand').replaceChildren(...me.hand.map(c=>{const b=document.createElement('button');b.disabled=c.cost>me.energy;const title=document.createElement('b');title.textContent=c.name+' ◆'+c.cost;const desc=document.createElement('small');desc.textContent=c.desc;b.append(title,desc);b.onclick=()=>act({type:'play',uid:c.uid});return b}));
 $('fate').disabled=me.fate<6;$('log').replaceChildren(...view.log.slice().reverse().map(x=>{const d=document.createElement('div');d.textContent='T'+x.turn+' P'+(x.seat+1)+' '+(x.type==='play'?(cards.find(c=>c.id===x.cardId)||starter.find(c=>c.id===x.cardId))?.name||'カード':x.type);return d}));
}
$('reveal').onclick=()=>{revealed=true;render()};$('end').onclick=()=>act({type:'end_turn'});$('fate').onclick=()=>act({type:'fate'});$('restart').onclick=()=>{if(match&&!match.state.over&&!confirm('進行中の対戦を終了しますか？'))return;start()};start();
</script></html>
