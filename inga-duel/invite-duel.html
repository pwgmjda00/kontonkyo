<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>因果決闘 | 招待対戦UI試作</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101019;color:#f7f3e8}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:16px}h1{font-size:23px;color:#ffdc5c;margin:8px 0}.muted{color:#c6bfd0;font-size:13px}.panel{background:#211d2b;border:1px solid #52435c;border-radius:16px;padding:15px;margin:13px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}button,input{font:inherit;border-radius:11px;padding:12px}button{background:#493753;color:white;border:1px solid #81698a;cursor:pointer;font-weight:700}button.primary{background:#ffdc5c;color:#16121b;border:0}button:disabled{opacity:.4}input{width:100%;background:#16131d;color:white;border:1px solid #84718d;font-size:20px;letter-spacing:.08em}label{display:block;margin:10px 0 5px}small{color:#c5bfd0}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cards button{text-align:left;min-height:92px}.cards small{display:block;margin-top:5px}.hp{color:#ff909c;font-weight:800}.code{font-size:25px;letter-spacing:.1em;color:#ffdc5c;overflow-wrap:anywhere}.log{max-height:130px;overflow:auto;font-size:12px}a{color:#ffdc5c}#notice{min-height:24px;color:#ffdf7a}</style></head><body><main>
<h1>因果決闘 ∞ PARADOX</h1><p class="muted">β0.8.3 招待対戦UIのローカル試作。2人分の操作を1台で確認できます。<b>別端末通信はまだできません。</b></p><p><a href="./">← 因果巡礼へ戻る</a></p>
<section class="panel" id="setup"><h2>合言葉で決闘</h2><label for="invite">好きなひらがな8文字</label><input id="invite" maxlength="8" placeholder="せかいのおわり" autocomplete="off" inputmode="text"><p class="muted">例：せかいのおわりに（8文字）</p><button class="primary" id="create">部屋を作る</button><p id="notice" role="status"></p></section>
<section class="panel hidden" id="waiting"><h2>対戦相手を待っています</h2><p>合言葉：<b id="code" class="code"></b></p><p class="muted">この試作では下のボタンで相手の参加を再現します。</p><button id="join" class="primary">2人目として参加（ローカル試験）</button><button id="cancel">部屋を閉じる</button></section>
<section class="panel hidden" id="battle"><div class="row"><b id="phase"></b><button id="switch">相手側に切り替える</button></div><p id="battleNotice" role="status"></p><div class="row"><div><b>相手</b><div id="oppHp" class="hp"></div><div id="oppBlock"></div></div><div><b>あなた</b><div id="selfHp" class="hp"></div><div id="selfBlock"></div></div></div><p id="resource"></p><div id="hand" class="cards"></div><div class="row" style="margin-top:12px"><button id="fate">⚡ 因果断絶</button><button class="primary" id="end">ターン終了</button></div><h3>行動履歴</h3><div class="log" id="log"></div><p><button id="exit">部屋を閉じる</button></p></section>
</main><script src="battle-core.js"></script><script src="battle-rules.js"></script><script src="cards.js"></script><script src="duel-engine.js"></script><script src="match-journal.js"></script><script src="room-core.js"></script><script src="lobby-core.js"></script><script>
'use strict';
const $=id=>document.getElementById(id), deck=()=>starter.map(c=>c.id), catalog=[...cards,...starter];
const lobby=IngaLobby.createLobby({catalog,randomBytes:n=>crypto.getRandomValues(new Uint8Array(n)),ttlMs:60*60*1000});
let host=null,guest=null,seat=0,revision=0;
function show(which){for(const id of ['setup','waiting','battle'])$(id).classList.toggle('hidden',id!==which)}
function token(){return seat===0?host?.token:guest?.token}
function state(){return lobby.status(token())}
function render(){
 const result=state();if(!result.ok){$('battleNotice').textContent='部屋が終了しました';return}
 if(result.status!=='playing'&&result.status!=='finished')return;
 revision=result.revision;const v=result.view,me=v.player,op=v.opponent;
 $('phase').textContent='プレイヤー'+(seat+1)+(v.over?'：決闘終了':v.active===seat?'：あなたのターン':'：相手のターン');
 $('battleNotice').textContent=v.over?'決闘終了':v.active===seat?'カードを選んで行動しよう':'相手の行動待ち';
 $('selfHp').textContent='HP '+me.hp+'/40';$('oppHp').textContent='HP '+op.hp+'/40';
 $('selfBlock').textContent='防御 '+me.block;$('oppBlock').textContent='防御 '+op.block;
 $('resource').textContent='エネルギー '+me.energy+'　因果 '+me.fate+'/6　山札 '+me.deckCount+'　相手手札 '+op.handCount+'枚';
 $('hand').replaceChildren(...me.hand.map(c=>{const b=document.createElement('button');b.disabled=v.over||v.active!==seat||c.cost>me.energy;const title=document.createElement('b');title.textContent=c.name+' ◆'+c.cost;const desc=document.createElement('small');desc.textContent=c.desc;b.append(title,desc);b.onclick=()=>act({type:'play',uid:c.uid});return b}));
 $('end').disabled=v.over||v.active!==seat;$('fate').disabled=v.over||v.active!==seat||me.fate<6;
 $('log').replaceChildren(...v.log.slice().reverse().map(e=>{const p=document.createElement('p');p.textContent='T'+e.turn+' P'+(e.seat+1)+' '+e.type;return p}));
}
function act(action){const r=lobby.action(token(),revision,action);if(!r.ok){$('battleNotice').textContent='操作できません：'+r.reason;render();return}render()}
$('create').onclick=()=>{const r=lobby.create(deck(),$('invite').value);if(!r.ok){$('notice').textContent=({invalid_code:'ひらがな8文字で入力してね',code_taken:'その合言葉は使用中',room_limit:'満室です'})[r.reason]||r.reason;return}host=r;guest=null;seat=0;$('code').textContent=r.code;show('waiting')};
$('join').onclick=()=>{const r=lobby.join(host.code,deck());if(!r.ok){$('notice').textContent=r.reason;return}guest=r;seat=0;show('battle');render()};
$('switch').onclick=()=>{seat=1-seat;render()};
$('end').onclick=()=>act({type:'end_turn'});$('fate').onclick=()=>act({type:'fate'});
function exit(){if(host)lobby.close(host.token);host=null;guest=null;seat=0;show('setup')}
$('cancel').onclick=exit;$('exit').onclick=exit;
</script></body></html>
