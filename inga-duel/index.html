:root{font-family:system-ui,-apple-system,sans-serif;background:#0d0d14;color:#f5f2e9}*{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:auto;padding:12px 12px 50px}h1{font-size:22px;margin:8px 0;color:#ffde50;letter-spacing:.03em}.sub{color:#9d9bae;font-size:12px}.panel{background:#1b1a26;border:1px solid #39364b;border-radius:14px;padding:13px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.hp{font-weight:800;color:#ff888b}.block{color:#91d8ff;font-size:13px}.intent{background:#31263b;border:1px solid #8d5b9e;border-radius:12px;padding:12px;margin:10px 0}.intent b{color:#ffd06a}.hint{font-size:12px;color:#b8b4c7}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:#29263a;color:white;border:1px solid #68607d;border-radius:12px;padding:12px;text-align:left;min-height:110px}.card strong{display:block;font-size:15px;margin-bottom:6px}.card span{font-size:12px;line-height:1.5;color:#d3cddd}.card:disabled{opacity:.32}.card .cost{float:right;color:#ffdb64}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{touch-action:manipulation;cursor:pointer}button.primary{background:#ffdf56;color:#191522;border:0;border-radius:10px;padding:12px;font-weight:800}button.secondary{background:#363149;color:white;border:1px solid #79708e;border-radius:10px;padding:12px;font-weight:700}button:disabled{opacity:.35;cursor:default}.energy{color:#9ce5ff;font-weight:800}.fate{color:#e5b2ff;font-weight:800}.log{max-height:150px;overflow:auto;font-size:12px;line-height:1.6}.log div{padding:4px 0;border-bottom:1px solid #383447}.tag{font-size:11px;border-radius:4px;padding:2px 5px;background:#49354d;color:#f5c8ff}.end{font-size:18px;font-weight:900;color:#ffdc64}.meter{height:7px;background:#363142;border-radius:7px;overflow:hidden;margin:7px 0}.meter i{display:block;background:#bb7eff;height:100%;transition:width .2s}

.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{flex:1;padding:12px 5px;border:1px solid #665a79;border-radius:10px;background:#292437;color:#fff;font-weight:700}.tabs button.active{background:#ffde50;color:#18141b}.hidden{display:none!important}.packzone{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}.pack{width:180px;height:260px;border:2px solid #ffdf65;border-radius:12px;background:repeating-linear-gradient(135deg,#21192e,#21192e 12px,#30253c 13px,#30253c 25px);box-shadow:0 0 24px #dca5ff40;color:#ffde73;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;user-select:none;touch-action:pan-y}.pack .symbol{font-size:72px}.pack small{color:#e4c5f2}.pack.ripped{animation:rip .35s ease}@keyframes rip{50%{transform:rotate(-8deg) scale(1.06);opacity:.3}}.reveal{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;width:100%}.reveal button{min-height:152px;border-radius:11px;border:2px solid #696176;background:#30293e;color:white;padding:8px;display:flex;flex-direction:column;justify-content:center;gap:8px;overflow-wrap:anywhere}.reveal button.back{background:linear-gradient(145deg,#21192e,#4e3363);color:#ffe277;font-size:34px}.reveal button[data-tier="4"]{border-color:#ff7aca;box-shadow:0 0 16px #ff7aca80}.reveal button[data-tier="3"]{border-color:#f6c04e;box-shadow:0 0 12px #f6c04e55}.reveal button[data-tier="2"]{border-color:#bd85fa}.reveal button[data-tier="1"]{border-color:#69a8ff}.reveal button b{font-size:13px}.reveal button small{font-size:11px}.collection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:440px;overflow:auto}.entry{padding:9px;background:#272335;border:1px solid #514b61;border-radius:8px;font-size:12px}.entry.missing{opacity:.45}.entry b{display:block}.entry small{color:#bdb3cc}.counter{font-size:20px;font-weight:800;color:#ffe277}.toast{color:#ffdf79;min-height:20px;font-size:13px}
</style><main><h1>因果決闘 ∞ PARADOX</h1><div class="sub">β0.7.6 / CPU戦・敵の未来を公開 / オフライン</div>
<div class="tabs"><button id="tabBattle" class="active">⚔️ 対戦</button><button id="tabPack">🎁 開封</button><button id="tabCollection">📚 図鑑</button></div><div id="battleView"><p class="hint"><a href="local-duel.html" style="color:#ffdf64">⚔️ ローカル2人対戦（試験版）はこちら</a>　※1台を交互に操作</p><section class="panel"><div class="row"><button id="normalMode" class="secondary">通常CPU戦</button><button id="pilgrimageMode" class="primary">🗺️ 因果巡礼</button></div><div id="journey" class="hidden"><p id="journeyStatus" class="hint"></p><div id="journeyNodes" class="actions"></div><p id="relicStatus" class="hint"></p></div></section><section class="panel"><div class="row"><div><b>観測者</b><div class="hp" id="eh"></div><div class="block" id="eb"></div></div><div style="text-align:right"><b>あなた</b><div class="hp" id="ph"></div><div class="block" id="pb"></div></div></div><div class="intent"><div class="hint">🔮 観測された次の行動</div><b id="intent"></b><div class="hint" id="idesc"></div></div><div class="row"><span class="fate" id="fate"></span><span class="hint" id="round"></span></div><div class="meter"><i id="meter"></i></div></section>
<section class="panel"><div class="row"><span class="energy" id="energy"></span><span class="hint" id="deck"></span></div><p class="hint">カードを組み合わせて敵の予告を攻略。因果6で必殺技を使える。</p><div class="cards" id="hand"></div><div class="actions"><button id="end" class="primary">ターン終了 →</button><button id="fateBtn" class="secondary">⚡ 因果断絶（因果6）</button><button id="reset" class="secondary">最初から</button></div><p id="status" class="end"></p></section><section class="panel"><b>戦闘ログ</b><div id="log" class="log"></div></section></div><div id="packView" class="hidden"><section class="panel"><div class="row"><b>因果封筒</b><span id="packCount" class="counter"></span></div><p class="hint">1パック5枚。封筒を横にスワイプ、またはタップで開封。CPU勝利で2パック、敗北でも1パック。</p><div class="packzone"><button id="pack" class="pack"><small>PARADOX</small><span class="symbol">∞</span><b>ここを破れ</b><small>SWIPE / TAP</small></button><div id="reveal" class="reveal"></div><div id="packMessage" class="toast"></div><button class="secondary" id="allReveal">すべてめくる</button></div></section></div><div id="collectionView" class="hidden"><section class="panel"><div class="row"><b>カード図鑑</b><span id="ownedCount" class="counter"></span></div><p class="hint">スターター12種類×3枚の36枚デッキから開始。所持カードをタップするとスターター枠と交換。交換したカードは次のCPU戦から3枚ずつ入る。重複は欠片へ変換。</p><div id="starterSlots" class="collection"></div><p class="hint">▼ 入手カードをタップして装備・解除</p><div class="row"><span id="shards"></span><button id="craft" class="secondary">未所持交換（20欠片）</button></div><p class="hint" id="secret"></p><div id="collection" class="collection"></div></section></div></main>
<script src="battle-core.js"></script><script src="battle-rules.js"></script><script src="cards.js"></script><script>
const $=id=>document.getElementById(id),R=n=>Math.floor(Math.random()*n),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let p,e,turn,over,intent,logs,serial=0;
function hit(a,n){return IngaCore.damage(a,n)}
function draw(a,n){for(let i=0;i<n;i++){if(!a.deck.length){a.deck=shuffle(a.discard.splice(0));if(!a.deck.length)break}if(a.hand.length>=12)break;a.hand.push(a.deck.pop())}}
function add(s){logs.unshift(s);logs=logs.slice(0,40)}
function plan(){const pool=[{kind:'attack',value:12,name:'斬撃予告',desc:'防御しなければ12ダメージ'},{kind:'burst',value:20,name:'終末砲',desc:'防御しなければ20ダメージ'},{kind:'guard',value:16,name:'結界展開',desc:'防御16を獲得'},{kind:'drain',value:8,name:'生命吸収',desc:'8ダメージを与え、実際に与えた分だけ回復'},{kind:'attack',value:15,name:'神罰',desc:'防御しなければ15ダメージ'},{kind:'charge',value:0,name:'再構築',desc:'HPを10回復、ただし最大40'}];return {...pool[R(pool.length)]}}
function init(){if(journey&&!journey.finished&&!confirm('巡礼を終了して通常CPU戦に戻りますか？'))return;journey=null;beginBattle(40,40);renderJourney()}
function beginBattle(hp,enemyHp){p={hp,block:0,energy:5,fate:0,hand:[],deck:shuffle(makeBattleDeck()),discard:[]};e={hp:enemyHp,maxHp:enemyHp,block:0};turn=1;over=false;logs=[];intent=plan();if(journey&&journey.relics.includes('先制砲'))hit(e,6);if(journey&&journey.relics.includes('生命の泉'))p.hp=Math.min(40,p.hp+5);draw(p,5);add('決闘開始。敵の予告を見て行動しよう。');if(e.hp<=0)finish();render()}

function finish(){if(over)return true;if(p.hp<=0||e.hp<=0){over=true;if(journey){journeyBattleEnd(e.hp<=0&&p.hp>0)}else award(e.hp<=0&&p.hp>0?2:1);add(p.hp<=0&&e.hp<=0?'相討ち':e.hp<=0?'勝利！ 観測者を撃破した。':'敗北。因果は閉じた。');return true}return false}
function play(uid){if(over||journey&&(!journey.waiting||journey.finished))return;let i=p.hand.findIndex(c=>c.uid===uid);if(i<0)return;let c=p.hand[i];if(!IngaCore.validateAction({over,player:p},{type:'play',uid}).ok)return;const result=IngaRules.playCard(p,e,uid,{hit,draw,random:Math.random,get intent(){return intent},set intent(value){intent=value}});if(!result.ok)return;add('あなた：'+c.name+'。'+c.desc);finish();render()}
function enemy(){if(journey&&journey.waiting&&journey.combat==='boss'){const area=Math.floor(journey.stage/4)+1;if(area===1&&turn%3===0){hit(p,4);add('👑 第一観測者：時の棘 4ダメージ')}if(area===2&&turn%3===0){e.block+=8;add('👑 第二観測者：因果障壁 防御+8')}if(area===3&&turn%3===0){p.fate=Math.max(0,p.fate-2);add('👑 第三観測者：因果収奪 -2')}}const k=intent.kind;if(k==='attack'||k==='burst'){hit(p,intent.value);add('敵：'+intent.name+' '+intent.value+'ダメージ')}else if(k==='drain'){let before=p.hp;hit(p,intent.value);let dealt=Math.max(0,before-p.hp);e.hp=Math.min(e.maxHp||40,e.hp+dealt);add('敵：生命吸収 '+dealt+'吸収')}else if(k==='guard'){e.block+=intent.value;add('敵：防御'+intent.value)}else if(k==='charge'){e.hp=Math.min(e.maxHp||40,e.hp+10);add('敵：HP+10')}else add('敵：行動不能');finish()}
function endTurn(){if(over||journey&&(!journey.waiting||journey.finished))return;if(!IngaCore.validateAction({over,player:p},{type:'end_turn'}).ok)return;enemy();if(over){render();return}p.block=0;e.block=0;p.energy=5+(journey&&journey.relics.includes('永久機関')?1:0);p.discard.push(...p.hand.splice(0));draw(p,5);turn++;intent=plan();add('第'+turn+'ターン。新たな未来を観測。');render()}
function breakFate(){if(over||journey&&(!journey.waiting||journey.finished)||!IngaCore.validateAction({over,player:p},{type:'fate'}).ok)return;const fateResult=IngaRules.spendFate(p,e);if(!fateResult.ok)return;let before=intent.name;intent={kind:'none',name:'因果断絶',desc:'敵の行動は完全に消滅した'};add('⚡ 因果断絶！ '+before+'を消滅。敵に18ダメージ、エネルギー+2');finish();render()}

function ensureSlots(){if(!Array.isArray(profile.slots)||profile.slots.length!==12)profile.slots=[...STARTER_SLOTS];profile.slots=profile.slots.map((id,i)=>Number.isInteger(id)&&(id<0&&id>=-12||id>=0&&id<99&&profile.owned[id]>0)?id:STARTER_SLOTS[i])}
function swapCard(id){ensureSlots();const current=profile.slots.indexOf(id);if(current>=0){profile.slots[current]=STARTER_SLOTS[current]}else{if(!profile.owned[id])return;const free=profile.slots.findIndex(x=>x<0);if(free<0){$('secret').textContent='12枠すべて交換済み。外したいカードをタップしてから選ぼう。';return}profile.slots[free]=id}save();updateCollection()}

const STORE='inga-duel-beta04-v1';
const TIERS=['COMMON','RARE','EPIC','LEGEND','PARADOX'];
let profile;
function save(){try{localStorage.setItem(STORE,JSON.stringify(profile))}catch(err){$('packMessage').textContent='保存できません。ブラウザ設定を確認してください。'}}
function load(){try{const o=JSON.parse(localStorage.getItem(STORE)||'null');if(o&&Array.isArray(o.owned)&&o.owned.length===99){profile=o;ensureSlots();return}}catch(err){}profile={packs:3,owned:Array(99).fill(0),shards:0,opened:0,wins:0,losses:0};ensureSlots();save()}
function tier(id){if(id<40)return 0;if(id<70)return 1;if(id<88)return 2;if(id<97)return 3;return 4}
function makeBattleDeck(){ensureSlots();const pool=profile.slots.map(id=>id<0?starter[-id-1]:cards[id]);const deck=[];for(let i=0;i<3;i++)for(const c of pool)deck.push({...c,uid:++serial});return deck}
function award(n){if(profile){profile.packs+=n;if(n===2)profile.wins++;else profile.losses++;save();add('報酬：因果封筒 '+n+'パック獲得！')}}
function randomCard(){const x=Math.random()*100;const t=x<68?0:x<91?1:x<98.5?2:x<99.9?3:4;const pool=cards.filter(c=>tier(c.id)===t);return pool[R(pool.length)]}
let pulled=[],flipped=[],opening=false;
function openPack(){if(opening||profile.packs<1){$('packMessage').textContent=opening?'先にカードをめくろう':'封筒がない。CPU戦で獲得しよう。';return}profile.packs--;profile.opened++;pulled=Array.from({length:5},randomCard);flipped=Array(5).fill(false);opening=true;for(const c of pulled){if(profile.owned[c.id])profile.shards+=1+tier(c.id)*2;profile.owned[c.id]++}save();$('pack').classList.add('ripped');setTimeout(()=>{if(!opening)return;$('pack').classList.add('hidden');drawReveal()},350);$('packMessage').textContent='封筒を開封！カードをタップしてめくろう。';updateCollection()}
function drawReveal(){const root=$('reveal');root.replaceChildren(...pulled.map((c,i)=>{const b=document.createElement('button');if(!flipped[i]){b.className='back';b.textContent='∞';b.setAttribute('aria-label','カード'+(i+1)+'をめくる')}else{b.dataset.tier=tier(c.id);const n=document.createElement('b');n.textContent=c.name;const t=document.createElement('small');t.textContent=TIERS[tier(c.id)];const d=document.createElement('small');d.textContent=c.desc;b.append(t,n,d)}b.onclick=()=>{flipped[i]=true;drawReveal();if(flipped.every(Boolean)){finishOpening()}};return b}))}
function finishOpening(){$('packMessage').textContent='全5枚開封！ 次の封筒へ。';$('pack').classList.remove('hidden','ripped');opening=false;updateCollection()}
function showTab(tab){for(const t of ['Battle','Pack','Collection']){$('tab'+t).classList.toggle('active',t.toLowerCase()===tab);$(t.toLowerCase()+'View').classList.toggle('hidden',t.toLowerCase()!==tab)}updateCollection()}
function updateCollection(){ensureSlots();$('starterSlots').replaceChildren(...profile.slots.map((id,i)=>{const c=id<0?starter[-id-1]:cards[id];const d=document.createElement('div');d.className='entry';const n=document.createElement('b');n.textContent=(i+1)+'. '+c.name;const t=document.createElement('small');t.textContent=(id<0?'STARTER':'強化済み')+' ◆'+c.cost+' / '+c.desc;d.append(n,t);return d}));$('packCount').textContent=profile.packs+' パック';const owned=profile.owned.filter(x=>x>0).length;$('ownedCount').textContent=owned+' / 99';$('shards').textContent='欠片 '+profile.shards;$('craft').disabled=profile.shards<20||owned===99;$('secret').textContent=owned===99?'100 / 99  ▣ 観測不能なカードが存在する':'未観測のカードを集めよう。';$('collection').replaceChildren(...cards.map(c=>{let d=document.createElement('div');d.className='entry'+(profile.owned[c.id]?'':' missing');const n=document.createElement('b');n.textContent=profile.owned[c.id]?c.name:'???';const sub=document.createElement('small');sub.textContent=profile.owned[c.id]?TIERS[tier(c.id)]+' / 所持'+profile.owned[c.id]+' / '+c.desc:'#'+String(c.id+1).padStart(2,'0')+' 未発見';d.append(n,sub);if(profile.owned[c.id]){const btn=document.createElement('button');btn.className='secondary';btn.style.marginTop='6px';btn.textContent=profile.slots.includes(c.id)?'装備中・外す':'デッキに交換';btn.onclick=()=>swapCard(c.id);d.append(btn)}return d}))}
function craft(){if(profile.shards<20)return;const missing=cards.filter(c=>!profile.owned[c.id]);if(!missing.length)return;const c=missing[R(missing.length)];profile.shards-=20;profile.owned[c.id]=1;save();updateCollection();$('secret').textContent='交換成功：'+c.name}
$('tabBattle').onclick=()=>showTab('battle');$('tabPack').onclick=()=>showTab('pack');$('tabCollection').onclick=()=>showTab('collection');$('craft').onclick=craft;$('pack').onclick=openPack;let sx=0;$('pack').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});$('pack').addEventListener('touchend',e=>{if(Math.abs(e.changedTouches[0].clientX-sx)>35){e.preventDefault();openPack()}},{passive:false});$('allReveal').onclick=()=>{if(!opening)return;flipped.fill(true);drawReveal();finishOpening()};


let journey=null;
const EVENTS=[
{label:'⚔️ 決闘',kind:'battle'},
{label:'🛌 休息',kind:'rest'},
{label:'🎁 宝箱',kind:'chest'},
{label:'⚡ 危険な決闘',kind:'elite'},
{label:'🛒 取引所',kind:'shop'}
];
function startJourney(){if(journey&&!journey.finished&&!confirm('進行中の巡礼を破棄して最初から始めますか？'))return;journey={stage:0,hp:40,relics:[],waiting:false,finished:false};$('journey').classList.remove('hidden');makeNodes();renderJourney();showTab('battle')}
function makeNodes(){if(!journey||journey.finished)return;const j=journey;j.waiting=false;const area=Math.floor(j.stage/4)+1;const boss=j.stage%4===3;const pool=boss?[{label:'👑 第'+area+'観測者',kind:'boss'}]:j.stage===0?[EVENTS[0]]:[EVENTS[0],EVENTS[1+R(4)]];j.nodes=pool;renderJourney()}
function selectNode(kind){if(!journey||journey.waiting||journey.finished)return;const j=journey;j.waiting=true;if(kind==='battle'||kind==='elite'||kind==='boss'){j.combat=kind;const max=kind==='boss'?50+Math.floor(j.stage/4)*12:kind==='elite'?47:36+Math.floor(j.stage/4)*7;beginBattle(j.hp,max);add(kind==='boss'?'👑 ボス戦！':kind==='elite'?'⚡ 強敵出現！':'巡礼の敵が現れた。')}else{if(kind==='rest'){j.hp=Math.min(40,j.hp+15);p.hp=j.hp;add('巡礼：HPを15回復')}if(kind==='chest'){award(2);add('巡礼：宝箱から2パック獲得')}if(kind==='shop'){if(profile.shards>=5){profile.shards-=5;award(2);add('巡礼：欠片5で2パック購入')}else{j.hp=Math.min(40,j.hp+8);p.hp=j.hp;add('巡礼：欠片不足。無料でHP8回復')}}j.stage++;if(j.stage>=12){completeJourney()}else makeNodes();render()}}
function journeyBattleEnd(won){const j=journey;if(!j||!j.waiting)return;j.hp=Math.max(0,p.hp);if(!won){j.finished=true;j.waiting=false;award(1);add('巡礼失敗。報酬1パック。再挑戦できる。');renderJourney();return}const boss=j.combat==='boss',elite=j.combat==='elite';award(boss?3:elite?2:1);if(boss||elite){const available=['先制砲','永久機関','生命の泉'];const pick=available.filter(x=>!j.relics.includes(x));if(pick.length){const item=pick[R(pick.length)];j.relics.push(item);add('レリック獲得：'+item)}}j.stage++;if(j.stage>=12)completeJourney();else makeNodes();renderJourney()}
function completeJourney(){journey.finished=true;journey.waiting=false;award(5);add('🏆 因果巡礼踏破！ 追加5パック獲得。');renderJourney()}
function renderJourney(){const j=journey;$('journey').classList.toggle('hidden',!j);if(!j)return;$('journeyStatus').textContent=j.finished?'巡礼終了。新たな巡礼を始められる。':'エリア'+(Math.floor(j.stage/4)+1)+' / '+(j.stage%4+1)+'戦目 · 継続HP '+j.hp+'/40';$('relicStatus').textContent='レリック：'+(j.relics.join(' / ')||'なし');$('journeyNodes').replaceChildren(...(j.finished?[]:(j.nodes||[]).map(n=>{const b=document.createElement('button');b.className='secondary';b.textContent=n.label;b.disabled=j.waiting;b.onclick=()=>selectNode(n.kind);return b})));$('pilgrimageMode').textContent=j.finished?'🗺️ 再挑戦':'🗺️ 因果巡礼'}
$('normalMode').onclick=init;$('pilgrimageMode').onclick=startJourney;


function render(){renderJourney();$('ph').textContent='HP '+Math.max(0,p.hp)+'/40';$('eh').textContent='HP '+Math.max(0,e.hp)+'/'+(e.maxHp||40);$('pb').textContent='防御 '+p.block;$('eb').textContent='防御 '+e.block;$('intent').textContent=intent.name;$('idesc').textContent=intent.desc;$('fate').textContent='因果 '+p.fate+' / 6';$('meter').style.width=Math.min(100,p.fate/6*100)+'%';$('round').textContent='TURN '+turn;$('energy').textContent='⚡ エネルギー '+p.energy+' / '+(journey&&journey.relics.includes('永久機関')?6:5);$('deck').textContent='山札 '+p.deck.length+' / 捨札 '+p.discard.length;$('hand').replaceChildren(...p.hand.map(c=>{let b=document.createElement('button');b.className='card';b.disabled=over||c.cost>p.energy;let name=document.createElement('strong'),desc=document.createElement('span');name.textContent=c.name+'  ◆'+c.cost;desc.textContent=c.desc;b.append(name,desc);b.onclick=()=>play(c.uid);return b}));$('end').disabled=over;$('fateBtn').disabled=over||p.fate<6;$('status').textContent=over?(p.hp<=0?(e.hp<=0?'相討ち':'敗北'):'勝利！'):'';$('log').replaceChildren(...logs.map(s=>{let d=document.createElement('div');d.textContent=s;return d}))}
$('end').onclick=endTurn;$('fateBtn').onclick=breakFate;$('reset').onclick=init;load();init();updateCollection();
</script></html>
