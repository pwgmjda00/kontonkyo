<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>因果決闘 ∞ PARADOX</title><style>:root{font-family:system-ui,sans-serif;color:#f4f2eb;background:#101015}*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:auto;padding:14px}h1{font-size:22px;margin:8px 0;color:#ffe05a}small,.muted{color:#a8a7b4}.panel{background:#1d1d27;border:1px solid #3b394a;border-radius:14px;padding:13px;margin:10px 0}.stats{display:flex;justify-content:space-between;gap:8px}.hp{color:#ff7474}.energy{color:#7fe6ff}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{border:1px solid #79728e;background:#292635;color:white;text-align:left;border-radius:12px;padding:11px;min-height:100px}.card b{display:block;font-size:15px}.card span{font-size:12px;color:#ccc5d9}.card:disabled{opacity:.35}button{cursor:pointer;touch-action:manipulation}button.primary{background:#ffe05a;color:#151515;border:0;padding:12px;border-radius:10px;font-weight:800}button.secondary{background:#333143;color:white;border:1px solid #686277;padding:12px;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.log{max-height:180px;overflow:auto;font-size:13px;line-height:1.6}.log div{border-bottom:1px solid #34323f;padding:3px 0}.meter{height:7px;background:#383440;border-radius:5px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:#d18cff}#status{font-weight:700;color:#ffe05a}</style><main><h1>因果決闘 ∞ PARADOX</h1><small>CPU対戦プロトタイプ v0.1 / 完全オフライン</small><section class="panel"><div class="stats"><div><b>敵：観測者</b><div class="hp" id="eh"></div><small id="es"></small></div><div style="text-align:right"><b>あなた</b><div class="hp" id="ph"></div><small id="ps"></small></div></div><div class="meter"><i id="gauge"></i></div><small id="causal"></small></section><section class="panel"><div id="status"></div><div class="stats"><span class="energy" id="energy"></span><span id="deck"></span></div><p class="muted" style="font-size:13px">カードを選んで行動。ターン終了時に敵が行動します。</p><div class="cards" id="hand"></div><div class="actions" style="margin-top:12px"><button class="primary" id="end">ターン終了 →</button><button class="secondary" id="bend">因果干渉：HPを3回復（因果4）</button><button class="secondary" id="reset">最初から</button></div></section><section class="panel"><b>戦闘ログ</b><div class="log" id="log" aria-live="polite"></div></section></main><script>
const CARDS=[{n:'断絶',c:1,d:'敵に4ダメージ',f:(a,b)=>hit(b,4)},{n:'穿孔',c:2,d:'敵に8ダメージ',f:(a,b)=>hit(b,8)},{n:'障壁',c:1,d:'防御5',f:(a)=>a.block+=5},{n:'反転',c:2,d:'防御4、因果+2',f:(a)=>{a.block+=4;a.fate+=2}},{n:'観測',c:1,d:'1枚引く、因果+1',f:(a)=>{draw(a,1);a.fate++}},{n:'代償',c:0,d:'HPを3失い、エネルギー+2',f:(a)=>{a.hp=Math.max(0,a.hp-3);a.energy+=2}},{n:'修復',c:2,d:'HPを6回復',f:(a)=>a.hp=Math.min(30,a.hp+6)},{n:'侵食',c:1,d:'敵に3ダメージ、次の敵攻撃-2',f:(a,b)=>{hit(b,3);b.weak+=2}},{n:'運命針',c:3,d:'敵に12ダメージ、因果+1',f:(a,b)=>{hit(b,12);a.fate++}},{n:'虚無',c:2,d:'敵の防御を無視して5ダメージ',f:(a,b)=>b.hp-=5},{n:'残響',c:1,d:'防御3、敵に2ダメージ',f:(a,b)=>{a.block+=3;hit(b,2)}},{n:'賭博',c:1,d:'50%で10ダメージ、失敗で自傷2',f:(a,b)=>Math.random()<.5?hit(b,10):a.hp-=2}];
let p,e,turn,over,logs;
const $=id=>document.getElementById(id);const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const log=t=>{logs.unshift(t);logs=logs.slice(0,35)};
function draw(a,n){for(let i=0;i<n;i++){if(!a.deck.length){a.deck=shuffle(a.discard.splice(0));if(!a.deck.length)return}a.hand.push(a.deck.pop())}}
function hit(a,d){let absorbed=Math.min(a.block,d);a.block-=absorbed;a.hp-=d-absorbed}
function init(){p={hp:30,block:0,fate:0,energy:3,weak:0,hand:[],deck:shuffle([...CARDS,...CARDS,...CARDS].map(x=>({...x}))),discard:[]};e={hp:30,block:0,fate:0,energy:3,weak:0};turn=1;over=false;logs=[];draw(p,5);log('決闘開始。先攻はあなた。');render()}
function finish(){if(p.hp<=0||e.hp<=0){over=true;log(p.hp<=0&&e.hp<=0?'相討ち。':e.hp<=0?'勝利！因果を断ち切った。':'敗北。観測は終了した。');return true}return false}
function play(i){if(over)return;const c=p.hand[i];if(!c||c.c>p.energy)return;p.energy-=c.c;p.hand.splice(i,1);c.f(p,e);p.discard.push(c);log('あなた：'+c.n+'。'+c.d);finish();render()}
function enemy(){e.block=0;let move=Math.random();if(e.hp<15&&move<.28){e.hp=Math.min(30,e.hp+5);log('観測者：再構成。HP+5')}else if(move<.5){e.block+=5;log('観測者：障壁。防御+5')}else{let d=move<.8?7:11;d=Math.max(0,d-e.weak);e.weak=0;hit(p,d);log('観測者：攻撃 '+d+'ダメージ')}finish()}
function endTurn(){if(over)return;enemy();if(over){render();return}p.block=0;p.energy=3;p.discard.push(...p.hand.splice(0));draw(p,5);turn++;log('第'+turn+'ターン。');render()}
function bend(){if(over||p.fate<4)return;p.fate-=4;p.hp=Math.min(30,p.hp+3);log('因果干渉：HP+3');render()}
function render(){$('ph').textContent='HP '+Math.max(0,p.hp)+'/30';$('eh').textContent='HP '+Math.max(0,e.hp)+'/30';$('ps').textContent='防御 '+p.block;$('es').textContent='防御 '+e.block;$('gauge').style.width=Math.min(100,p.fate/10*100)+'%';$('causal').textContent='因果 '+p.fate+' / 10';$('energy').textContent='エネルギー '+p.energy+'/3';$('deck').textContent='山札 '+p.deck.length+'枚';$('status').textContent=over?(p.hp<=0?'決闘終了：敗北': '決闘終了：勝利'):'第'+turn+'ターン';$('hand').replaceChildren(...p.hand.map((c,i)=>{let b=document.createElement('button');b.className='card';b.disabled=over||c.c>p.energy;b.innerHTML='<b></b><span></span>';b.querySelector('b').textContent=c.n+' ◈'+c.c;b.querySelector('span').textContent=c.d;b.onclick=()=>play(i);return b}));$('log').replaceChildren(...logs.map(t=>{let d=document.createElement('div');d.textContent=t;return d}));$('end').disabled=over;$('bend').disabled=over||p.fate<4}
$('end').onclick=endTurn;$('bend').onclick=bend;$('reset').onclick=init;init();
</script></html>
