<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>因果決闘 ∞ PARADOX β0.2</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#0d0d14;color:#f5f2e9}*{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:auto;padding:12px 12px 50px}h1{font-size:22px;margin:8px 0;color:#ffde50;letter-spacing:.03em}.sub{color:#9d9bae;font-size:12px}.panel{background:#1b1a26;border:1px solid #39364b;border-radius:14px;padding:13px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.hp{font-weight:800;color:#ff888b}.block{color:#91d8ff;font-size:13px}.intent{background:#31263b;border:1px solid #8d5b9e;border-radius:12px;padding:12px;margin:10px 0}.intent b{color:#ffd06a}.hint{font-size:12px;color:#b8b4c7}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:#29263a;color:white;border:1px solid #68607d;border-radius:12px;padding:12px;text-align:left;min-height:110px}.card strong{display:block;font-size:15px;margin-bottom:6px}.card span{font-size:12px;line-height:1.5;color:#d3cddd}.card:disabled{opacity:.32}.card .cost{float:right;color:#ffdb64}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{touch-action:manipulation;cursor:pointer}button.primary{background:#ffdf56;color:#191522;border:0;border-radius:10px;padding:12px;font-weight:800}button.secondary{background:#363149;color:white;border:1px solid #79708e;border-radius:10px;padding:12px;font-weight:700}button:disabled{opacity:.35;cursor:default}.energy{color:#9ce5ff;font-weight:800}.fate{color:#e5b2ff;font-weight:800}.log{max-height:150px;overflow:auto;font-size:12px;line-height:1.6}.log div{padding:4px 0;border-bottom:1px solid #383447}.tag{font-size:11px;border-radius:4px;padding:2px 5px;background:#49354d;color:#f5c8ff}.end{font-size:18px;font-weight:900;color:#ffdc64}.meter{height:7px;background:#363142;border-radius:7px;overflow:hidden;margin:7px 0}.meter i{display:block;background:#bb7eff;height:100%;transition:width .2s}
</style><main><h1>因果決闘 ∞ PARADOX</h1><div class="sub">β0.2 / CPU戦・敵の未来を公開 / オフライン</div>
<section class="panel"><div class="row"><div><b>観測者</b><div class="hp" id="eh"></div><div class="block" id="eb"></div></div><div style="text-align:right"><b>あなた</b><div class="hp" id="ph"></div><div class="block" id="pb"></div></div></div><div class="intent"><div class="hint">🔮 観測された次の行動</div><b id="intent"></b><div class="hint" id="idesc"></div></div><div class="row"><span class="fate" id="fate"></span><span class="hint" id="round"></span></div><div class="meter"><i id="meter"></i></div></section>
<section class="panel"><div class="row"><span class="energy" id="energy"></span><span class="hint" id="deck"></span></div><p class="hint">カードを組み合わせて敵の予告を攻略。因果6で必殺技を使える。</p><div class="cards" id="hand"></div><div class="actions"><button id="end" class="primary">ターン終了 →</button><button id="fateBtn" class="secondary">⚡ 因果断絶（因果6）</button><button id="reset" class="secondary">最初から</button></div><p id="status" class="end"></p></section><section class="panel"><b>戦闘ログ</b><div id="log" class="log"></div></section></main>
<script>
const $=id=>document.getElementById(id),R=n=>Math.floor(Math.random()*n),shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let p,e,turn,over,intent,logs,serial=0;
const cards=[
['裂界',1,'敵に7ダメージ。', (a,b)=>hit(b,7)],
['処刑宣告',3,'敵に17ダメージ。敵HPが半分以下なら24。',(a,b)=>hit(b,b.hp<=20?24:17)],
['絶対障壁',2,'防御14。',(a)=>a.block+=14],
['反逆',2,'防御8。敵に8ダメージ。',(a,b)=>{a.block+=8;hit(b,8)}],
['代償契約',0,'HPを5失い、エネルギー+3、因果+2。',(a)=>{a.hp-=5;a.energy+=3;a.fate+=2}],
['略奪',1,'敵に5ダメージ。2枚引く。',(a,b)=>{hit(b,5);draw(a,2)}],
['鏡面',2,'敵の予告攻撃を反射し、その攻撃を無効化。',(a,b)=>{if(intent.kind==='attack'||intent.kind==='burst'){hit(b,intent.value);intent={kind:'none',name:'攻撃を反射された',desc:'敵は行動できない'};}else a.block+=8}],
['時間停止',3,'敵の予告行動をキャンセル。因果+2。',(a)=>{intent={kind:'none',name:'時間停止',desc:'敵は行動できない'};a.fate+=2}],
['予言破り',2,'敵に9ダメージ。予告が攻撃ならさらに9。',(a,b)=>hit(b,(intent.kind==='attack'||intent.kind==='burst')?18:9)],
['血の祭壇',1,'HPを4失い、敵に16ダメージ。',(a,b)=>{a.hp-=4;hit(b,16)}],
['崩壊',3,'敵に22ダメージ。自分の防御を0にする。',(a,b)=>{a.block=0;hit(b,22)}],
['神経接続',1,'因果+3。1枚引く。',(a)=>{a.fate+=3;draw(a,1)}],
['量子跳躍',2,'手札をすべて捨て、4枚引く。エネルギー+1。',(a)=>{a.discard.push(...a.hand.splice(0));draw(a,4);a.energy++}],
['二重螺旋',2,'敵に6ダメージを3回。',(a,b)=>{for(let i=0;i<3;i++)hit(b,6)}],
['断罪',4,'敵に28ダメージ。自分も6ダメージ。',(a,b)=>{hit(b,28);a.hp-=6}],
['再起動',2,'HPを12回復。因果+1。',(a)=>{a.hp=Math.min(40,a.hp+12);a.fate++}],
['天秤',1,'HPが敵より低ければ敵に14ダメージ、そうでなければ防御12。',(a,b)=>{if(a.hp<b.hp)hit(b,14);else a.block+=12}],
['過剰演算',0,'エネルギー+2。敵に4ダメージ。',(a,b)=>{a.energy+=2;hit(b,4)}],
['重力反転',2,'敵の防御を消去し、敵に10ダメージ。',(a,b)=>{b.block=0;hit(b,10)}],
['最後の一秒',1,'HPが15以下なら敵に20、そうでなければ8ダメージ。',(a,b)=>hit(b,a.hp<=15?20:8)]
].map(([name,cost,desc,act],id)=>({name,cost,desc,act,id}));
function hit(a,n){let block=Math.min(a.block,n);a.block-=block;a.hp-=n-block}
function draw(a,n){for(let i=0;i<n;i++){if(!a.deck.length){a.deck=shuffle(a.discard.splice(0));if(!a.deck.length)break}a.hand.push(a.deck.pop())}}
function add(s){logs.unshift(s);logs=logs.slice(0,40)}
function plan(){const pool=[{kind:'attack',value:12,name:'斬撃予告',desc:'防御しなければ12ダメージ'},{kind:'burst',value:20,name:'終末砲',desc:'防御しなければ20ダメージ'},{kind:'guard',value:16,name:'結界展開',desc:'防御16を獲得'},{kind:'drain',value:8,name:'生命吸収',desc:'8ダメージを与え、実際に与えた分だけ回復'},{kind:'attack',value:15,name:'神罰',desc:'防御しなければ15ダメージ'},{kind:'charge',value:0,name:'再構築',desc:'HPを10回復、ただし最大40'}];return {...pool[R(pool.length)]}}
function init(){p={hp:40,block:0,energy:5,fate:0,hand:[],deck:shuffle([...cards,...cards].map(c=>({...c,uid:++serial}))),discard:[]};e={hp:40,block:0};turn=1;over=false;logs=[];intent=plan();draw(p,5);add('決闘開始。敵の予告を見て行動しよう。');render()}
function finish(){if(p.hp<=0||e.hp<=0){over=true;add(p.hp<=0&&e.hp<=0?'相討ち':e.hp<=0?'勝利！ 観測者を撃破した。':'敗北。因果は閉じた。');return true}return false}
function play(uid){if(over)return;let i=p.hand.findIndex(c=>c.uid===uid);if(i<0)return;let c=p.hand[i];if(c.cost>p.energy)return;p.energy-=c.cost;p.hand.splice(i,1);c.act(p,e);p.discard.push(c);add('あなた：'+c.name+'。'+c.desc);finish();render()}
function enemy(){e.block=0;const k=intent.kind;if(k==='attack'||k==='burst'){hit(p,intent.value);add('敵：'+intent.name+' '+intent.value+'ダメージ')}else if(k==='drain'){let before=p.hp;hit(p,intent.value);let dealt=Math.max(0,before-p.hp);e.hp=Math.min(40,e.hp+dealt);add('敵：生命吸収 '+dealt+'吸収')}else if(k==='guard'){e.block+=intent.value;add('敵：防御'+intent.value)}else if(k==='charge'){e.hp=Math.min(40,e.hp+10);add('敵：HP+10')}else add('敵：行動不能');finish()}
function endTurn(){if(over)return;enemy();if(over){render();return}p.block=0;p.energy=5;p.discard.push(...p.hand.splice(0));draw(p,5);turn++;intent=plan();add('第'+turn+'ターン。新たな未来を観測。');render()}
function breakFate(){if(over||p.fate<6)return;p.fate-=6;let before=intent.name;intent={kind:'none',name:'因果断絶',desc:'敵の行動は完全に消滅した'};e.block=0;hit(e,18);p.energy+=2;add('⚡ 因果断絶！ '+before+'を消滅。敵に18ダメージ、エネルギー+2');finish();render()}
function render(){$('ph').textContent='HP '+Math.max(0,p.hp)+'/40';$('eh').textContent='HP '+Math.max(0,e.hp)+'/40';$('pb').textContent='防御 '+p.block;$('eb').textContent='防御 '+e.block;$('intent').textContent=intent.name;$('idesc').textContent=intent.desc;$('fate').textContent='因果 '+p.fate+' / 6';$('meter').style.width=Math.min(100,p.fate/6*100)+'%';$('round').textContent='TURN '+turn;$('energy').textContent='⚡ エネルギー '+p.energy+' / 5';$('deck').textContent='山札 '+p.deck.length+' / 捨札 '+p.discard.length;$('hand').replaceChildren(...p.hand.map(c=>{let b=document.createElement('button');b.className='card';b.disabled=over||c.cost>p.energy;let name=document.createElement('strong'),desc=document.createElement('span');name.textContent=c.name+'  ◆'+c.cost;desc.textContent=c.desc;b.append(name,desc);b.onclick=()=>play(c.uid);return b}));$('end').disabled=over;$('fateBtn').disabled=over||p.fate<6;$('status').textContent=over?(p.hp<=0?(e.hp<=0?'相討ち':'敗北'):'勝利！'):'';$('log').replaceChildren(...logs.map(s=>{let d=document.createElement('div');d.textContent=s;return d}))}
$('end').onclick=endTurn;$('fateBtn').onclick=breakFate;$('reset').onclick=init;init();
</script></html>
