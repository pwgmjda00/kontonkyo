function hit(a,n){let block=Math.min(a.block,n);a.block-=block;a.hp-=n-block}
function draw(a,n){for(let i=0;i<n;i++){if(!a.deck.length){a.deck=shuffle(a.discard.splice(0));if(!a.deck.length)break}a.hand.push(a.deck.pop())}}
function add(s){logs.unshift(s);logs=logs.slice(0,40)}
function plan(){const pool=[{kind:'attack',value:12,name:'斬撃予告',desc:'防御しなければ12ダメージ'},{kind:'burst',value:20,name:'終末砲',desc:'防御しなければ20ダメージ'},{kind:'guard',value:16,name:'結界展開',desc:'防御16を獲得'},{kind:'drain',value:8,name:'生命吸収',desc:'8ダメージを与え、実際に与えた分だけ回復'},{kind:'attack',value:15,name:'神罰',desc:'防御しなければ15ダメージ'},{kind:'charge',value:0,name:'再構築',desc:'HPを10回復、ただし最大40'}];return {...pool[R(pool.length)]}}
function init(){p={hp:40,block:0,energy:5,fate:0,hand:[],deck:shuffle([...cards,...cards].map(c=>({...c,uid:++serial}))),discard:[]};e={hp:40,block:0};turn=1;over=false;logs=[];intent=plan();draw(p,5);add('決闘開始。敵の予告を見て行動しよう。');render()}
function finish(){if(p.hp<=0||e.hp<=0){over=true;add(p.hp<=0&&e.hp<=0?'相討ち':e.hp<=0?'勝利！ 観測者を撃破した。':'敗北。因果は閉じた。');return true}return false}
function play(uid){if(over)return;let i=p.hand.findIndex(c=>c.uid===uid);if(i<0)return;let c=p.hand[i];if(c.cost>p.energy)return;p.energy-=c.cost;p.hand.splice(i,1);c.act(p,e);p.discard.push(c);add('あなた：'+c.name+'。'+c.desc);finish();render()}
function enemy(){e.block=0;const k=intent.kind;if(k==='attack'||k==='burst'){hit(p,intent.value);add('敵：'+intent.name+' '+intent.value+'ダメージ')}else if(k==='drain'){let before=p.hp;hit(p,intent.value);let dealt=Math.max(0,before-p.hp);e.hp=Math.min(40,e.hp+dealt);add('敵：生命吸収 '+dealt+'吸収')}else if(k==='guard'){e.block+=intent.value;add('敵：防御'+intent.value)}else if(k==='charge'){e.hp=Math.min(40,e.hp+10);add('敵：HP+10')}else add('敵：行動不能');finish()}
function endTurn(){if(over)return;enemy();if(over){render();return}p.block=0;p.energy=5;p.discard.push(...p.hand.splice(0));draw(p,5);turn++;intent=plan();add('第'+turn+'ターン。新たな未来を観測。');render()}
function breakFate(){if(over||p.fate<6)return;p.fate-=6;let before=intent.name;intent={kind:'none',name:'因果断絶',desc:'敵の行動は完全に消滅した'};e.block=0;hit(e,18);p.energy+=2;add('⚡ 因果断絶！ '+before+'を消滅。敵に18ダメージ、エネルギー+2');finish();render()}
function render(){$('ph').textContent='HP '+Math.max(0,p.hp)+'/40';$('eh').textContent='HP '+Math.max(0,e.hp)+'/40';$('pb').textContent='防御 '+p.block;$('eb').textContent='防御 '+e.block;$('intent').textContent=intent.name;$('idesc').textContent=intent.desc;$('fate').textContent='因果 '+p.fate+' / 6';$('meter').style.width=Math.min(100,p.fate/6*100)+'%';$('round').textContent='TURN '+turn;$('energy').textContent='⚡ エネルギー '+p.energy+' / 5';$('deck').textContent='山札 '+p.deck.length+' / 捨札 '+p.discard.length;$('hand').replaceChildren(...p.hand.map(c=>{let b=document.createElement('button');b.className='card';b.disabled=over||c.cost>p.energy;let name=document.createElement('strong'),desc=document.createElement('span');name.textContent=c.name+'  ◆'+c.cost;desc.textContent=c.desc;b.append(name,desc);b.onclick=()=>play(c.uid);return b}));$('end').disabled=over;$('fateBtn').disabled=over||p.fate<6;$('status').textContent=over?(p.hp<=0?(e.hp<=0?'相討ち':'敗北'):'勝利！'):'';$('log').replaceChildren(...logs.map(s=>{let d=document.createElement('div');d.textContent=s;return d}))}
$('end').onclick=endTurn;$('fateBtn').onclick=breakFate;$('reset').onclick=init;init();
</script></html>
