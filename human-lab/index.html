const qs=[['愛される才能と、愛する才能。','愛される才能','愛する才能'],['過去を一度だけ変える？','変える','変えない'],['理解されることと自由であること。','理解されたい','自由でいたい'],['優しい嘘と残酷な真実。','優しい嘘','残酷な真実'],['人生をもう一度選べるなら？','同じ人生','別の人生'],['誰にも知られない善行に意味はある？','ある','ない'],['友情と恋愛、どちらを守る？','友情','恋愛'],['未来を知ることができるなら？','知りたい','知りたくない']];let idx=0,peer=null,choice=null,history=[];try{history=JSON.parse(localStorage.getItem('humanlab')||'[]');const x=JSON.parse(new URLSearchParams(location.hash.slice(1)).get('experiment')||'null');if(x&&Array.isArray(x.q)&&x.q.length===3&&x.q.every(v=>typeof v==='string'&&v.length<=160)&&[0,1].includes(x.a)){qs.unshift(x.q);peer=x.a}}catch{}const panel=document.querySelector('#panel'),status=document.querySelector('#status');function el(tag,t,cls){const e=document.createElement(tag);e.textContent=t;if(cls)e.className=cls;return e}function add(tag,t,cls){let e=el(tag,t,cls);panel.append(e);return e}function btn(t,f,cls){let e=add('button',t,cls);e.onclick=f;return e}function markNav(mode){document.querySelectorAll('nav button').forEach((b,i)=>{let on=['play','create','sheet','diagnosis','profile'][i]===mode;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false')})}function show(mode){markNav(mode);window.scrollTo(0,0);panel.replaceChildren();status.textContent='';if(mode==='play'){let q=qs[idx];add('small','EXPERIMENT / '+String(idx+1).padStart(3,'0'));add('h2',q[0]);q.slice(1).forEach((v,i)=>btn(v,()=>{choice=i;history.push({q:[...q],a:i});try{localStorage.setItem('humanlab',JSON.stringify(history))}catch{}show('play')},choice===i?'selected':''));if(choice!==null){add('p',peer===null?'あなたの回答を記録しました。':peer===choice?'送信者と同じ回答でした。':'送信者とは異なる回答でした。');if(peer!==null)add('p','送信者：'+q[peer+1]);btn('この実験を友達に送る',share,'primary')}btn('次の実験 →',()=>{idx=(idx+1)%qs.length;choice=null;peer=null;show('play')})}else if(mode==='create'){add('h2','あなたの実験を作る');let fields=['質問','選択肢 A','選択肢 B'].map((v,i)=>{add('label',v);let e=add('input','');e.placeholder=v;e.maxLength=i?80:160;return e});btn('実験を開始',()=>{let q=fields.map(e=>e.value.trim());if(q.some(v=>!v)||q[1]===q[2]){status.textContent='質問と異なる二つの選択肢を入力してください。';return}qs.push(q);idx=qs.length-1;choice=null;peer=null;show('play')},'primary')}else if(mode==='diagnosis'){diagnosis()}else if(mode==='profile'){profile()}else{add('h2','人間標本');btn('自己紹介シートを作る',sheet,'primary');add('p',history.length+' 件の回答');history.slice().reverse().forEach(r=>{add('p',r.q[0]);add('b',r.q[r.a+1])});btn('履歴を削除',()=>{if(confirm('回答履歴を削除しますか？')){history=[];try{localStorage.removeItem('humanlab')}catch{}show('record')}})}}async function share(){let u=new URL(location.href);u.hash=new URLSearchParams({experiment:JSON.stringify({q:qs[idx],a:choice})}).toString();if(location.protocol==='file:'){status.textContent='公開サーバーに配置すると友達へのURL共有が使えます。';return}try{if(navigator.share)await navigator.share({title:'人間実験室',text:qs[idx][0],url:u.href});else{await navigator.clipboard.writeText(u.href);status.textContent='共有URLをコピーしました。'}}catch(e){if(e.name!=='AbortError')status.textContent=u.href}}const tests=[
{id:'love',title:'愛情のかたち',axis:['言葉','行動'],items:[['嬉しいのは？','好きと言われる','会いに来てくれる'],['感謝を伝えるなら？','言葉にする','手伝う'],['大切な記念日は？','手紙を書く','一緒に過ごす'],['落ち込んだ時は？','話を聞いてほしい','そばにいてほしい']]},
{id:'thought',title:'思考の方向',axis:['直感探索型','論理整理型'],items:[['未知の問題は？','まず試す','まず整理する'],['発想の源は？','連想','分析'],['迷ったら？','感覚を頼る','根拠を探す'],['新しい趣味は？','触って覚える','仕組みを調べる']]},
{id:'social',title:'人との距離感',axis:['交流充電型','静寂充電型'],items:[['休日は？','誰かと過ごす','一人で過ごす'],['考えをまとめるなら？','会話する','書き出す'],['疲れたら？','気の合う人と話す','静かな場所へ'],['理想の時間は？','賑やかな食卓','静かな読書']]},
{id:'world',title:'世界との向き合い方',axis:['変化探求型','安定育成型'],items:[['旅なら？','未知の街','好きな街'],['生活は？','新しい刺激','安心できる習慣'],['作品作りは？','実験を重ねる','一つを磨く'],['未来は？','可能性を広げる','基盤を育てる']]}
];let results={};try{results=JSON.parse(localStorage.getItem('humanlab-diagnoses')||'{}')||{}}catch{}function diagnosis(){add('h2','診断実験室');btn('MBTIを登録',mbti,'primary');add('p','正解のない自己表現テスト。心理検査ではありません。');tests.forEach(t=>btn(t.title+(results[t.id]?' / '+results[t.id]:''),()=>runTest(t,0,[])));btn('自己紹介シート',sheet,'primary')}const mbtiTypes=Array.from({length:16},(_,i)=>['EI','SN','TF','JP'].map((x,j)=>x[(i>>j)&1]).join(''));
const mbtiQuestions=[['E','I','休日の充電方法は？','人と交流','一人の時間'],['E','I','考えを整理するなら？','話しながら','一人で考える'],['E','I','初対面の場では？','自分から話す','様子を見る'],['S','N','説明で重視するのは？','具体例','全体像'],['S','N','興味を引くのは？','現実の事実','未知の可能性'],['S','N','学ぶなら？','実践から','概念から'],['T','F','判断で重視するのは？','一貫した基準','人への影響'],['T','F','相談されたら？','解決策を考える','気持ちを聞く'],['T','F','意見が割れたら？','根拠を比較','互いの価値観を確認'],['J','P','旅行の準備は？','予定を決める','現地で決める'],['J','P','仕事の進め方は？','先に計画','状況に応じる'],['J','P','安心するのは？','決定済み','選択肢が残る']];
function mbti(){panel.replaceChildren();add('h2','MBTI / 16タイプ');add('p','知っているタイプだけ登録。知らなければスキップ。');let sel=add('select','');['未設定',...mbtiTypes].forEach(v=>{let o=el('option',v);o.value=v;sel.append(o)});sel.value=answers.MBTI||'未設定';btn('タイプを登録',()=>{answers.MBTI=sel.value==='未設定'?'':sel.value;picks['p:MBTI']=!!answers.MBTI;saveProfile();sheet()},'primary');btn('スキップ',sheet)}
function diagnosisBack(){show('diagnosis')}
function mbtiRun(i,a){panel.replaceChildren();let q=mbtiQuestions[i];add('small','簡易16タイプ / '+(i+1)+' / 12');add('h2',q[2]);[q[3],q[4]].forEach((v,j)=>btn(v,()=>{let n=[...a,j];if(i<11)return mbtiRun(i+1,n);let type=['EI','SN','TF','JP'].map((x,k)=>x[n.slice(k*3,k*3+3).reduce((a,b)=>a+b,0)>=2?1:0]).join('');results.mbti=type+'（簡易）';try{localStorage.setItem('humanlab-diagnoses',JSON.stringify(results))}catch{}panel.replaceChildren();add('h2',results.mbti);add('p','非公式の参考結果です。');btn('結果をシートに追加',()=>{picks['d:mbti']=true;saveProfile();sheet()},'primary');btn('掲載せず戻る',sheet);btn('診断一覧',diagnosisBack)}));if(i)btn('前の質問',()=>mbtiRun(i-1,a.slice(0,-1)));btn('中止',sheet)}
function runTest(t,i,a){panel.replaceChildren();add('small',t.title+' / '+(i+1)+' / '+t.items.length);add('h2',t.items[i][0]);t.items[i].slice(1).forEach((v,j)=>btn(v,()=>{let next=[...a,j];if(next.length<t.items.length)return runTest(t,i+1,next);let n=next.reduce((x,y)=>x+y,0);results[t.id]=n*2===next.length?'両方の傾向':t.axis[n*2>next.length?1:0];try{localStorage.setItem('humanlab-diagnoses',JSON.stringify(results))}catch{}panel.replaceChildren();add('small',t.title);add('h2',results[t.id]);add('p','今回の回答から得られた遊びの結果です。');btn('結果をシートに追加',()=>{picks['d:'+t.id]=true;saveProfile();sheet()},'primary');btn('掲載せず戻る',sheet);btn('診断一覧',()=>show('diagnosis'))}))}
const groups={基本情報:['MBTI','名前','呼び方','年齢','誕生日','性別','代名詞','居住地域（都道府県など）','職業','ひとこと'],趣味と日常:['好きなもの','嫌いなもの・苦手なもの','趣味','好きな音楽','好きな作品','好きなゲーム','好きな食べ物','休日の過ごし方','得意なこと','苦手なこと'],内面と思想:['大切にしている価値観','人生の目標','幸福とは','人生観','死生観','自分の長所','自分の短所','譲れないこと','自分を表す言葉'],人間関係:['友達募集','交流スタイル','DMについて','通話について','会うことについて','接し方の希望','苦手な接し方'],プライベート:['恋愛対象・性的指向','性自認','恋愛状況','恋愛観','結婚観','性的な話題への距離感','宗教・信仰','政治的価値観','心身の健康について','障害・特性について','必要な配慮','家族について','お金・生活について','過去の経験について'],自由記述:['自己紹介','今伝えたいこと','自由欄']};
