const R=Math.random, W=240,H=144;let people=[],houses=[],food=[],cats=[],year=0,clock=0,last=0,acc=0,speed=1,births=0,deaths=0,lawCount=0;const limit=(x,a,b)=>Math.max(a,Math.min(b,x));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const pos=()=>({x:8+R()*224,y:12+R()*122});let serial=0;const given=['アダム','イブ','ノア','リリ','ルカ','ミラ','ネロ','ソラ','ニコ','ユラ','エマ','カイ'];const person=(p=pos())=>({...p,id:++serial,name:given[(serial-1)%given.length]+(serial>12?' '+Math.ceil(serial/12):''),age:12+R()*22,hunger:R()*20,energy:80,dx:R()*2-1,dy:R()*2-1,job:R()<.5?'farmer':'builder',cool:0});for(let i=0;i<12;i++)people.push(person());for(let i=0;i<45;i++)food.push(pos());for(let i=0;i<3;i++)houses.push(pos());const status=document.createElement('div');status.style.cssText='font:12px system-ui;padding:6px 0;color:#d4c78a';land.after(status);const events=[];const diary=document.createElement('div');diary.style.cssText='font:12px/1.5 system-ui;color:#e5d8a7;min-height:54px;padding:5px 0;white-space:pre-line';status.after(diary);function note(msg){events.unshift(Math.floor(year)+'年 '+msg);events.splice(3);diary.textContent=events.join('\n')}note('12人がこの土地に降り立った。');const controls=document.createElement('div');controls.style.cssText='display:flex;gap:6px';status.after(controls);for(const [label,n] of [['停止',0],['通常',1],['高速',4]]){const b=document.createElement('button');b.textContent=label;b.style.cssText='flex:1;min-height:36px;padding:5px;text-align:center';b.onclick=()=>{speed=n;for(const c of controls.children)c.style.opacity=c===b?'1':'.55'};controls.append(b)}function nearest(p,arr){let best=null,d=Infinity;for(const a of arr){const k=dist(p,a);if(k<d){d=k;best=a}}return best}function step(dt){year+=dt*.8;if(people.length===0&&R()<dt*.12){people.push(person(),person());note('遠い土地から二人の旅人が来た。')}const immortal=active.some(i=>/不老|不死|寿命/.test(laws[i][0])),fly=active.includes(25),catlaw=active.includes(22);if(catlaw&&cats.length<12&&R()<dt*.4)cats.push(pos());if(food.length<90&&R()<dt*(2+v[
